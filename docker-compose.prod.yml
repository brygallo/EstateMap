version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estatemap_backend
    restart: always

    env_file:
      - .env.prod

    environment:
      # The web process enqueues the optimization, so it needs the broker as
      # much as the worker does. Shared Redis, index 0 for this system.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://aents-redis:6379/0}
      # Index 1 on the same instance holds the public read cache, so flushing
      # the cache can never drop queued tasks.
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://aents-redis:6379/1}
      # On-demand revalidation of the Next.js cache; REVALIDATE_SECRET comes
      # from .env.prod and an empty one turns the call into a no-op.
      NEXT_REVALIDATE_URL: ${NEXT_REVALIDATE_URL:-http://frontend:3000/api/revalidate}

    # Threads, not more processes. Almost everything a request here waits on is
    # somebody else's I/O — Postgres, Redis, MinIO, the SMTP relay, the Next.js
    # revalidation hook — and a sync worker blocks entirely while it waits, so
    # three of them meant three concurrent requests for the whole portal: one
    # slow publish took a third of the site with it. Threads share the process
    # and its memory, which is the constraint on this box; adding processes is
    # not.
    #
    # The timeout is raised from the implicit 30 s for the same reason: a
    # publish with photos measured 26 s in production, four seconds from being
    # killed mid-write with the listing already created.
    command: >-
      gunicorn estate_map.wsgi:application --bind 0.0.0.0:8000
      --worker-class gthread --workers 3 --threads 4 --timeout 120

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - pending_images:/app/tmp/pending-images

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - estatemap_network
      - aents_shared

  # Image optimization runs here instead of inside the upload request. The
  # broker is the host's Redis, shared with the other Aents systems; this
  # project owns database index 0 (see settings.py for the registry).
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estatemap_worker
    restart: always

    env_file:
      - .env.prod

    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://aents-redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://aents-redis:6379/1}
      NEXT_REVALIDATE_URL: ${NEXT_REVALIDATE_URL:-http://frontend:3000/api/revalidate}

    # -B runs beat inside the worker: one process covers both the queue and the
    # hourly sweep. Safe here because this system runs exactly one worker.
    command: celery -A estate_map worker -B --loglevel=info --concurrency=1 --max-tasks-per-child=50

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Same staging directory the web container writes uploads to. Without this
      # shared volume the worker cannot see the file it is asked to optimize.
      - pending_images:/app/tmp/pending-images

    # This queue is secondary and takes as long as it takes, so it is sized to
    # stay out of everyone's way on an 8 GB / 4 vCPU host shared with Aents, the
    # mail stack and nginx. One task at a time; 512 MB covers a single 1920px
    # encode with room for the decoded source.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    # Relative CPU weight, default is 1024. Under contention the kernel serves
    # web traffic first and lets the optimizer wait.
    cpu_shares: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      - backend

    networks:
      - estatemap_network
      - aents_shared

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Next.js build-time environment variables
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        # Google OAuth (Frontend)
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}

    container_name: estatemap_frontend
    restart: always

    # The only container on this box with no ceiling, and the hungriest: it sits
    # around 860 MB serving SSR plus sharp's image resizing. Uncapped, its next
    # peak is paid by everybody else — the host is 8 GB shared with Aents, the
    # mailserver and roundcube, and the last time it filled up the kernel put
    # 129 MB of MinIO on disk, which is why one publish waited 26 s. The limit
    # is not there to make Next.js smaller; it is there so a spike here cannot
    # push somebody else's working set into swap. Roughly 75% headroom over the
    # observed steady state, so ordinary traffic never reaches it.
    mem_limit: 1500m

    environment:
      # Runtime environment variables (if needed)
      NODE_ENV: production
      PORT: 3000
      # Google OAuth debe estar disponible en runtime también
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

    # The API hostname is proxied through Cloudflare, so resolving it normally
    # would send every server-rendered page out to an edge and back before it
    # could read its own database. Pinning it to the host gateway keeps the URL
    # identical — same TLS, same certificate, same nginx vhost — while the
    # request never leaves the machine. It also means a CDN incident degrades
    # visitors, not rendering.
    extra_hosts:
      - "api.geopropiedadesecuador.com:host-gateway"

    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    depends_on:
      backend:
        condition: service_healthy

    # No aents_shared here: the frontend never talks to the broker.
    networks:
      - estatemap_network

volumes:
  static_volume:
  media_volume:
  pending_images:

networks:
  estatemap_network:
    driver: bridge

  # Cross-project network carrying the Redis every Aents system shares. Created
  # once by the aents-shared stack; declared external here so this compose joins
  # it instead of trying to own it.
  aents_shared:
    external: true
