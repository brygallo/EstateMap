services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-estatedb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-estatedb}"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SERVER_URL: "http://localhost:9020"
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - minio_data:/data
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # The web process is the one that enqueues, so it needs the broker too.
      CELERY_BROKER_URL: redis://redis:6379/0
      # Index 1 holds the read cache, kept apart from the broker on index 0 so
      # flushing one never touches the other.
      REDIS_CACHE_URL: redis://redis:6379/1
      # On-demand revalidation of the Next.js cache. Without REVALIDATE_SECRET
      # in .env the backend logs and skips, which is the default in dev.
      NEXT_REVALIDATE_URL: http://frontend:3000/api/revalidate
    command: >
      sh -c "python manage.py migrate &&
             python init_minio.py &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
  redis:
    # Dev-only broker. Production reuses the host's Redis, shared with the other
    # Aents systems; here a throwaway container keeps the setup self-contained.
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: ./backend
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      # The worker runs the revalidation task and imports, which invalidate the
      # same cache the web process reads.
      NEXT_REVALIDATE_URL: http://frontend:3000/api/revalidate
    command: celery -A estate_map worker -B --loglevel=info --concurrency=1
    volumes:
      # Same bind mount as backend, so both see the staging directory.
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - .env
    environment:
      NEXT_INTERNAL_API_URL: http://backend:8000/api
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
volumes:
  postgres_data:
  minio_data:
  redis_data:
