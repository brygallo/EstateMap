      la mataría. status es read_only en la creación, así que nadie puede dar de
      alta un lead ya marcado como gestionado.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1146-1148"
        symbol: "if self.action == 'create':"
      - file: backend/real_estate/serializers.py
        lines: "499-503"
