          source: property_page
          status: contacted
        note: >-
          El cuerpo manda status a propósito: al ser de solo lectura en la
          creación, la petición se acepta igual (201) y el valor se descarta. El
          201 por sí solo no demuestra el descarte; eso lo sostiene
