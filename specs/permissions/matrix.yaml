  - id: PERM-049
    name: Cualquier staff puede conceder is_staff a otra cuenta
    status: implemented
    summary: >-
      La edición de usuarios del panel admite exactamente is_active e is_staff, y
      basta con ser staff para otorgar el rol de staff a un tercero.
    rationale: >-
      DEFECTO por privilegio excesivo, no decisión. IsAdminUser no mira nunca
      is_superuser, en todo el backend REST. Las únicas salvaguardas son contra
      uno mismo: no puedes quitarte staff ni desactivarte. Un staff puede, por
      tanto, promover a un tercero o degradar a un superusuario. PERM-050 enuncia
      la corrección.
    evidence:
      - file: backend/real_estate/views.py
        lines: "2418-2430"
        symbol: "allowed_fields = {'is_active', 'is_staff'}"
      - file: backend/real_estate/permissions.py
        lines: "52"
        symbol: return request.user and request.user.is_authenticated and request.user.is_staff
        note: No comprueba is_superuser en ningún punto.
    permissions:
      required: [admin.users_update]
    backend:
      enforce: true
      endpoint: PATCH /api/admin/users/{owner_id}/
      denied_http_status: 403
    tests:
      api: true
    cases:
      - name: un anónimo no puede modificar cuentas
        role: anonymous
        expected: denied
        http_status: 401
        body:
          is_staff: true
      - name: un usuario autenticado normal no puede modificar cuentas
        role: authenticated
        expected: denied
        body:
          is_staff: true
      - name: un staff promueve a otra cuenta a staff sin ser superusuario
        role: staff
        expected: allowed
        expected_http_status: 200
        body:
          is_staff: true

  - id: PERM-050
