      persona complete el registro. El throttle pending_create acota el abuso y
      status es read_only en la creación.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1193-1195"
        symbol: "self.throttle_scope = 'pending_create'"
      - file: backend/estate_map/settings.py
        lines: "184-194"
        symbol: "'pending_create': '10/min',"
    permissions:
      required: [pending_publications.create_public]
    backend:
      enforce: true
      endpoint: POST /api/pending-publications/
      throttle_scope: pending_create
    tests:
      api: true
    cases:
      - name: un anónimo registra una solicitud
        role: anonymous
        expected: allowed
        expected_http_status: 201
        body:
          title: Solicitud de spec
          contact_phone: "0991234567"
          contact_email: solicitud-spec@example.com
          city: Macas
          province: Morona Santiago
          property_type: land
          operation: for_sale
          price: "32000"
          source: account_required
          status: converted
        note: >-
          Igual que en los leads: status viaja en el cuerpo y la creación lo
          ignora por ser de solo lectura, así que la respuesta sigue siendo 201.

  - id: PERM-029
    name: La bandeja de publicación asistida es solo para staff
    status: implemented
    summary: >-
      Listar, consultar y cambiar el estado de las solicitudes de publicación
      exige is_staff; un usuario autenticado normal recibe 403.
    rationale: >-
      Doble barrera deliberada: además del permiso, el queryset devuelve none()
      para quien no es staff, de modo que un fallo en la capa de permisos no
      filtraría datos de contacto.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1188-1190"
        symbol: "return [IsAuthenticated(), IsAdminUser()]"
      - file: backend/real_estate/views.py
        lines: "1200-1202"
        symbol: return PendingPublication.objects.none()
    permissions:
      required: [pending_publications.read_all, pending_publications.update_status]
    backend:
      enforce: true
      endpoint: GET /api/pending-publications/
      denied_http_status: 403
    tests:
      api: true
    cases:
      - name: un anónimo no accede a la bandeja
        role: anonymous
        expected: denied
        http_status: 401
      - name: un usuario autenticado normal no accede a la bandeja
        role: authenticated
        expected: denied
      - name: el propietario de propiedades tampoco accede
        role: owner
        expected: denied
      - name: staff accede a la bandeja
        role: staff
        expected: allowed
        expected_http_status: 200

  # =====================================================================
  # F. ACTIVIDAD
  # =====================================================================

  - id: PERM-030
    name: La captura de eventos de analítica es pública y está limitada
    status: implemented
    summary: >-
      Cualquier visitante puede emitir un evento de actividad, con un límite de
      30 por minuto, y el servidor decide la identidad y la marca de bot.
    rationale: >-
      Decisión deliberada: la analítica debe funcionar antes de que exista una
      sesión. El cliente no controla nada sensible: user sale de request.user o
      queda nulo, e is_bot se deduce del User-Agent ignorando lo que envíe el
      cliente.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1450-1452"
        symbol: "self.throttle_scope = 'activity_create'"
      - file: backend/real_estate/serializers.py
        lines: "716-721"
        symbol: validated_data['is_bot'] = is_bot_request(request)
    permissions:
      required: [activity.create_public]
    backend:
      enforce: true
      endpoint: POST /api/activity-events/
      throttle_scope: activity_create
    tests:
      api: true
    cases:
      - name: un anónimo emite un evento
        role: anonymous
        expected: allowed
        expected_http_status: 201
        body:
          event_name: spec_probe
          path: /spec
      - name: un usuario autenticado emite un evento
        role: authenticated
        expected: allowed
        expected_http_status: 201
        body:
          event_name: spec_probe
          path: /spec

  - id: PERM-031
    name: El registro de actividad solo lo consulta staff
    status: implemented
    summary: >-
      Listar o consultar eventos de actividad exige is_staff; un usuario
      autenticado normal recibe 403.
    rationale: >-
      El registro cruza sesiones, usuarios y propiedades, así que es material de
      panel. El viewset no expone PATCH ni DELETE, de modo que ni siquiera staff
      puede alterar un evento desde la API.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1188-1190"
        symbol: "return [IsAuthenticated(), IsAdminUser()]"
      - file: backend/real_estate/views.py
        lines: "1435-1437"
        symbol: "http_method_names = ['get', 'post', 'head', 'options']"
    permissions:
      required: [activity.read_all]
