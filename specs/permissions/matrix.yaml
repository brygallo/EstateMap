        role: anonymous
        expected: denied
      - name: un usuario autenticado lee su perfil
        role: authenticated
        expected: allowed
        expected_http_status: 200
      - name: staff lee su propio perfil
        role: staff
        expected: allowed
        expected_http_status: 200

  - id: PERM-042
    name: Un usuario no puede concederse is_staff editando su perfil
    status: implemented
    summary: >-
      La actualización del perfil propio solo admite username, nombre y
      apellidos; correo, verificación, avatar e is_staff son de solo lectura.
    rationale: >-
      Es la defensa contra la escalada de privilegios más obvia: enviar
      is_staff true a /me/. El serializer lo ignora porque está en
      read_only_fields, así que la petición devuelve 200 sin cambiar el rol.
    evidence:
      - file: backend/real_estate/serializers.py
        lines: "906-922"
