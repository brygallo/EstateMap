  - id: PERM-009
    name: delete_image no comprobaba la propiedad (defecto corregido)
    status: deprecated
    summary: >-
      Hasta 2026-08-11, cualquier usuario autenticado superaba la barrera de
      permisos de /delete_image/ sobre una propiedad ajena. PERM-010 describe el
      comportamiento vigente.
    rationale: >-
      Era un DEFECTO DE SEGURIDAD documentado, no una decisión. El decorador
      @action declaraba permission_classes=[IsAuthenticated], y en DRF los
      kwargs de @action SUSTITUYEN los *_classes del viewset, por lo que
      IsOwnerOrReadOnly no se evaluaba en esta acción. La corrección añadió
      IsOwnerOrReadOnly a la lista del decorador, de modo que get_object()
      ejecuta la comprobación de objeto y un tercero recibe 403 antes de
      cualquier validación de entrada.
    permissions:
      required: [images.delete]
    backend:
      enforce: false
      endpoint: DELETE /api/properties/{property_id}/delete_image/
    tests: {}
    cases:
      - name: un tercero autenticado ya no pasa la barrera
        expected: "403; el comportamiento vigente lo prueba PERM-010"

  - id: PERM-010
    name: delete_image exige ser propietario
    status: implemented
    summary: >-
      Eliminar una imagen requiere ser propietario de la propiedad a la que
      pertenece (o staff), y responde 403 a cualquier tercero autenticado.
    rationale: >-
      Cierra el defecto de PERM-009: el @action declara
      permission_classes=[IsAuthenticated, IsOwnerOrReadOnly], y get_object()
      ejecuta has_object_permission antes de leer image_id, así que el 403
      llega antes que el 400 de la validación de entrada.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1105-1128"
        symbol: def delete_image
        note: "permission_classes=[IsAuthenticated, IsOwnerOrReadOnly] en el @action."
      - file: backend/real_estate/permissions.py
        lines: 4-22
        symbol: class IsOwnerOrReadOnly
    permissions:
      required: [images.delete]
    backend:
      enforce: true
      endpoint: DELETE /api/properties/{property_id}/delete_image/
      denied_http_status: 403
    tests:
      api: true
    cases:
      - name: un anónimo queda fuera
        role: anonymous
        expected: denied
        http_status: 401
      - name: un tercero autenticado no puede borrar imágenes ajenas
        role: not_owner
        expected: denied
        http_status: 403
      - name: el propietario supera la barrera
        role: owner
        expected: allowed
        note: >-
          Sin expected_http_status: la acción lee image_id del cuerpo de un
          DELETE, un método que no transporta cuerpo, así que la petición
          válida (204) no es expresable aquí y solo se observa el 400.

  - id: PERM-011
    name: El informe comercial es público (comportamiento actual)
    status: implemented
    summary: >-
      /intelligence/ responde a cualquiera sin autenticación y su payload incluye
      el contador de visitas y los clics de contacto de la propiedad.
    rationale: >-
      El endpoint es AllowAny a propósito para las páginas de detalle
      renderizadas en servidor, pero el payload expone demand.views,
      demand.contacts y demand.city_median_views, lo que contradice la regla de
      producto de no mostrar contadores de visitas públicamente. Además es el
      endpoint de detalle más caro (recorre todo el inventario activo de la
      ciudad) y no declara throttle. PERM-012 enuncia la corrección.
    evidence:
      - file: backend/real_estate/views.py
        lines: "604-613"
        symbol: def intelligence
        note: "@action(detail=True, methods=['get'], permission_classes=[AllowAny])"
      - file: backend/real_estate/views.py
        lines: "690-692"
        symbol: "'demand': {'level': demand_level, 'views': instance.views_count, 'contacts': contacts,"
    permissions:
      required: [properties.read_intelligence]
    backend:
      enforce: true
      endpoint: GET /api/properties/{property_id}/intelligence/
      note: Sin throttle_scope, a diferencia de map_points y de la lista.
    tests:
