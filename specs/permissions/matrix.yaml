        expected_http_status: 200

  # =====================================================================
  # G. AUTENTICACIÓN Y CUENTA
  # =====================================================================

  - id: PERM-032
    name: El inicio de sesión es público
    status: implemented
    summary: >-
      /login/ acepta correo y contraseña sin autenticación previa y devuelve un
      par de tokens JWT con los claims username, email e is_staff.
    rationale: >-
      Acceso 1 hora y refresh 30 días, con rotación y lista negra tras rotar. Una
      cuenta que sigue inactiva y sin verificar recibe un error específico con
      code email_not_verified en lugar de un fallo genérico.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1487-1489"
        symbol: class CustomTokenObtainPairView
      - file: backend/estate_map/settings.py
        lines: "213-232"
        symbol: SIMPLE_JWT
      - file: backend/real_estate/serializers.py
        lines: "747-749"
        symbol: token["is_staff"] = user.is_staff
    permissions:
      required: [auth.login]
    backend:
      enforce: true
      endpoint: POST /api/login/
      note: Sin throttle.
    tests:
      api: true
    cases:
      - name: un anónimo inicia sesión con credenciales válidas
        role: anonymous
        expected: allowed
        expected_http_status: 200
        body:
          email: "{owner_email}"
          password: "{password}"
        note: >-
          200 con el par de tokens. Antes el caso iba sin cuerpo y se conformaba
          con el 400 de "campo requerido", que no distinguía un login que
          funciona de uno roto.

  - id: PERM-033
    name: Los endpoints de autenticación deberían limitar los intentos
    status: proposed
    summary: >-
      Login, registro, refresco de token, recuperación de contraseña y reenvío de
      código deben declarar un límite de tasa y responder 429 al superarlo.
    rationale: >-
      DEFECTO. Ninguno de los siete endpoints públicos de autenticación declara
      throttle, y no existe bloqueo por intentos fallidos en ninguna parte del
      backend. Además resend-verification y request-password-reset envían un
      correo por petición, así que también son un amplificador de envíos.
    permissions:
      required: [auth.login, auth.register, auth.request_password_reset, auth.resend_verification]
    backend:
      enforce: true
      endpoint: POST /api/login/
      denied_http_status: 429
      throttle_scope: auth_attempt
    tests: {}
    cases:
      - name: el intento que supera el límite debería rechazarse
        role: anonymous
        expected: denied
        note: No ejecutable con una sola llamada; requiere una ráfaga.

  - id: PERM-034
    name: El registro es público y la cuenta nace inactiva
    status: implemented
    summary: >-
      Cualquiera puede registrarse sin autenticación, y la cuenta se crea con
      is_active en falso hasta que se canjea el código de verificación.
    rationale: >-
      Es el único punto donde is_email_verified tiene efecto real, y solo de
      forma indirecta: la cuenta nace inactiva y la verificación pone ambos flags
      a la vez. Ver PERM-007.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1491-1493"
        symbol: class RegisterView
      - file: backend/real_estate/serializers.py
        lines: "798-804"
        symbol: class RegisterSerializer
        note: create() pasa is_active=False y emite el token de verificación.
    permissions:
      required: [auth.register]
    backend:
      enforce: true
      endpoint: POST /api/register/
      note: Sin throttle.
    tests:
      api: true
    cases:
      - name: un anónimo se registra
        role: anonymous
        expected: allowed
        expected_http_status: 201
        body:
          username: spec_registro
          email: spec-registro@example.com
          first_name: Spec
          last_name: Registro
          password: ClaveMuySegura789!

  - id: PERM-035
    name: El inicio de sesión con Google exige un correo verificado por Google
    status: implemented
    summary: >-
      /auth/google/ es público, valida el id_token contra el client_id
      configurado y rechaza cualquier identidad cuyo claim email_verified no sea
      exactamente verdadero.
    rationale: >-
      El servicio nuevo endurece el flujo respecto al código anterior, que no
      comprobaba email_verified. La vinculación busca primero por oauth_id y
      después por correo, con select_for_update para que dos peticiones
      simultáneas no creen cuentas duplicadas.
    evidence:
      - file: backend/real_estate/services/authentication.py
        lines: 27-39
        symbol: claims.get("email_verified") is not True
      - file: backend/real_estate/views.py
        lines: "1497-1499"
        symbol: class GoogleLoginView
    permissions:
      required: [auth.google_login]
    backend:
      enforce: true
      endpoint: POST /api/auth/google/
      note: Sin throttle.
    tests:
      api: true
    cases:
      - name: un anónimo alcanza el endpoint de Google
        role: anonymous
        expected: allowed
        note: >-
          400 por token ausente; el permiso es AllowAny. Sin
          expected_http_status: la petición válida exige un id_token firmado por
          Google, que no se puede construir en la suite sin sustituir el
          verificador. La ruta feliz está cubierta a mano en
          real_estate/tests/test_services.py.

  - id: PERM-036
    name: El refresco de token es público
    status: implemented
    summary: >-
      /token/refresh/ no exige cabecera de autenticación: la credencial es el
      propio refresh token del cuerpo, que se rota y se manda a la lista negra.
    rationale: >-
      ROTATE_REFRESH_TOKENS y BLACKLIST_AFTER_ROTATION están activos, así que un
      refresh reutilizado deja de servir. La app token_blacklist está instalada.
    evidence:
      - file: backend/estate_map/settings.py
        lines: "220-222"
        symbol: "'BLACKLIST_AFTER_ROTATION': True,"
      - file: backend/real_estate/urls.py
        lines: "45-47"
        symbol: name='token_refresh'
    permissions:
      required: [auth.refresh_token]
    backend:
      enforce: true
      endpoint: POST /api/token/refresh/
    tests:
      api: true
    cases:
      - name: un anónimo alcanza el refresco de token
        role: anonymous
        expected: allowed
        note: >-
          400 por falta del campo refresh; la credencial es el propio token, así
          que la petición válida exige emitir uno antes y el mundo de prueba no
          sabe entregarlo a un caso. La rotación y la lista negra se prueban a
          mano en real_estate/tests/test_authentication.py
          (test_refresh_token_renews_session).

  - id: PERM-037
    name: La verificación de correo es pública
    status: implemented
    summary: >-
      Canjear el código de verificación no exige sesión, porque quien lo usa
      todavía no puede iniciarla.
    rationale: >-
      La credencial es el código de seis dígitos, ligado al usuario y con
      caducidad. Al canjearlo se activan is_active e is_email_verified a la vez.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1624-1626"
        symbol: class VerifyEmailView
      - file: backend/real_estate/views.py
        lines: "1673-1675"
        symbol: user.is_email_verified = True
    permissions:
      required: [auth.verify_email]
    backend:
      enforce: true
      endpoint: POST /api/verify-email/
    tests:
      api: true
    cases:
      - name: un anónimo alcanza la verificación
        role: anonymous
        expected: allowed
        note: >-
          400 porque faltan email y code; la petición válida exige un código de
          seis dígitos vivo, que solo existe tras un registro. La ruta feliz
          está cubierta a mano en real_estate/tests/test_registration.py
          (test_verify_email_success).

  - id: PERM-038
    name: La recuperación de contraseña no revela si el correo existe
    status: implemented
    summary: >-
      /request-password-reset/ responde 200 con el mismo mensaje tanto si la
      cuenta existe como si no.
    rationale: >-
      Decisión deliberada y correcta, documentada en el propio código. Sirve de
      referencia para PERM-039, donde el patrón no se siguió.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1761-1763"
        symbol: "# Por seguridad, no revelar si el email existe o no"
    permissions:
      required: [auth.request_password_reset]
    backend:
      enforce: true
      endpoint: POST /api/request-password-reset/
    tests:
      api: true
    cases:
      - name: un correo inexistente recibe la misma respuesta afirmativa
        role: anonymous
        expected: allowed
        expected_http_status: 200
        body:
          email: nadie-spec@example.com

  - id: PERM-039
    name: El reenvío de verificación revela si el correo existe
    status: implemented
    summary: >-
      /resend-verification/ responde 404 con el mensaje "Usuario no encontrado"
      cuando el correo no está registrado.
    rationale: >-
      DEFECTO por inconsistencia con PERM-038. Es un oráculo de existencia de
      cuentas: permite enumerar qué correos están registrados. VerifyEmailView
      tiene exactamente el mismo problema. PERM-040 enuncia la corrección; esta
      regla congela la conducta actual para que un cambio la haga saltar.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1642-1644"
        symbol: "{'error': 'Usuario no encontrado'}"
    permissions:
      required: [auth.resend_verification]
    backend:
      enforce: false
      endpoint: POST /api/resend-verification/
      denied_http_status: 404
    tests:
      api: true
    cases:
      - name: un correo inexistente recibe 404 en lugar de una respuesta genérica
        role: anonymous
        expected: denied
        body:
          email: nadie-spec@example.com

  - id: PERM-040
    name: El reenvío de verificación debería responder siempre lo mismo
    status: proposed
    summary: >-
      /resend-verification/ debe responder 200 con un mensaje genérico exista o
      no la cuenta, igual que hace la recuperación de contraseña.
    rationale: >-
      Cierra el oráculo descrito en PERM-039. La misma corrección aplica a
      /verify-email/.
    permissions:
      required: [auth.resend_verification]
    backend:
      enforce: true
      endpoint: POST /api/resend-verification/
    tests:
      api: true
    cases:
      - name: un correo inexistente debería recibir 200 genérico
        role: anonymous
        expected: allowed
        expected_http_status: 200
        body:
          email: nadie-spec@example.com

  - id: PERM-041
    name: El perfil propio exige sesión y se resuelve desde el token
    status: implemented
    summary: >-
      /me/ devuelve siempre la cuenta del token, sin aceptar identificador en la
