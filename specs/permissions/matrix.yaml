        http_status: 401
      - name: un usuario autenticado normal no puede resolver incidencias
        role: authenticated
        expected: denied
      - name: staff supera la barrera de permisos
        role: staff
        expected: allowed
        note: >-
          404 porque no se indica una incidencia existente. Sin
          expected_http_status: resolver de verdad exige un SystemIncident en la
          base, y las incidencias las escribe el middleware de observabilidad al
