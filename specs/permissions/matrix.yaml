  - id: PERM-021
    name: El proxy de imágenes es público y sin restricción de objeto
    status: implemented
    summary: >-
      /api/media/<ruta> reenvía cualquier objeto del bucket de MinIO sin
      autenticación, sin permisos y sin límite de tasa.
    rationale: >-
      DEFECTO por exceso de alcance. La vista es un django.views.View plano, así
      que ni siquiera pasa por JWTAuthentication. Está acotada al bucket
      configurado, de modo que no permite salir de él, pero sí enumerar y
      descargar cualquier objeto que contenga, con una cabecera de caché de un
      año. PERM-022 enuncia la corrección.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1550-1552"
        symbol: class ImageProxyView
      - file: backend/real_estate/urls.py
        lines: "75-77"
        symbol: name='image_proxy'
    permissions:
      required: [images.read_public]
    backend:
      enforce: false
      endpoint: GET /api/media/spec-inexistente.webp
      note: Responde 404 cuando el objeto no existe; nunca 401 ni 403.
    tests:
      api: true
    cases:
      - name: un anónimo alcanza el proxy sin credenciales
        role: anonymous
        expected: allowed
        expected_http_status: 404
        note: >-
          El 404 es el resultado exacto que se afirma: el objeto no existe en el
          bucket y la vista lo dice sin pedir credenciales. No hay petición
          "válida" que declarar en su lugar porque no hay ningún objeto de
          fixture en MinIO; lo que fija el código es que un ausente responde 404
          y no 401, 403 ni 500.

  - id: PERM-022
    name: El proxy de imágenes debería servir solo objetos referenciados
    status: proposed
    summary: >-
      El proxy debe resolver únicamente rutas que correspondan a una PropertyImage
      existente, y rechazar cualquier otra con 404 sin consultar el bucket.
    rationale: >-
      Cierra el problema de PERM-021 sin romper el catálogo público: las imágenes
      del inventario siguen siendo públicas, pero el bucket deja de ser
      enumerable a través del backend.
    permissions:
      required: [images.read_public]
    backend:
      enforce: true
      endpoint: GET /api/media/spec-inexistente.webp
      denied_http_status: 404
    tests: {}
    cases:
      - name: una ruta que no corresponde a ninguna imagen no debería consultarse en MinIO
        role: anonymous
        expected: denied
        note: Requiere una PropertyImage de fixture para probar también el caso permitido.

  - id: PERM-023
    name: Las imágenes en staging son públicas mientras se optimizan
    status: implemented
    summary: >-
      /pending-image/<id>/ sirve sin autenticación el fichero recién subido que
      todavía está en disco local, buscándolo por identificador de fila y nunca
      por ruta.
    rationale: >-
      Decisión deliberada y acotada: existe una ventana de segundos entre la
      subida y la aparición del objeto en MinIO, y sin esta vista el cliente
      pintaría una imagen rota. La búsqueda por id y la comprobación de que el
      fichero está dentro de IMAGE_UPLOAD_TEMP_DIR impiden salir del directorio,
      y la respuesta se marca no-store.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1576-1599"
        symbol: class PendingImageView
      - file: backend/real_estate/views.py
        lines: "1614-1616"
        symbol: path.parent != Path(settings.IMAGE_UPLOAD_TEMP_DIR)
    permissions:
      required: [images.read_public]
    backend:
      enforce: false
      endpoint: GET /api/pending-image/{id}/
      note: Responde 404 si la fila no existe o ya está optimizada.
    tests:
      api: true
    cases:
      - name: un anónimo alcanza la vista sin credenciales
        role: anonymous
        expected: allowed
        expected_http_status: 404
        note: >-
          404 porque no hay ninguna PropertyImage de fixture, y esa es la
          afirmación que se fija: una fila inexistente responde 404 sin pedir
          credenciales. El caso permitido con fichero real exigiría dejar una
          imagen en IMAGE_UPLOAD_TEMP_DIR, que el mundo de prueba no construye.

