    permissions:
      required: [account.update_own_profile]
    backend:
      enforce: true
      endpoint: PATCH /api/me/
      denied_http_status: 401
    tests:
      api: true
    cases:
      - name: un anónimo no puede modificar ningún perfil
        role: anonymous
        expected: denied
        body:
          first_name: Spec
      - name: un usuario autenticado edita su nombre e is_staff se ignora
        role: authenticated
        expected: allowed
        expected_http_status: 200
        body:
          first_name: Spec
          is_staff: true
        note: Responde 200, pero el campo is_staff no se aplica por ser de solo lectura.

  - id: PERM-043
    name: Cambiar la contraseña exige sesión y la contraseña actual
