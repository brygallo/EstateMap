      un staff normal reciba 403 al intentarlo.
    rationale: >-
      Cierra el defecto de PERM-049. Requiere una permission class nueva (por
      ejemplo IsSuperUser) aplicada a las operaciones de elevación de privilegio,
      dejando is_active en manos de staff.
    permissions:
      required: [admin.users_update]
    backend:
      enforce: true
      endpoint: PATCH /api/admin/users/{owner_id}/
      denied_http_status: 403
    tests:
