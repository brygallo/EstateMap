        role: anonymous
        expected: allowed
        expected_http_status: 200
      - name: un tercero autenticado también
        role: not_owner
        expected: allowed
        expected_http_status: 200

  - id: PERM-012
    name: Las métricas de demanda no deberían ser públicas
    status: proposed
    summary: >-
      El bloque demand de /intelligence/ debe servirse solo al propietario de la
      propiedad o a staff, y el resto del informe puede seguir siendo público.
    rationale: >-
      Cierra el problema descrito en PERM-011 sin perder el valor SEO: los
      comparables, el rango de precio y la antigüedad pueden seguir siendo
