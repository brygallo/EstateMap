version: 1
domain: matrix
title: Matriz de permisos de la API
status: implemented
summary: >-
  Quién puede hacer qué en la API de Geo Propiedades Ecuador. Este archivo es el
  dueño del vocabulario de permisos: cualquier slug que use otra spec debe estar
  declarado aquí. Cada regla apunta al código que la aplica hoy; las reglas en
  estado 'proposed' describen el comportamiento correcto de los huecos
  detectados y quedan en skip hasta que alguien los cierre.
see_also:
  - docs/permissions/matrix.md
  - docs/workflows/google-oauth.md

catalog:
  permissions:
    # --- Catálogo público -------------------------------------------------
    - slug: properties.read_public
      description: Leer el catálogo público de propiedades activas y su detalle.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: properties.read_intelligence
      description: Leer el informe comercial (comparables, precio/m², demanda) de una propiedad.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: properties.read_market_stats
      description: Leer los indicadores agregados de mercado que alimentan las páginas SEO.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: properties.read_own_inventory
      description: Listar las propiedades propias, incluidas las inactivas.
      roles: [authenticated, owner, staff, superuser]
    - slug: properties.read_full_inventory
      description: >-
        Ver el catálogo completo en el panel de inventario, incluidas las
        inactivas, las duplicadas y las importadas de otros portales.
      roles: [staff, superuser]
    - slug: properties.read_promotion_stats
      description: >-
        Leer el desglose por red social de las visitas que trajeron los enlaces
        del kit de promoción de un anuncio.
      roles: [owner, staff, superuser]

    # --- Escritura de propiedades ----------------------------------------
    - slug: properties.create
      description: Publicar una propiedad nueva a nombre propio.
      roles: [authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: properties.edit_own
      description: Modificar una propiedad de la que se es propietario.
      roles: [owner]
    - slug: properties.delete_own
      description: Eliminar una propiedad de la que se es propietario.
      roles: [owner]
    - slug: properties.edit_any
      description: Modificar cualquier propiedad del catálogo por la ruta pública.
      roles: [staff, superuser]
    - slug: properties.delete_any
      description: Eliminar cualquier propiedad del catálogo por la ruta pública.
      roles: [staff, superuser]

    # --- Mapa y geografía -------------------------------------------------
    - slug: map.read_points
      description: Leer el payload de puntos y agrupadores del mapa.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: map.read_summary
      description: Leer los contadores agregados del inventario activo.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: map.read_locations
      description: Leer las provincias y ciudades presentes en el inventario activo.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: map.read_catalog
      description: Leer el catálogo estable de provincias y cantones para las landings SEO.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: map.read_owners
      description: Leer la lista de propietarios con inventario activo para el filtro del mapa.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: geo.read_provinces
      description: Consultar la tabla oficial de provincias.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: geo.read_cities
      description: Consultar la tabla oficial de cantones.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: geo.write
      description: Crear o modificar provincias y cantones. Solo existe en el admin de Django.
      roles: [staff, superuser]

    # --- Imágenes ---------------------------------------------------------
    - slug: images.read_public
      description: Descargar una imagen del catálogo, ya sea desde MinIO o desde el staging local.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]
    - slug: images.upload
      description: Subir imágenes a una propiedad mediante el campo uploaded_images.
      roles: [owner]
    - slug: images.delete
      description: Eliminar una imagen concreta de una propiedad.
      roles: [owner, staff, superuser]

    # --- Leads ------------------------------------------------------------
    - slug: leads.create_public
      description: Enviar el formulario público de contacto de una propiedad.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser]
    - slug: leads.read_own
      description: Ver los leads recibidos en las propiedades propias.
      roles: [owner, authenticated]
    - slug: leads.update_status_own
      description: Cambiar el estado de un lead de una propiedad propia.
      roles: [owner]
    - slug: leads.delete_own
      description: Eliminar un lead de una propiedad propia.
      roles: [owner]
    - slug: leads.read_all
      description: Ver la bandeja completa de leads de todas las propiedades.
      roles: [staff, superuser]

    # --- Publicación asistida --------------------------------------------
    - slug: pending_publications.create_public
      description: Registrar una solicitud de publicación sin tener cuenta todavía.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser]
    - slug: pending_publications.read_all
      description: Ver la bandeja de solicitudes de publicación asistida.
      roles: [staff, superuser]
    - slug: pending_publications.update_status
      description: Cambiar el estado de una solicitud de publicación asistida.
      roles: [staff, superuser]
    - slug: pending_publications.create_resume_link
      description: Generar el enlace de un solo uso que devuelve a alguien a su borrador.
      roles: [staff, superuser]
    - slug: pending_publications.revoke_resume_link
      description: Anular un enlace de continuación ya emitido.
      roles: [staff, superuser]
    - slug: publication_drafts.read_by_token
      description: Leer el borrador asociado a un token de continuación válido.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser]
    - slug: publication_drafts.redeem
      description: Canjear un token de continuación publicando la propiedad.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser]

    # --- Actividad --------------------------------------------------------
    - slug: activity.create_public
      description: Emitir un evento de analítica desde el navegador.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser]
    - slug: activity.read_all
      description: Consultar el registro completo de eventos de actividad.
      roles: [staff, superuser]

    # --- Autenticación ----------------------------------------------------
    - slug: auth.login
      description: Obtener un par de tokens JWT con correo y contraseña.
      roles: [anonymous, authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: auth.register
      description: Crear una cuenta nueva, que nace inactiva hasta verificar el correo.
      roles: [anonymous, authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: auth.refresh_token
      description: Canjear un refresh token por un access token nuevo.
      roles: [anonymous, authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: auth.google_login
      description: Iniciar sesión con un id_token de Google verificado.
      roles: [anonymous, authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: auth.verify_email
      description: Canjear el código de seis dígitos que activa la cuenta.
      roles: [anonymous, authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: auth.resend_verification
      description: Pedir un código de verificación nuevo.
      roles: [anonymous, authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: auth.request_password_reset
      description: Pedir un enlace de recuperación de contraseña.
      roles: [anonymous, authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: auth.reset_password
      description: Fijar una contraseña nueva con un token de recuperación.
      roles: [anonymous, authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: auth.logout
      description: Entregar el refresh token propio para que quede en la lista negra.
      roles: [anonymous, authenticated, unverified, owner, not_owner, staff, superuser]

    # --- Cuenta propia ----------------------------------------------------
    - slug: account.read_own_profile
      description: Leer el perfil de la cuenta con la que se ha iniciado sesión.
      roles: [authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: account.update_own_profile
      description: Modificar nombre y apellidos de la cuenta propia.
      roles: [authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: account.change_password
      description: Cambiar la contraseña propia aportando la actual.
      roles: [authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: account.request_email_change
      description: Pedir el cambio del correo de la cuenta propia.
      roles: [authenticated, unverified, owner, not_owner, staff, superuser]
    - slug: account.verify_email_change
      description: Confirmar el cambio de correo con el código enviado al destino.
      roles: [authenticated, unverified, owner, not_owner, staff, superuser]

    # --- Panel de administración -----------------------------------------
    - slug: admin.metrics_read
      description: Leer el dashboard con métricas de negocio, calidad e ingesta.
      roles: [staff, superuser]
    - slug: admin.system_status_read
      description: Leer el estado operativo y las incidencias abiertas del sistema.
      roles: [staff, superuser]
    - slug: admin.system_status_write
      description: Marcar una incidencia del sistema como resuelta.
      roles: [staff, superuser]
    - slug: admin.users_read
      description: Listar y consultar cuentas de usuario desde el panel.
      roles: [staff, superuser]
    - slug: admin.users_update
      description: Cambiar is_active e is_staff de una cuenta desde el panel.
      roles: [staff, superuser]
    - slug: admin.users_delete
      description: Eliminar una cuenta de usuario desde el panel.
      roles: [staff, superuser]
    - slug: admin.properties_read
      description: Listar propiedades desde el panel, incluidas inactivas y duplicadas.
      roles: [staff, superuser]
    - slug: admin.properties_update
      description: Editar los campos moderables de una propiedad desde el panel.
      roles: [staff, superuser]
    - slug: admin.properties_delete
      description: Eliminar cualquier propiedad desde el panel.
      roles: [staff, superuser]
    - slug: admin.properties_bulk_status
      description: Cambiar el estado de hasta 200 propiedades en una sola operación.
      roles: [staff, superuser]
    - slug: admin.properties_transfer_owner
      description: Cambiar la cuenta propietaria de una propiedad desde el panel.
      roles: [staff, superuser]

    # --- Ingesta ----------------------------------------------------------
    - slug: ingesta.read
      description: Consultar fuentes, ejecuciones y anuncios importados del agregador.
      roles: [staff, superuser]
    - slug: ingesta.run
      description: Lanzar una ejecución de scraping contra un portal externo.
      roles: [staff, superuser]
    - slug: ingesta.cancel
      description: Solicitar la cancelación de una ejecución en curso.
      roles: [staff, superuser]
    - slug: ingesta.refresh_property
      description: Re-scrapear un anuncio importado concreto desde su portal de origen.
      roles: [staff, superuser]
    - slug: ingesta.maintenance_read
      description: Previsualizar los candidatos a limpieza sin modificar nada.
      roles: [staff, superuser]
    - slug: ingesta.maintenance_cleanup
      description: Borrar en lotes anuncios importados y sus imágenes.
      roles: [staff, superuser]

    # --- Operación --------------------------------------------------------
    - slug: ops.health_read
      description: Leer la sonda de salud de base de datos, caché y worker.
      roles: [anonymous, authenticated, owner, not_owner, staff, superuser, internal]

rules:
  # =====================================================================
  # A. PROPIEDADES
  # =====================================================================

  - id: PERM-001
    name: El catálogo de propiedades se lee sin cuenta
    status: implemented
    summary: >-
      Cualquiera puede listar las propiedades activas sin autenticarse, porque el
      catálogo es contenido público indexable.
    rationale: >-
      El negocio depende de que Google y los asistentes de IA rastreen el
      inventario. IsAuthenticatedOrReadOnly deja pasar los métodos seguros y el
      límite de tasa existe solo contra el scraping masivo, no para cerrar el
      contenido.
    evidence:
      - file: backend/real_estate/views.py
        lines: "308-333"
        symbol: "permission_classes = [IsAuthenticatedOrReadOnly, IsOwnerOrReadOnly]"
        note: El throttle property_list se aplica únicamente a la acción list.
      - file: backend/real_estate/throttling.py
        lines: 42-51
        symbol: class AntiScraperScopedThrottle
    permissions:
      required: [properties.read_public]
    backend:
      enforce: true
      endpoint: GET /api/properties/
      throttle_scope: property_list
    tests:
      api: true
    cases:
      - name: un visitante anónimo lista el catálogo
        role: anonymous
        expected: allowed
        expected_http_status: 200
      - name: un usuario autenticado lista el catálogo
        role: authenticated
        expected: allowed
        expected_http_status: 200
      - name: el renderizado en servidor de Next.js lista el catálogo
        role: internal
        expected: allowed
        expected_http_status: 200
        note: Sin X-Forwarded-For y desde una IP privada queda exento del throttle.

  - id: PERM-002
    name: El detalle de una propiedad se lee sin cuenta
    status: implemented
    summary: >-
      El detalle de una propiedad activa es público y su contador de visitas solo
      se incrementa cuando la petición no viene de un crawler.
    rationale: >-
      La ficha es la página que se posiciona en buscadores. El filtro de bots
      afecta a la métrica, nunca al acceso.
    evidence:
      - file: backend/real_estate/views.py
        lines: "592-598"
        symbol: def retrieve
      - file: backend/real_estate/permissions.py
        lines: "4-9"
        symbol: class IsOwnerOrReadOnly
        note: has_object_permission devuelve True para todo método seguro.
    permissions:
      required: [properties.read_public]
    backend:
      enforce: true
      endpoint: GET /api/properties/{property_id}/
    tests:
      api: true
    cases:
      - name: un visitante anónimo abre la ficha
        role: anonymous
        expected: allowed
        expected_http_status: 200
      - name: un tercero autenticado abre la ficha
        role: not_owner
        expected: allowed
        expected_http_status: 200
      - name: el propietario abre su propia ficha
        role: owner
        expected: allowed
        expected_http_status: 200

  - id: PERM-003
    name: Publicar una propiedad exige haber iniciado sesión
    status: implemented
    summary: >-
      Solo un usuario autenticado puede crear una propiedad, y el propietario se
      fija siempre desde el token, nunca desde el cuerpo de la petición.
    rationale: >-
      owner es read_only en el serializer y perform_create lo asigna desde
      request.user, así que no es posible publicar a nombre de otra persona.
    evidence:
      - file: backend/real_estate/views.py
        lines: "558-560"
        symbol: def perform_create
      - file: backend/real_estate/serializers.py
        lines: "165-170"
        symbol: read_only_fields
        note: owner, views_count y los campos de ingesta no se pueden fijar desde el cliente.
    permissions:
      required: [properties.create]
    backend:
      enforce: true
      endpoint: POST /api/properties/
      denied_http_status: 401
      throttle_scope: property_write
    tests:
      api: true
    cases:
      - name: un anónimo no puede publicar
        role: anonymous
        expected: denied
      - name: un usuario autenticado publica una propiedad
        role: authenticated
        expected: allowed
        expected_http_status: 201
        body:
          title: Propiedad creada por spec
          description: Anuncio mínimo válido para el caso permitido.
          property_type: land
          status: for_sale
          city: Macas
          province: Morona Santiago
          latitude: -2.308
          longitude: -78.118
          area: 500
          price: 25000
        note: >-
          Con cuerpo válido responde 201 y el anuncio queda a nombre del usuario
          del token. Antes el caso iba sin cuerpo y se conformaba con el 400 de
          validación, que no distinguía un permiso abierto de un endpoint roto.

  - id: PERM-004
    name: La propiedad la edita su dueño o un administrador
    status: implemented
    summary: >-
      Modificar una propiedad requiere ser su propietario o tener is_staff; un
      tercero autenticado no puede.
    rationale: >-
      IsOwnerOrReadOnly deja pasar a staff antes de comparar obj.owner porque el
      panel de inventario es la pantalla desde la que se modera el catálogo
      entero. La ruta /api/admin/properties/ sigue existiendo para los cambios
      acotados con traza de auditoría; esta permite la edición completa.
    evidence:
      - file: backend/real_estate/permissions.py
        lines: "18-26"
        symbol: user.is_authenticated and user.is_staff
        note: El atajo de staff precede a la comparación obj.owner == request.user.
      - file: backend/real_estate/views.py
        lines: "311-313"
        symbol: "IsOwnerOrReadOnly"
      - file: backend/real_estate/views.py
        lines: "374-384"
        symbol: "self.action in ("
        note: >-
          get_queryset devuelve el catálogo completo a staff en las acciones de
          detalle, para que una propiedad inactiva o duplicada no responda 404.
    permissions:
      required: [properties.edit_own, properties.edit_any]
    backend:
      enforce: true
      endpoint: PATCH /api/properties/{property_id}/
      denied_http_status: 403
      throttle_scope: property_write
    tests:
      api: true
    cases:
      - name: el propietario edita su propiedad
        role: owner
        expected: allowed
        expected_http_status: 200
        body:
          title: Propiedad de spec editada
      - name: un tercero autenticado no puede editarla
        role: not_owner
        expected: denied
        body:
          title: Intento de secuestro
      - name: un usuario staff sí puede editarla por la ruta pública
        role: staff
        expected: allowed
        expected_http_status: 200
        body:
          title: Edición desde staff
      - name: un anónimo no puede editarla
        role: anonymous
        expected: denied
        http_status: 401
        body:
          title: Intento anónimo

  - id: PERM-005
    name: La propiedad la elimina su dueño o un administrador
    status: implemented
    summary: >-
      Eliminar una propiedad por la ruta pública exige ser su propietario o
      tener is_staff.
    rationale: >-
      Mismo control de objeto que la edición, con el mismo atajo para staff. El
      borrado administrativo de /api/admin/properties/ sigue existiendo y es el
      único que deja traza en el log de auditoría; este no.
    evidence:
      - file: backend/real_estate/permissions.py
        lines: 9-15
        symbol: def has_object_permission
    permissions:
      required: [properties.delete_own, properties.delete_any]
    backend:
      enforce: true
      endpoint: DELETE /api/properties/{property_id}/
      denied_http_status: 403
    tests:
      api: true
    cases:
      - name: el propietario elimina su propiedad
        role: owner
        expected: allowed
        expected_http_status: 204
      - name: un tercero autenticado no puede eliminarla
        role: not_owner
        expected: denied
      - name: un usuario staff elimina una propiedad ajena
        role: staff
        expected: allowed
        expected_http_status: 204
      - name: un anónimo no puede eliminarla
        role: anonymous
        expected: denied
        http_status: 401

  - id: PERM-006
    name: El inventario exige sesión y su alcance depende del rol
    status: implemented
    summary: >-
      /my_properties/ solo responde a usuarios autenticados. Un usuario normal
      recibe exclusivamente sus propiedades, inactivas incluidas; un usuario con
      is_staff recibe el catálogo completo, incluidas las importadas y las
      duplicadas.
    rationale: >-
      Es la única vía para ver las propiedades con status inactive, que el
      queryset público excluye para todos. El alcance se decide en el servidor a
      partir del token: el cliente no envía ningún parámetro de usuario, así que
      no hay forma de pedir el inventario ajeno sin ser administrador.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1033-1035"
        symbol: def my_properties
        note: >-
          El alcance sale de request.user.is_staff; para el resto es
          Property.objects.filter(owner=request.user), sin parámetro de usuario.
    permissions:
      required: [properties.read_own_inventory, properties.read_full_inventory]
    backend:
      enforce: true
      endpoint: GET /api/properties/my_properties/
      denied_http_status: 401
    tests:
      api: true
    cases:
      - name: un anónimo no puede consultar inventario propio
        role: anonymous
        expected: denied
      - name: el propietario ve su inventario
        role: owner
        expected: allowed
        expected_http_status: 200
      - name: otro usuario recibe su propia lista, no la ajena
        role: not_owner
        expected: allowed
        expected_http_status: 200
        note: Responde 200 con página vacía; el filtro es por owner, no por parámetro.
      - name: un administrador recibe el catálogo entero
        role: staff
        expected: allowed
        expected_http_status: 200
        note: >-
          scope='catalog' en la respuesta; incluye propiedades de otras cuentas,
          inactivas e importadas.

  - id: PERM-007
    name: Una cuenta con el correo sin verificar puede publicar
    status: implemented
    summary: >-
      Hoy is_email_verified no bloquea ningún endpoint, así que una cuenta activa
      con el correo sin verificar puede crear propiedades.
    rationale: >-
      DEFECTO, no decisión. El campo existe y se escribe, pero la única lectura
      en un camino de autenticación combina is_active con is_email_verified, y
      como el registro nace inactivo y la verificación pone ambos flags a la vez,
      el control real acaba siendo is_active, que Django ya comprueba por su
      cuenta. Una cuenta reactivada desde el admin o desde
      PATCH /api/admin/users/{pk}/ publica sin haber verificado nunca su correo.
      Esta regla fija el comportamiento actual; PERM-008 enuncia el correcto.
    evidence:
      - file: backend/real_estate/models.py
        lines: "27-29"
        symbol: "is_email_verified = models.BooleanField(default=False)"
      - file: backend/real_estate/serializers.py
        lines: "766-768"
        symbol: not user.is_active and not user.is_email_verified
        note: Única lectura del campo en un camino de login; ninguna permission class lo mira.
    permissions:
      required: [properties.create]
    backend:
      enforce: false
      endpoint: POST /api/properties/
      note: Ninguna permission class del proyecto lee is_email_verified.
    tests:
      api: true
    cases:
      - name: una cuenta sin verificar publica una propiedad
        role: unverified
        expected: allowed
        expected_http_status: 201
        body:
          title: Propiedad de cuenta sin verificar
          description: Anuncio mínimo válido para el caso permitido.
          property_type: land
          status: for_sale
          city: Macas
          province: Morona Santiago
          latitude: -2.308
          longitude: -78.118
          area: 500
          price: 25000
        note: >-
          201, no 403: con cuerpo válido el anuncio se crea de verdad, así que
          el defecto no es solo que la capa de permisos deje pasar, sino que la
          publicación se completa sin haber verificado el correo.

  - id: PERM-008
    name: Publicar debería exigir el correo verificado
    status: proposed
    summary: >-
      Crear una propiedad debe requerir is_email_verified, de modo que una cuenta
      activa pero sin verificar reciba 403.
    rationale: >-
      Cierra el defecto descrito en PERM-007. Requiere una permission class nueva
      (por ejemplo IsEmailVerified) aplicada a las acciones de escritura de
      PropertyViewSet. Hasta entonces esta regla queda registrada y en skip.
    permissions:
      required: [properties.create]
    backend:
      enforce: true
      endpoint: POST /api/properties/
      denied_http_status: 403
    tests:
      api: true
    cases:
      - name: una cuenta sin verificar no debería poder publicar
        role: unverified
        expected: denied
      - name: una cuenta verificada sí debería poder publicar
        role: authenticated
        expected: allowed
        expected_http_status: 201
        body:
          title: Propiedad de cuenta verificada
          description: Anuncio mínimo válido para el caso permitido.
          property_type: land
          status: for_sale
