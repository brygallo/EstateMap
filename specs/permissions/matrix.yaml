  # K. REGLAS TRANSVERSALES
  # =====================================================================

  - id: PERM-067
    name: La API solo acepta JWT, nunca la sesión del admin de Django
    status: implemented
    summary: >-
      DEFAULT_AUTHENTICATION_CLASSES contiene únicamente JWTAuthentication, así
      que una sesión iniciada en /admin/ no autentica contra /api/.
    rationale: >-
      No hay SessionAuthentication en ninguna parte, y ninguna vista sobreescribe
      authentication_classes. Por eso los endpoints de escritura de la API no
      dependen de CSRF ni son alcanzables desde una pestaña con la cookie del
      admin.
    evidence:
      - file: backend/estate_map/settings.py
        lines: "172-174"
        symbol: rest_framework_simplejwt.authentication.JWTAuthentication
    permissions:
      required: [auth.login]
    backend:
      enforce: true
      note: Configuración global, no un endpoint concreto.
    tests: {}
    cases:
      - name: una petición sin cabecera Authorization se trata como anónima
        role: anonymous
        expected: denied
        note: Cubierto de forma indirecta por todos los casos anónimos de esta spec.

  - id: PERM-068
    name: La caché compartida nunca sirve una respuesta autenticada
    status: implemented
    summary: >-
      Solo las lecturas anónimas se leen de la caché, se escriben en ella y se
      marcan Cache-Control public.
    rationale: >-
      _is_public_read exige método seguro y usuario no autenticado. Así una
      respuesta calculada para una sesión no puede acabar en una entrada
      compartida, ni la cabecera public viajar junto a un Authorization.
    evidence:
      - file: backend/real_estate/views.py
        lines: "111-120"
        symbol: not request.user.is_authenticated
    permissions:
      required: [properties.read_public]
    backend:
      enforce: true
      endpoint: GET /api/properties/summary/
      note: El mismo patrón aplica a las nueve lecturas cacheadas.
    tests: {}
    cases:
      - name: una lectura autenticada omite la caché compartida
        role: authenticated
        expected: allowed
        note: >-
          La diferencia está en la cabecera Cache-Control, no en el código de
          estado, así que allowed/denied no puede expresarla.

  - id: PERM-069
    name: El throttling solo existe donde una vista lo declara
    status: implemented
    summary: >-
      No hay DEFAULT_THROTTLE_CLASSES global, así que toda vista que no
      implemente get_throttles queda sin límite de tasa.
    rationale: >-
      Es la razón de fondo de PERM-025 y PERM-033: las tasas están declaradas en
      DEFAULT_THROTTLE_RATES, pero solo se aplican en los cinco ámbitos que algún
      viewset activa explícitamente. Conviene tenerlo escrito porque la presencia
      de DEFAULT_THROTTLE_RATES sugiere lo contrario.
    evidence:
      - file: backend/estate_map/settings.py
        lines: "204-219"
        symbol: "'property_write': '30/hour',"
        note: Se declaran las tasas, nunca las clases por defecto.
      - file: backend/real_estate/views.py
        lines: "337-350"
        symbol: def get_throttles
    permissions:
      required: [properties.read_public]
    backend:
      enforce: true
      note: Configuración global, no un endpoint concreto.
    tests: {}
    cases:
      - name: un endpoint sin get_throttles no consume ninguna cuota
        role: anonymous
        expected: allowed
        note: Verificable solo con una ráfaga; se documenta, no se ejecuta.

  - id: PERM-070
    name: El frontend no es la frontera de seguridad
    status: implemented
    summary: >-
      No existe middleware.ts en el frontend, los tokens viven en localStorage y
      el rol staff se lee decodificando el JWT sin verificar la firma.
    rationale: >-
      Toda ruta privada es un bundle público que solo se protege tras hidratar en
      el navegador, y las peticiones de las páginas de administración salen antes
      de que el guard emita su veredicto. Lo único que impide la fuga es la
      autorización del backend, es decir las reglas de esta spec.
    evidence:
      - file: frontend/lib/auth-context.tsx
        symbol: is_staff
        note: El rol se deriva del payload del JWT decodificado en cliente, sin verificar la firma.
      - file: frontend/components/AdminRoute.tsx
        note: Decide qué se pinta, nunca qué se puede hacer.
    permissions:
      required: [admin.metrics_read]
    frontend:
      hidden_when_denied: true
      routes:
        - /admin
      note: Es experiencia de usuario, no autorización.
    tests: {}
    cases:
      - name: falsificar is_staff en el token local muestra la carcasa del panel
        role: authenticated
        expected: denied
        note: >-
          El backend sigue rechazando cada llamada; ver PERM-045 a PERM-057, que
          son los que realmente lo demuestran.

  - id: PERM-071
    name: El informe de promoción es del dueño del anuncio
    status: implemented
    summary: >-
      GET /api/properties/{id}/promotion-stats/ solo responde al propietario del
      anuncio y a staff. Un tercero autenticado recibe 403 y un anónimo 401.
    rationale: >-
      Es la excepción deliberada a SOC-009. Las láminas son públicas porque su
      destino es que Facebook las descargue, y pueden serlo sin coste porque
      SOC-001 garantiza que no contienen nada que la ficha no enseñe. Este dato
      es distinto: quién llegó y desde dónde es del dueño, no del catálogo.

      Y por eso se decide en el servidor con un permiso de DRF. La comprobación
      del cliente no sirve: en este repo los tokens viven en localStorage y el
      frontend lee `is_staff` de un JWT sin verificar firma.
    evidence:
      - file: backend/real_estate/permissions.py
        lines: "25-42"
        symbol: class IsPropertyOwnerOrStaff
      - file: backend/real_estate/views.py
        lines: "702-704"
        symbol: "permission_classes=[IsAuthenticated, IsPropertyOwnerOrStaff]"
    permissions:
      required: [properties.read_promotion_stats]
    backend:
      enforce: true
      endpoint: GET /api/properties/{property_id}/promotion-stats/
      denied_http_status: 403
    tests:
      api: true
    cases:
      - name: el propietario consulta su informe
        role: owner
        expected: allowed
        expected_http_status: 200
      - name: un tercero autenticado no lo ve
        role: not_owner
        expected: denied
        http_status: 403
      - name: un anónimo no lo ve
        role: anonymous
        expected: denied
        http_status: 401
      - name: staff lo consulta de cualquier anuncio
        role: staff
        expected: allowed
        expected_http_status: 200

  - id: PERM-072
    name: Los throttles anónimos se identifican por la IP que observó el proxy
    status: implemented
    summary: >-
      DRF se configura con NUM_PROXIES=1, de modo que la identidad de un
      cliente anónimo para el rate limiting es la última IP de
      X-Forwarded-For — la que añadió nginx — y no la cabecera completa.
    rationale: >-
      Sin NUM_PROXIES, get_ident() usa X-Forwarded-For entera, que el cliente
      controla: bastaba rotar un valor falso por petición para estrenar cubeta
      y anular todas las cuotas anónimas (map_points, property_list,
      lead_create, pending_create, activity_create, resume_*). nginx añade la
      IP real al final con proxy_add_x_forwarded_for, así que el último salto
      es el único fiable. El tráfico interno del SSR no lleva la cabecera y se
      sigue identificando por REMOTE_ADDR, lo que preserva la exención de
      _is_internal_client.
    evidence:
      - file: backend/estate_map/settings.py
        lines: "168-180"
        symbol: "'NUM_PROXIES': 1,"
      - file: backend/real_estate/throttling.py
        lines: "24-39"
        symbol: def _is_internal_client
        note: Sigue apoyándose en la ausencia de la cabecera, no en su contenido.
    permissions:
      required: [properties.read_public]
    backend:
      enforce: true
      note: Configuración global de REST_FRAMEWORK, no un endpoint concreto.
    tests:
      api: true
    cases:
      - name: dos peticiones anónimas con prefijos XFF distintos comparten cubeta
        expected: "misma identidad de throttle; lo ejecuta test_throttle_identity.py"
      - name: el SSR interno sin cabecera XFF sigue exento
        expected: "identificado por REMOTE_ADDR privada, nunca throttled"

  - id: PERM-073
    name: Logout y cambio de credenciales revocan los refresh tokens
    status: implemented
    summary: >-
      POST /api/logout/ pone en lista negra el refresh token entregado, y
      restablecer la contraseña, cambiarla o confirmar un cambio de correo
      revoca todos los refresh tokens vivos de la cuenta.
    rationale: >-
      Los refresh tokens viven 30 días en localStorage (PERM-070): sin
      revocación, un token robado sobrevivía un mes a un cambio de contraseña
      y la víctima no tenía forma de expulsar al atacante. La rotación con
      BLACKLIST_AFTER_ROTATION solo quema el token usado, no el robado, así
      que el cierre tiene que ser explícito: el logout entrega el token propio
      y el cambio de credenciales barre OutstandingToken entero.
    evidence:
      - file: backend/real_estate/urls.py
        lines: "45-48"
        symbol: "path('logout/', TokenBlacklistView.as_view(), name='token_blacklist'),"
      - file: backend/real_estate/views.py
        lines: "1768-1780"
        symbol: def _revoke_refresh_tokens
      - file: frontend/lib/auth-tokens.ts
        symbol: revokeRefreshToken
        note: El logout del cliente entrega el token antes de vaciar el almacenamiento.
    permissions:
      required: [auth.logout]
    backend:
      enforce: true
      endpoint: POST /api/logout/
    tests:
      api: true
    cases:
      - name: el refresh entregado en el logout deja de canjearse
        expected: "401 en /api/token/refresh/; lo ejecuta test_token_revocation.py"
      - name: cambiar o restablecer la contraseña revoca las demás sesiones
        expected: "todo OutstandingToken de la cuenta queda en lista negra"
