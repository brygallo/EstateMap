version: 1
domain: social-kit-next
title: "Propuesta: lo que le falta al kit de promoción"
status: not_implemented
summary: >-
  El kit ya existe y está descrito en specs/domains/social-kit.yaml. Aquí queda
  lo que se dejó fuera de la primera versión a propósito, para que la decisión
  esté escrita en algún sitio y no haya que reconstruirla de memoria.

  Eran tres cosas. La primera —devolverle al dueño cuántas visitas trajo cada
  red— ya está construida y se mudó a specs/domains/social-kit.yaml como
  SOC-101, que es donde viven las reglas que el código aplica. Quedan dos:
  generar kits para los momentos que no son la publicación inicial, y el video
  corto que es lo único que TikTok premia de verdad. La publicación automática
  en Meta no está aquí: está en SOC-010, como decisión de no hacerla.
see_also:
  - specs/domains/social-kit.yaml
  - specs/ui/visibility-rules.yaml
  - docs/technical/cache.md

rules:
  - id: SOC-102
    name: Hay kit para los momentos que no son la publicación
    status: proposed
    summary: >-
      Además del kit inicial, se generan láminas para bajada de precio y para
      anuncio vendido o alquilado.
    rationale: >-
      Un anuncio se comparte bien una vez y luego se queda quieto. Los momentos
      que dan una excusa para volver a publicarlo son pocos y conocidos: bajó el
      precio, y se vendió.

      La lámina de «vendido» es la más valiosa de las dos y la menos evidente:
      no vende ese inmueble, que ya está vendido. La comparte el agente porque
      es su currículum, y al hacerlo distribuye el logo y el código del portal
      entre gente que todavía no lo conoce. Es publicidad que se reparte sola.

      Lo que la bloqueaba ya no la bloquea: el servidor distingue un anuncio
      vendido de uno retirado (PROP-033), le conserva la ficha y el código corto
      para que el QR de la lámina resuelva (PROP-034), y publica el precio
      anterior para la lámina de bajada (PROP-035). Queda `proposed` porque las
      láminas en sí —composición, textos y la pantalla que las ofrece— son
      trabajo de frontend y no están escritas.
    tests: {}
    cases:
      - name: Bajar el precio ofrece la lámina de bajada
        given: {price_anterior: 90000, price: 79000}
        expected: presente
      - name: La lámina de bajada muestra los dos precios
        expected: presente
      - name: Marcar como vendido ofrece la lámina de vendido
        given: {closed_reason: sold}
        expected: presente
      - name: Un anuncio inactivo no es lo mismo que uno vendido
        given: {status: inactive, closed_reason: ""}
        expected: ausente
        note: Retirar un anuncio no es una venta y no merece felicitación.

  - id: SOC-103
    name: Un video corto para TikTok y Reels
    status: proposed
    summary: >-
      El kit genera un video de unos ocho segundos con las fotos del anuncio y la
      lámina de mapa como cierre.
    rationale: >-
      TikTok premia video, no imágenes. Hoy el kit le entrega una portada 9:16 y
      un gancho, y le pide a la persona que arme el resto en la aplicación, que
      es exactamente la fricción que el kit existe para quitar.

      Se dejó fuera de la primera versión porque cambia la naturaleza del
      trabajo: componer un PNG cabe en una petición HTTP, codificar un MP4 no.
      Necesita ffmpeg en una tarea de Celery, un sitio donde guardar el
      resultado y una forma de avisar de que ya está listo — tres piezas que el
      resto del kit no necesitaba.
    tests: {}
    cases:
      - name: El video se genera fuera de la petición
        expected: presente
        note: Encolado, no síncrono; codificar bloqueando la respuesta no es opción.
      - name: El video termina con la lámina de mapa
        expected: presente
      - name: Un anuncio sin fotos no genera video
        given: {images: []}
        expected: ausente
        note: >-
          Ocho segundos de fondo de marca no son un video, son una pantalla de
          carga. Aquí la lámina fija de SOC-004 es mejor respuesta.
