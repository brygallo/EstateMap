version: 1
domain: properties
title: Encuadre del mapa de una ficha
status: proposed
summary: >-
  El mapa de la ficha mantiene la propiedad consultada en el centro y abre con
  suficiente contexto para mostrar publicaciones cercanas alrededor.

rules:
  - id: PROP-035
    name: La propiedad de la ficha queda centrada junto a sus vecinas
    status: proposed
    summary: >-
      Al abrir el mapa de una ficha, la propiedad seleccionada ocupa el centro
      de la cámara. El encuadre se extiende de forma simétrica hasta incluir las
      publicaciones cercanas disponibles y limita el acercamiento inicial para
      que el anuncio no aparezca aislado cuando todavía hay inventario alrededor.
    rationale: >-
      Ajustar límites directamente entre todos los puntos centra el rectángulo
      geográfico, no necesariamente la propiedad que la persona está revisando.
      Un encuadre simétrico conserva esa referencia y deja opciones visibles a
      ambos lados para continuar explorando.
    cases:
      - name: Ficha con varias publicaciones cercanas
        expected: propiedad seleccionada centrada y vecinas visibles alrededor
      - name: Ficha con una sola publicación cercana
        expected: ambas visibles con la propiedad seleccionada en el centro
      - name: Ficha sin publicaciones cercanas
        expected: propiedad centrada con un zoom de contexto, no con acercamiento máximo
    tests:
      unit: true
