version: 1
domain: map-performance
title: Rendimiento percibido del mapa
status: implemented
summary: >
  El mapa prioriza los puntos sobre datos secundarios, conserva las rutas de
  caché pública aunque exista una sesión y evita repetir el movimiento de cámara
  cuando llega el detalle de una propiedad seleccionada.

rules:
  - id: MPERF-004
    name: Cada nivel territorial reutiliza una sola respuesta cacheada
    status: implemented
    summary: >
      Las vistas de Ecuador, provincias y ciudades usan respectivamente una
      clave canónica de Redis. En esos niveles se ignoran el bbox y los decimales
      del zoom porque el resultado territorial se calcula sobre todo el inventario
      filtrado; solo el nivel de propiedades individuales conserva claves espaciales.
    rationale: >
      Incluir la posición exacta de la cámara en una clave cuyo resultado no
      depende de esa posición convertía cada pequeño movimiento en un cache miss.
      La versión del inventario ya invalida estas respuestas cuando una propiedad
      cambia, por lo que pueden conservarse calientes durante una hora.
    evidence:
      - file: backend/real_estate/services/map_payload.py
        symbol: canonical_cluster_zoom
        note: País, provincia y ciudad se reducen a un zoom estable por nivel.
      - file: backend/real_estate/views.py
        symbol: cache_bbox
        note: El cache territorial usa `all`, TTL de una hora y el zoom canónico; los puntos siguen usando bbox y TTL corto.
      - file: frontend/hooks/usePropertyFilters.ts
        symbol: mapRequestKey
        note: La memoria del navegador usa los mismos tres niveles y no añade debounce a sus peticiones.
      - file: tests/e2e/map.spec.ts
        symbol: "moving the map loads the zone it lands on"
        note: Acercarse dentro de un nivel agregado no pide red; cruzar al nivel de puntos sí.
    cases:
      - name: La persona mueve el mapa sin salir del nivel de provincias
        expected: reutiliza la misma respuesta de Redis sin recalcular Pichincha ni las demás provincias
      - name: La persona pasa de provincias a ciudades
        expected: solicita una única respuesta canónica distinta para el nuevo nivel
      - name: La persona entra al nivel de propiedades individuales
        expected: la clave vuelve a incluir el área visible para no mezclar puntos de zonas distintas
    tests:
      unit: true

  - id: MPERF-001
    name: Las lecturas públicas del mapa no dependen de la sesión
    status: implemented
    summary: >
      Puntos, listado, resumen y catálogos de filtros se solicitan sin cabecera
      de autorización aunque exista una sesión local. Así pueden reutilizar la
      caché pública y no esperan una renovación del token para dibujar el mapa.
    evidence:
      - file: frontend/hooks/usePropertyFilters.ts
        lines: "281-470"
        symbol: "skipAuth: true"
        note: Todas las lecturas públicas que alimentan el mapa omiten autenticación.
    cases:
      - name: Persona autenticada abre el mapa
        expected: los endpoints públicos se solicitan sin Authorization
    tests: {}

  - id: MPERF-002
    name: Una selección produce una sola transición de cámara
    status: implemented
    summary: >
      Los manejadores seleccionan la propiedad y un único efecto centra la
      cámara por id. La llegada posterior del detalle de esa misma propiedad no
      inicia otra transición.
    evidence:
      - file: frontend/components/maps/MapLibreMap.tsx
        lines: "311-326"
        symbol: centeredSelectionRef.current
        note: El id seleccionado impide repetir el centrado.
      - file: frontend/components/MapPageClient.tsx
        lines: "289-345"
        symbol: setSelectedProperty
        note: Los manejadores seleccionan y abren la ficha sin mover directamente el mapa.
    cases:
      - name: El detalle reemplaza el resumen de la propiedad seleccionada
        expected: la cámara no inicia otra transición
    tests: {}

  - id: MPERF-003
    name: La conexión lenta prioriza puntos sobre fichas e imágenes
    status: implemented
    summary: >
      Cuando el navegador comunica ahorro de datos o una conexión 2g, el mapa
      reduce la muestra transferida, omite imágenes en la lista inicial y
      retrasa las fichas. En móvil, fichas y catálogos auxiliares esperan hasta
      que se abra el panel.
    evidence:
      - file: frontend/lib/network-profile.ts
        lines: "14-32"
        symbol: getMapNetworkProfile
        note: Define el perfil restringido para 2g y ahorro de datos.
      - file: frontend/hooks/usePropertyFilters.ts
        lines: "398-511"
        symbol: networkProfile.mapPointLimit
        note: Aplica límites, imágenes y retraso del perfil a las peticiones.
      - file: frontend/components/MapPageClient.tsx
        lines: "87-90"
        symbol: cardsEnabled
        note: En móvil posterga datos secundarios mientras el panel está cerrado.
    cases:
      - name: Navegador con saveData activo
        expected: los puntos se solicitan antes que las fichas con imágenes
    tests: {}

  - id: MPERF-005
    name: Un payload caducado se sigue sirviendo mientras uno solo lo recalcula
    status: implemented
    summary: >-
      Las estadísticas de mercado se guardan con una fecha de frescura y un
      margen posterior. Pasada la frescura, la respuesta se sigue entregando
      mientras el primer worker que toma el cerrojo la recalcula; los demás
      reciben la copia anterior en lugar de repetir el cálculo.
    rationale: >-
      El patrón corriente —leer, fallar, calcular, escribir— cobra dos veces
      cuando hay tráfico. La petición que encuentra la entrada vencida espera el
      cálculo entero, y todas las que llegan mientras tanto lo repiten. En estas
      estadísticas eso son catorce mil filas viajando a Python varias veces a la
      vez, en una máquina de cuatro núcleos compartida con otros servicios.

      Servir lo viejo unos segundos es preferible a que nadie reciba nada
      durante el cálculo: son promedios de mercado, no saldos de una cuenta.
    evidence:
      - file: backend/real_estate/cache_utils.py
        symbol: def cached_or_stale
      - file: backend/real_estate/cache_utils.py
        symbol: REFRESH_LOCK_SECONDS
      - file: backend/real_estate/views.py
        symbol: "payload = cached_or_stale(cache_key, CACHE_TTL_MARKET_STATS, compute)"
      - file: backend/real_estate/tests/test_cache_refresh.py
        symbol: def test_only_one_worker_recomputes_a_stale_entry
    tests:
      api: true
    cases:
      - name: Segunda petición dentro de la frescura
        expected: se sirve de caché sin recalcular
      - name: Petición con la entrada vencida y sin nadie recalculando
        expected: este worker recalcula y guarda
      - name: Cinco peticiones con la entrada vencida y el cerrojo tomado
        expected: las cinco reciben la copia anterior; no se recalcula cinco veces

  - id: MPERF-006
    name: La conexión a la base se reutiliza entre peticiones
    status: implemented
    summary: >-
      Las conexiones viven sesenta segundos y se comprueban antes de
      reutilizarse, en vez de abrirse y cerrarse en cada petición.
    rationale: >-
      Postgres corre en el mismo host, así que un saludo cuesta poco; a quince
      peticiones por segundo son quince saludos por segundo pagados a cambio de
      nada. El comprobante de salud es lo que evita el otro extremo: heredar un
      descriptor muerto tras reiniciar la base y fallar la petición que lo toque.

      El techo queda acotado a propósito: tres workers de cuatro hilos más el
      worker de Celery son como mucho trece conexiones vivas.
    evidence:
      - file: backend/estate_map/settings.py
        symbol: "DATABASES[_alias].setdefault('CONN_MAX_AGE'"
      - file: backend/estate_map/settings.py
        symbol: "DATABASES[_alias].setdefault('CONN_HEALTH_CHECKS', True)"
    tests: {}
    cases:
      - name: Dos peticiones seguidas al mismo worker
        expected: comparten conexión
      - name: La base se reinicia dentro de la ventana
        expected: la conexión muerta se descarta antes de usarse
