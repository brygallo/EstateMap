version: 1
domain: map-cluster-hierarchy
title: Jerarquía territorial del mapa
status: implemented
summary: >
  La navegación agrupada termina en ciudad y desde allí muestra directamente
  los labels de precios de propiedades individuales.

rules:
  - id: MCLUS-001
    name: El mapa solo agrupa por país, provincia y ciudad
    status: implemented
    summary: >
      No existe una cuarta capa de agrupadores por grilla. Hasta zoom 9.2 el
      backend elige país, provincia o ciudad; después entrega puntos.
    evidence:
      - file: backend/real_estate/services/map_payload.py
        lines: "134-179"
        symbol: MAX_CLUSTER_ZOOM
        note: El corte único cambia de modo agrupado a puntos individuales.
      - file: backend/real_estate/services/map_payload.py
        lines: "254-260"
        symbol: _group_level_for_zoom
        note: Los únicos niveles devueltos son country, province y city.
    cases:
      - name: Vista posterior a ciudad
        expected: puntos individuales sin agrupadores de grilla
    tests: {}

  - id: MCLUS-002
    name: Pulsar una ciudad abre directamente sus precios
    status: implemented
    summary: >
      El agrupador de ciudad centra la cámara en una propiedad real del grupo a
      zoom 12, que está por encima del umbral de agrupación y muestra los labels
      de precio. Nunca desplaza a la persona a un centro territorial sin inventario.
    evidence:
      - file: backend/real_estate/services/map_payload.py
        lines: "467-482"
        symbol: "'latitude': center['lat']"
        note: La posición visible del agrupador es el medoid, es decir, las coordenadas de una propiedad real del grupo.
      - file: frontend/components/maps/MapLibreMap.tsx
        lines: "675-712"
        symbol: "groupLevel === 'city'"
        note: Ciudad reutiliza la posición del agrupador y abre directamente a zoom 12; el ancla territorial se reserva para país y provincia.
    cases:
      - name: Persona pulsa el agrupador de una ciudad
        expected: cámara centrada en una propiedad real de la ciudad a zoom de puntos
    tests:
      unit: true

  - id: MCLUS-003
    name: Elegir una ciudad en los filtros mueve el mapa a su centro
    status: implemented
    summary: >
      El catálogo de ubicaciones debe entregar un centro para cada ciudad con
      inventario activo. Al elegirla en el filtro, el mapa debe desplazarse a
      ese punto y entrar al nivel de detalle de ciudad.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1027-1064"
        symbol: "centers.setdefault"
        note: El catálogo calcula el centro medio de las propiedades activas de cada ciudad.
      - file: frontend/components/map/MapFilters.tsx
        lines: "297-313"
        symbol: "onCitySelect"
        note: Elegir una ciudad entrega su centro al contenedor del mapa.
      - file: frontend/components/MapPageClient.tsx
        lines: "160-172"
        symbol: "handleCityFilterSelect"
        note: La cámara viaja al centro recibido con zoom de ciudad.
    cases:
      - name: Persona elige una ciudad en el filtro móvil
        expected: el mapa se centra en la ciudad seleccionada
    tests:
      api: true

  - id: MCLUS-004
    name: El mapa comunica y revela progresivamente cada cambio de nivel
    status: implemented
    summary: >
      Al cambiar entre país, provincia, ciudad y puntos, el mapa muestra de
      inmediato una barra de actividad y conserva los resultados del nivel anterior
      hasta tener su reemplazo. Cuando llega la respuesta, los agrupadores y precios
      nuevos aparecen en una secuencia breve cuyo retraso total está limitado para
      no volver lenta la vista.
    rationale: >
      El backend entrega cada nivel como una respuesta completa. Sin respuesta
      inmediata ni transición de entrada, el intervalo entre niveles parece un
      bloqueo aunque la petición siga avanzando.
    evidence:
      - file: frontend/hooks/usePropertyFilters.ts
        lines: "350-377"
        symbol: "if (hasCachedResults)"
        note: Una petición sin caché activa la carga antes del debounce; el estado vacío queda reservado para respuestas terminadas y los marcadores anteriores permanecen hasta recibir el reemplazo.
      - file: frontend/lib/map-navigation.ts
        lines: "20-22"
        symbol: getMarkerRevealDelay
        note: Escalona las entradas 22 ms y limita toda la secuencia a 264 ms.
      - file: frontend/components/maps/MapLibreMap.tsx
        lines: "645-658"
        symbol: "--map-marker-delay"
        note: Los agrupadores nuevos reciben el retraso progresivo sin animar la transformación geográfica de MapLibre.
      - file: frontend/components/maps/MapLibreMap.tsx
        lines: "813-831"
        symbol: getMarkerRevealDelay
        note: Los precios individuales usan la misma secuencia breve al entrar.
    cases:
      - name: Persona cambia a un nivel del mapa que todavía no está en caché
        expected: ve actividad inmediata sin un mapa vacío y luego los resultados se reemplazan progresivamente
      - name: La respuesta contiene muchos resultados visibles
        expected: el último retraso de entrada no supera 264 ms
    tests:
      unit: true

  - id: MCLUS-005
    name: Buscador, filtros y detalle comparten un solo panel móvil
    status: implemented
    summary: >
      En móvil existe una sola instancia del panel del mapa. El panel cambia su
      contenido entre búsqueda, filtros, resultados y detalle de propiedad, pero
      conserva las mismas posiciones cerrado, medio y completo, el mismo resorte,
      la misma manija y la misma transferencia entre scroll y arrastre. Buscar y
      filtrar abre completo; el detalle abre a media altura para conservar el mapa.
      Un gesto rápido hacia abajo, iniciado cuando el contenido está arriba,
      cierra el panel por completo. En el detalle embebido, la fotografía empieza
      inmediatamente debajo de la manija compartida, sin reservar una segunda
      franja superior. El listado contiene únicamente propiedades, sin tarjetas
      auxiliares de «Vista actual» ni listas de ciudades.
    rationale: >
      Montar un drawer para buscar y un modal distinto para el detalle produce
      alturas, cierres y gestos contradictorios. Cambiar el contenido dentro de
      una única superficie mantiene la memoria muscular de la persona.
    evidence:
      - file: frontend/components/MapPageClient.tsx
        lines: "371-408"
        symbol: embeddedInMobilePanel
        note: La única instancia de MobilePropertyDrawer alterna entre PropertySidebar y PropertyModal según el modo actual.
      - file: frontend/components/map/MobilePropertyDrawer.tsx
        lines: "31-223"
        symbol: MobilePropertyDrawer
        note: Un solo componente posee posiciones, resorte, manija, scroll, arrastre, backdrop y bloqueo del documento.
      - file: frontend/components/PropertyModal.tsx
        lines: "128-145"
        symbol: embeddedInMobilePanel
        note: El detalle puede entregar solo su contenido al panel móvil compartido; conserva su panel lateral independiente únicamente en escritorio.
      - file: frontend/components/maps/MapLibreMap.tsx
        lines: "521-560"
        symbol: onMapBackgroundClickRef
        note: Un toque sin propiedades ni agrupadores debajo se comunica al único panel móvil para cerrarlo.
      - file: frontend/components/maps/MapLibreMap.tsx
        symbol: onPolygonClickRef
        note: La capa rellena de cada polígono resuelve la propiedad tocada y entrega el mismo callback que los marcadores de precio.
    cases:
      - name: Persona abre una propiedad desde los resultados en móvil
        expected: el panel existente cambia a detalle a media altura sin montar otro modal móvil
      - name: Persona abre el buscador y los filtros en móvil
        expected: el mismo panel abre completo para mostrar todos los controles
      - name: Persona desliza hacia arriba el contenido con el panel a media altura
        expected: el panel se amplía por completo antes de desplazar el contenido
      - name: Persona desliza rápidamente hacia abajo el detalle desde el inicio del contenido
        expected: el gesto se transfiere al panel y lo cierra por completo
      - name: Persona abre el detalle de una propiedad en móvil
        expected: la fotografía empieza debajo de la manija sin un espacio superior vacío
      - name: Persona abre el listado de resultados
        expected: ve las propiedades sin bloques de vista actual ni navegación por ciudades
      - name: Persona toca una zona libre del mapa con filtros o detalle abiertos
        expected: el panel se cierra; tocar una propiedad o agrupador no lo cierra
      - name: Persona toca el área de un polígono en el mapa
        expected: se abre el detalle de esa propiedad igual que al tocar su marcador
    tests:
      unit: true

  - id: MCLUS-007
    name: La tarjeta del mapa usa un flujo progresivo sin botones repetidos
    status: implemented
    summary: >
      En móvil y escritorio, la tarjeta compacta no muestra botones «Mapa», «Ver
      mapa» ni «Detalle». El primer toque sobre cualquier parte de una tarjeta la
      centra en el mapa y la selecciona; un segundo toque sobre esa misma tarjeta
      abre el detalle. En móvil, el primer toque deja el panel a media altura.
    rationale: >
      La lista del mapa repite muchas tarjetas. Botones por fila consumen altura y
      dominan visualmente; selección y detalle pueden formar una secuencia natural.
    evidence:
      - file: frontend/components/PropertyCard.tsx
        lines: "231-335"
        symbol: "onClick={selected ? onOpenDetails : onClick}"
        note: El bloque principal alterna entre centrar y abrir detalle según el estado seleccionado; no renderiza acciones separadas.
      - file: frontend/components/map/MapPropertyCard.tsx
        lines: "14-32"
        symbol: MapPropertyCard
        note: Móvil y escritorio consumen la misma tarjeta compacta compartida.
      - file: frontend/components/map/PropertySidebar.tsx
        lines: "100-155"
        symbol: compareSelectedFirst
        note: La seleccionada se inyecta si falta y gana cualquier criterio de orden para permanecer primera.
    cases:
      - name: Persona toca una tarjeta no seleccionada
        expected: centra la propiedad y, en móvil, deja el panel a media altura
      - name: Persona vuelve a tocar la tarjeta seleccionada
        expected: abre el detalle de la propiedad
      - name: La propiedad seleccionada no estaba en la página actual o no tiene distancia
        expected: se incorpora y aparece primera de todos modos
    tests: {}

  - id: MCLUS-006
    name: Pulsar una provincia sin ciudades abre directamente sus propiedades
    status: implemented
    summary: >
      Cuando todas las propiedades activas agrupadas bajo una provincia carecen
      de ciudad, pulsar el agrupador provincial centra la cámara en una propiedad
      real del grupo y entra al nivel de puntos. Si existe al menos una ciudad
      registrada, conserva la navegación normal al nivel de ciudad.
    rationale: >
      Mantener un nivel de ciudad vacío obliga a realizar un paso que no aporta
      información y puede centrar la cámara lejos del inventario.
    evidence:
      - file: backend/real_estate/services/map_payload.py
        lines: "368-460"
        symbol: has_named_cities
        note: El agrupador provincial comunica si al menos una propiedad tiene ciudad registrada.
      - file: frontend/components/maps/MapLibreMap.tsx
        lines: "695-729"
        symbol: "groupLevel === 'province' && !hasNamedCities"
        note: Una provincia sin ciudades usa el centro del inventario y salta directamente al zoom de puntos.
    cases:
      - name: Provincia cuyo inventario no tiene ninguna ciudad registrada
        expected: cámara centrada en una propiedad real a zoom de puntos
      - name: Provincia con al menos una ciudad registrada
        expected: navegación al nivel de ciudad sin cambios
    tests:
      unit: true
