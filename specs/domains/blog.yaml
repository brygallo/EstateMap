version: 1
domain: blog
title: Blog editorial
status: implemented
summary: >-
  El portal publica artículos escritos por el equipo desde el admin de Django y
  servidos por Next.js en `/blog`. Existe por una razón concreta: el inventario
  de anuncios posiciona consultas transaccionales («departamentos en venta en
  Cumbayá») pero no las informativas («cuánto cuesta la alcabala», «qué exige la
  Ley de Inquilinato»), que son las que la gente pregunta antes de comprar y las
  que los buscadores de IA citan.

  La pieza que da forma al dominio es la programación. Escribir treinta
  artículos en una tarde y soltarlos el mismo día se lee como lo que es; el
  calendario los reparte uno por día. Por eso la publicación se decide con una
  fecha, no con una cola: un post es público desde que `published_at` queda en
  el pasado, aunque el worker esté caído. Celery solo se encarga de los efectos
  (avisar a IndexNow, invalidar el caché de Next), que llegar tarde encarece
  pero no rompe.

  La API pública es de solo lectura. La escritura se realiza desde el escritorio
  editorial protegido del panel de administración. Las siete guías que vivían incrustadas en el
  frontend (`lib/guias.ts`) son sus primeros posts y conservan su slug, con
  `/guias/<slug>` redirigiendo de forma permanente a `/blog/<slug>`.
see_also:
  - specs/ui/visibility-rules.yaml
  - specs/permissions/matrix.yaml
  - docs/technical/cache.md
  - docs/seo/editorial-y-backlinks.md

rules:
  - id: BLOG-001
    name: Un post es público desde que su fecha de publicación queda en el pasado
    status: implemented
    summary: >-
      La API pública entrega un post cuando `published_at` es anterior al
      instante actual, sin depender de que ninguna tarea lo haya marcado.
    rationale: >-
      La alternativa evidente —que una tarea de Celery cambie el estado a
      `published` y solo entonces se vea— convierte al broker en autoridad sobre
      el calendario editorial. Una caída del worker un sábado congelaría la
      publicación hasta que alguien lo note, y lo notaría por el hueco en Search
      Console, no por una alerta.

      Aquí la fecha manda y el estado la acompaña: el filtro público acepta
      `scheduled` y `published` por igual siempre que la fecha haya llegado. La
      tarea horaria sigue existiendo, pero solo para lo que un reloj no puede
      hacer: avisar a IndexNow y tirar el caché de Next. Si no corre, el post
      sale igual y tarda un poco más en ser indexado.
    evidence:
      - file: backend/blog/models.py
        lines: "62-77"
        symbol: def public
        note: >-
          El filtro público acepta SCHEDULED y PUBLISHED; lo que decide es
          `published_at__lte=timezone.now()`.
      - file: backend/blog/views.py
        lines: "49-51"
        symbol: Post.objects.public()
        note: Es el único queryset del que sale cualquier respuesta pública.
    backend:
      endpoint: GET /api/blog/posts/
    tests: {api: true}
    cases:
      - name: Un post programado para ayer ya se lee
        given: {blog_post_published_days_ago: 1}
        expected: visible
      - name: Un post programado para mañana todavía no se lee
        given: {blog_post_published_in_days: 1}
        expected: ausente

  - id: BLOG-002
    name: Los borradores y los archivados no salen nunca al público
    status: implemented
    summary: >-
      Un post en estado `draft` o `archived` queda fuera del listado y devuelve
      404 en su detalle, tenga la fecha que tenga.
    rationale: >-
      El estado es la única forma de retirar del sitio algo ya publicado sin
      borrarlo ni inventar una fecha futura, que es lo que haría un editor
      apurado si no existiera. Se comprueba en el mismo queryset que BLOG-001
      para que no haya dos definiciones de «público» que puedan divergir.
    evidence:
      - file: backend/blog/models.py
        lines: "62-77"
        symbol: status__in=(Post.Status.SCHEDULED, Post.Status.PUBLISHED)
        note: DRAFT y ARCHIVED quedan fuera por construcción.
    backend:
      endpoint: GET /api/blog/posts/
      denied_http_status: 404
    tests: {api: true}
    cases:
      - name: Un borrador con fecha pasada sigue sin verse
        given: {blog_post_draft: true}
        expected: ausente
      - name: El detalle de un borrador devuelve 404
        given: {blog_post_draft: true}
        expected: denied
        http_status: 404

  - id: BLOG-003
    name: La API pública del blog es de solo lectura
    status: implemented
    summary: >-
      La API pública del blog no expone crear, editar ni borrar a nadie. La
      escritura usa endpoints administrativos separados y protegidos.
    rationale: >-
      Es contenido que edita un puñado de personas unas veces por semana. Abrir
      un endpoint de escritura para eso añade superficie de ataque, validación y
      permisos a cambio de comodidad que el admin de Django ya da. La regla se
      sostiene por el tipo de viewset, no por una comprobación que alguien pueda
      olvidar: `ReadOnlyModelViewSet` sencillamente no enruta POST ni PUT.
    evidence:
      - file: backend/blog/views.py
        lines: "40-44"
        symbol: class BlogPostViewSet(viewsets.ReadOnlyModelViewSet)
      - file: backend/blog/views.py
        lines: "113-120"
        symbol: class BlogCategoryViewSet(viewsets.ReadOnlyModelViewSet)
    backend:
      endpoint: POST /api/blog/posts/
      denied_http_status: 405
    tests: {api: true}
    cases:
      - name: Un anónimo no puede crear posts
        role: anonymous
        expected: denied
        http_status: 405
      - name: Un usuario autenticado tampoco
        role: authenticated
        expected: denied
        http_status: 405

  - id: BLOG-010
    name: Solo administradores gestionan el blog desde el panel
    status: implemented
    summary: >-
      Los endpoints editoriales permiten listar, crear, editar, publicar,
      programar y eliminar contenido únicamente a cuentas con `is_staff`.
    rationale: >-
      El JWT que lee el frontend sirve para adaptar la interfaz, pero la frontera
      de seguridad está en Django y comprueba el usuario autenticado.
    evidence:
      - file: backend/blog/admin_api.py
        symbol: class AdminBlogPostViewSet
        note: El viewset exige autenticación y el permiso de administrador.
      - file: frontend/app/admin/blog/page.tsx
        symbol: export default function BlogAdminPage
        note: El escritorio editorial vive dentro del panel principal.
    backend:
      endpoint: POST /api/admin/blog/posts/
      denied_http_status: 403
    frontend:
      routes: [/admin/blog]
    tests: {api: true}
    cases:
      - name: Un usuario normal no puede editar un artículo
        role: authenticated
        expected: denied
        http_status: 403
      - name: Un administrador puede crear un borrador
        role: staff
        expected: allowed
        expected_http_status: 201
        body:
          title: Cómo comprar una casa
          slug: como-comprar-una-casa
          excerpt: Una guía clara para preparar la compra.
          body: "## Primer paso\n\nCompara las alternativas."
          status: draft

  - id: BLOG-011
    name: El editor controla el ciclo editorial completo
    status: implemented
    summary: >-
      Un artículo puede guardarse como borrador, programarse con fecha futura,
      publicarse inmediatamente o retirarse del sitio desde el panel integrado.
    rationale: >-
      El panel expone el calendario y los estados existentes sin crear una
      segunda definición de cuándo el contenido es público.
    evidence:
      - file: backend/blog/admin_api.py
        symbol: def publish
        note: Publicar ahora establece estado y fecha de publicación.
      - file: backend/blog/admin_api.py
        symbol: def draft
        note: Volver a borrador retira el artículo del sitio público.
      - file: backend/blog/admin_api.py
        symbol: def schedule_daily
        note: La selección se distribuye un artículo por día sin solaparse.
    tests: {api: true}
    cases:
      - name: Publicar ahora fija una fecha pública
        role: staff
        expected: published
      - name: Pasar a borrador retira el artículo
        role: staff
        expected: draft

  - id: BLOG-004
    name: El listado público entrega como mucho 60 posts por petición
    status: implemented
    summary: >-
      `?limit=` se recorta a 60 y cualquier valor inválido cae al valor por
      defecto de 24.
    rationale: >-
      El endpoint es anónimo y cacheado por combinación de parámetros. Sin techo,
      un `?limit=100000` serializa el archivo entero y además ensucia Redis con
      una entrada enorme por cada valor que alguien pruebe. El recorte es
      silencioso a propósito: quien pide de más recibe una página válida, no un
      400 que obligue a manejar el error en el frontend.
    evidence:
      - file: backend/blog/views.py
        lines: "36-37"
        symbol: MAX_LIMIT
      - file: backend/blog/views.py
        lines: "62-63"
        symbol: limit = max(1, min(limit, MAX_LIMIT))
    backend:
      endpoint: GET /api/blog/posts/
    tests: {api: true}
    cases:
      - name: Un limit desmedido se recorta al máximo
        given: {blog_posts: 3}
        expected: {max_results: 60}
      - name: Un limit no numérico no rompe la respuesta
        given: {blog_posts: 3}
        expected: {http_status: 200}

  - id: BLOG-005
    name: Publicar avisa a los buscadores e invalida el caché del frontend
    status: implemented
    summary: >-
      Cuando un post pasa a ser público, se encola un ping de IndexNow con su URL
      y una revalidación de las etiquetas `blog` y `blog-<slug>` en Next.js.
    rationale: >-
      Un artículo que nadie recrawlea durante días no posiciona: la ventaja de
      IndexNow es que Bing —y con él ChatGPT y Copilot— lo ve el mismo minuto.
      Y sin invalidar las etiquetas, `/blog` seguiría sirviendo la lista vieja
      hasta agotar su ventana de ISR, así que el post existiría pero no habría
      forma de llegar a él navegando.

      Programar para dentro de un mes no dispara nada: la señal comprueba
      `is_public` antes, porque avisar a un buscador de una URL que aún devuelve
      404 gasta presupuesto de rastreo y enseña un error.
    evidence:
      - file: backend/blog/signals.py
        lines: "39-50"
        symbol: def post_saved
      - file: backend/blog/tasks.py
        lines: "24-52"
        symbol: def publish_scheduled_posts
    tests: {unit: true}
    cases:
      - name: Guardar un post ya público avisa a IndexNow
        given: {blog_post_published_days_ago: 1}
        expected: notificado
      - name: Guardar un post programado a futuro no avisa a nadie
        given: {blog_post_published_in_days: 30}
        expected: silencio

  - id: BLOG-006
    name: Las guías migradas conservan su URL mediante redirección permanente
    status: implemented
    summary: >-
      `/guias` y `/guias/<slug>` responden con un 308 hacia `/blog` y
      `/blog/<slug>`, y los slugs de las siete guías no cambiaron.
    rationale: >-
      Las guías llevaban meses indexadas. Moverlas sin redirección tira a la
      basura el poco historial que tiene un dominio joven y deja siete 404 en
      Search Console; duplicar el contenido en las dos rutas es peor todavía,
      porque obliga a Google a elegir canónica y reparte las señales entre dos
      URLs.

      La redirección es permanente (308 en Next.js, equivalente a un 301 que
      además preserva el método) para que el traspaso de autoridad sea
      inequívoco, y el contenido vive en un solo sitio.
    evidence:
      - file: frontend/next.config.js
        symbol: async redirects
        note: Redirige la sección entera y cada guía a su post equivalente.
      - file: backend/blog/seed/guides.json
        symbol: como-comprar-una-propiedad-en-ecuador
        note: >-
          El seed conserva los slugs originales; el texto se exportó de
          `lib/guias.ts` sin reescribirlo.
    frontend:
      routes:
        - /guias
        - /guias/[slug]
        - /blog
        - /blog/[slug]
    tests: {}
    cases:
      - name: La guía de compra responde en su nueva URL
        expected: /blog/como-comprar-una-propiedad-en-ecuador
      - name: La URL antigua redirige de forma permanente
        expected: 308

  - id: BLOG-007
    name: Programar un lote no pisa lo que ya está en el calendario
    status: implemented
    summary: >-
      La acción «uno por día» arranca al día siguiente del último post ya
      programado, de modo que dos lotes seguidos se encolan en vez de solaparse.
    rationale: >-
      El caso real es escribir por tandas: veinte posts un lunes, quince el
      viernes. Si la acción empezara siempre mañana, la segunda tanda caería
      encima de la primera y saldrían dos artículos al día durante dos semanas
      —exactamente el patrón que la programación existe para evitar.
    evidence:
      - file: backend/blog/admin.py
        lines: "154-182"
        symbol: def schedule_daily
    tests: {unit: true}
    cases:
      - name: Un segundo lote continúa donde terminó el primero
        given: {blog_scheduled_posts: 3}
        expected: sin solapamiento
      - name: Los posts del lote quedan a un día de distancia entre sí
        expected: 1 día

  - id: BLOG-008
    name: Cada autor con nombre público tiene una página enlazable
    status: implemented
    summary: >-
      Los artículos firmados enlazan a `/blog/autor/<autor>`, donde se muestran
      la credencial pública y todos sus artículos. El schema Article usa esa
      misma URL para identificar a la persona y la página publica ProfilePage.
    rationale: >-
      Un nombre y un cargo sueltos no permiten comprobar quién responde por el
      contenido. Una URL estable reúne la firma, la credencial y el historial
      editorial para personas y buscadores, sin inventar perfiles externos.
    evidence:
      - file: backend/blog/models.py
        symbol: "self.author_slug = slugify(self.public_author_name)[:140]"
        note: >-
          El slug se deriva al guardar, así que renombrar al autor mueve su
          página en vez de dejar la firma y la URL en desacuerdo.
      - file: backend/blog/views.py
        symbol: "queryset.filter(author_slug=author)"
        note: El listado público filtra por autor; la página no re-deriva nada.
      - file: frontend/app/blog/[slug]/page.tsx
        symbol: "const authorPath = post.author_name"
        note: La firma del artículo y el `author.url` del schema salen del mismo valor.
      - file: frontend/app/blog/autor/[autor]/page.tsx
        symbol: "export default async function AuthorPage"
      - file: frontend/app/sitemap.ts
        symbol: "`${SITE_URL}/blog/autor/${slug}`"
        note: >-
          Si el schema afirma la entidad, el sitemap tiene que ofrecerla a
          rastreo.
    frontend:
      routes: ["/blog/autor/[autor]"]
    tests: {api: true, unit: true}
    cases:
      - name: Un artículo firmado enlaza a su autor
        expected: página de autor con sus artículos
      - name: Renombrar al autor mueve su página
        expected: el slug se recalcula al guardar
      - name: Un autor inexistente no cae al listado completo
        expected: cero resultados

  - id: BLOG-009
    name: Un artículo de ciudad entrega el precio del m² y el inventario de esa ciudad
    status: implemented
    summary: >-
      Un post con `city` publica, dentro del HTML servido, el precio medio del
      m² de esa ciudad calculado sobre los anuncios del portal, y enlaza a su
      catálogo y a su índice de precios. Si la muestra no llega al umbral de
      promoción, se omiten las cifras y queda solo el enlace al catálogo.
    rationale: >-
      El blog captura la consulta informativa («cuánto cuesta la alcabala en
      Quito»); sin un puente al inventario esa visita se va sin ver una sola
      propiedad. Y lo que hace citable al artículo no es el consejo, que
      cualquiera repite, sino el dato que solo tiene este portal: por eso la
      cifra va en el HTML —los rastreadores de IA no ejecutan JavaScript— y se
      declara como Dataset junto al artículo.

      El umbral es la otra mitad de la regla. Publicar un promedio calculado
      sobre tres anuncios como si fuera el precio de una ciudad es la forma más
      rápida de que te citen una vez y no te vuelvan a creer.
    evidence:
      - file: frontend/components/blog/CityPriceBlock.tsx
        symbol: "if (listings < MIN_LISTINGS_FOR_PROMOTION || pricePerM2 <= 0) return null"
        note: Por debajo del umbral no se publica cifra, solo el enlace al catálogo.
      - file: frontend/app/blog/[slug]/page.tsx
        symbol: "const cityFacts = post.city ? await getCityPriceFacts(post.city) : null"
        note: >-
          El bloque visible y el JSON-LD leen el mismo resultado, así que el
          schema no puede afirmar una cifra que la página no muestra.
      - file: backend/blog/models.py
        symbol: "city = models.CharField("
        note: La ciudad del artículo se elige en el admin; vacía significa alcance nacional.
    frontend:
      routes: ["/blog/[slug]"]
    tests: {api: true}
    cases:
      - name: Un artículo con ciudad y muestra suficiente
        expected: precio del m², enlace al catálogo y al índice de precios
      - name: Un artículo con ciudad y muestra insuficiente
        expected: sin cifras, solo el enlace al catálogo
      - name: Un artículo sin ciudad
        expected: no se añade bloque de ciudad

  - id: BLOG-012
    name: Un artículo programado no declara que se modificó antes de publicarse
    status: implemented
    summary: >-
      `dateModified` —en el schema Article, en Open Graph, en el sitemap y en la
      línea «Actualizado el…» de la página— es la más tardía entre la fecha de
      modificación y la de publicación. Nunca una fecha anterior a la
      publicación.
    rationale: >-
      El calendario editorial escribe los artículos días antes de publicarlos
      (BLOG-001: manda la fecha, no una tarea), así que `updated_at` queda por
      detrás de un `published_at` futuro. Entregando ambos campos tal cual, ocho
      de los quince artículos vivos afirmaban haberse modificado antes de
      existir. Es una contradicción en la señal que más pesa en las respuestas
      generadas por IA, donde lo reciente se cita mucho más. Un artículo no se
      modifica antes de publicarse: la fecha posterior es la única respuesta
      honesta.
    evidence:
      - file: frontend/lib/blog.ts
        symbol: export function articleModifiedAt
        note: Única fuente de la fecha de modificación de un artículo.
      - file: frontend/app/blog/[slug]/page.tsx
        symbol: "dateModified: articleModifiedAt(post)"
        note: El schema, Open Graph y la fecha visible leen el mismo valor.
      - file: frontend/app/sitemap.ts
        symbol: "new Date(articleModifiedAt(post))"
        note: El `lastmod` del artículo usa la misma regla que su schema (SEO-006).
      - file: frontend/lib/blog.test.ts
        symbol: describe('articleModifiedAt'
        note: Cubre edición real, post programado, fechas iguales y fechas ausentes.
    frontend:
      routes: ["/blog/[slug]"]
    tests:
      unit: true
    cases:
      - name: Artículo editado un mes después de publicarse
        expected: dateModified es la fecha de edición
      - name: Artículo escrito el día 11 y programado para el 19
        expected: dateModified es el 19, no el 11
      - name: Artículo sin fecha de modificación
        expected: dateModified es la fecha de publicación

  - id: BLOG-013
    name: Un artículo con cifras escritas a mano se revisa cada trimestre
    status: implemented
    summary: >-
      Una tarea semanal lista los artículos publicados que llevan más de noventa
      días sin tocarse y contienen una cifra escrita en el texto. Solo informa:
      no reescribe nada.
    rationale: >-
      Los bloques que la página renderiza —el precio del m², el ranking vivo— se
      recalculan solos, pero un número tecleado dentro de un párrafo no, y nada
      en el sistema sabía qué artículos llevaban uno. Sin esa lista, la
      corrección depende de que alguien recuerde qué escribió en julio.

      Informa y no edita a propósito. Reescribir un párrafo publicado sin que lo
      lea una persona es la forma más rápida de que un artículo contradiga al
      bloque de datos que tiene justo debajo.
    evidence:
      - file: backend/blog/tasks.py
        symbol: def flag_stale_figures
      - file: backend/blog/tasks.py
        symbol: STALE_AFTER_DAYS
      - file: backend/estate_map/settings.py
        symbol: "flag-stale-blog-figures"
      - file: backend/blog/tests/test_scheduling.py
        symbol: def test_an_old_article_with_typed_figures_is_flagged
    tests:
      api: true
    cases:
      - name: Artículo de hace 200 días con "$776" en el cuerpo
        expected: aparece en la lista
      - name: Artículo de hace 200 días sin ninguna cifra
        expected: no aparece
      - name: Artículo revisado esta semana
        expected: no aparece

  - id: BLOG-014
    name: Un artículo publicitario se identifica donde se lee
    status: implemented
    summary: >-
      Un post con anunciante lleva un aviso visible antes del título que nombra
      quién lo paga y si lo paga, la tarjeta del listado lo marca como
      «Publicidad», y todos sus enlaces salientes salen con
      `rel="sponsored nofollow"`. El distintivo de la tarjeta **sustituye** a
      la categoría y nombra al anunciante, y un artículo con anunciante nunca
      ocupa el hueco de «Lectura destacada». Sin anunciante nada de eso aparece.
    rationale: >-
      La regla de Google es que la colocación pagada se declare y sus enlaces se
      marquen, pero la razón que importa aquí es más estrecha: este portal
      publica cifras de mercado, y el día que un lector no pueda distinguir lo
      que el portal midió de lo que alguien compró, las cifras dejan de valer la
      pena citarse. Por eso el aviso no es una nota al pie ni un color: es una
      línea que se lee antes del texto. «Del grupo» se dice tal cual —Aents y
      Geo Propiedades comparten dueños y no media dinero— porque disimularlo
      sería el mismo fallo en tamaño pequeño.
    evidence:
      - file: backend/blog/models.py
        symbol: "def is_sponsored"
      - file: backend/blog/models.py
        symbol: SponsorKind
        note: Reutiliza el vocabulario de las campañas en vez de inventar otro.
      - file: backend/blog/serializers.py
        symbol: def get_sponsor
        note: La etiqueta viaja con cada representación del artículo, no solo en el admin.
      - file: frontend/components/blog/SponsoredNotice.tsx
        symbol: export default function SponsoredNotice
      - file: frontend/lib/markdown.tsx
        symbol: "sponsored ? 'sponsored noopener noreferrer nofollow'"
      - file: frontend/app/blog/page.tsx
        symbol: "const editorial = posts.filter((post) => !post.sponsor)"
        note: >-
          «Lectura destacada» es el portal recomendando algo, así que la
          publicidad no puede ocuparla ni por un is_featured marcado a mano.
      - file: frontend/components/blog/PostCard.tsx
        symbol: "post.sponsor ?"
        note: El aviso también viaja en la tarjeta, antes de que se abra el artículo.
      - file: frontend/lib/markdown.test.tsx
        symbol: "describe('sponsored links'"
        note: Un caso comprueba que se marca y otro que un editorial se queda intacto.
    frontend:
      routes: ["/blog/[slug]", "/blog/categoria/[slug]"]
    tests: {}
    cases:
      - name: Artículo con anunciante
        expected: aviso visible, etiqueta en la tarjeta y rel="sponsored nofollow"
      - name: Artículo editorial
        expected: sin aviso y sin sponsored en los enlaces
