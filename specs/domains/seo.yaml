version: 1
domain: seo
title: Descubrimiento orgánico
status: implemented
summary: >-
  Reglas que deciden qué páginas públicas merecen entrar en el índice y qué
  señales de actualización se entregan a buscadores y consumidores de datos.
see_also:
  - docs/seo/editorial-y-backlinks.md
  - specs/calculations/pricing.yaml

rules:
  - id: SEO-001
    name: Las landings locales necesitan cinco anuncios para entrar al índice
    status: implemented
    summary: >-
      Las páginas por ciudad, provincia y combinación de tipo, operación y
      ubicación solo se indexan y aparecen en el sitemap desde cinco anuncios.
      Con menos inventario siguen respondiendo 200 con robots noindex, follow.
    rationale: >-
      Una sola ficha ya responde por sí misma la búsqueda. Indexar además una
      landing con uno o dos resultados multiplica contenido fino y consume
      rastreo sin aportar una comparación útil. Mantener la URL crawlable
      permite que vuelva al índice cuando recupere inventario.
    evidence:
      - file: frontend/lib/seo-combos.ts
        symbol: "export const MIN_COMBO_PROPERTIES = 5;"
      - file: frontend/lib/seo-combos.ts
        symbol: "export const MIN_LOCATION_PROPERTIES = 5;"
      - file: frontend/app/sitemap.ts
        symbol: "city.count >= MIN_LOCATION_PROPERTIES"
      - file: frontend/app/propiedades/[ciudad]/page.tsx
        symbol: "city.properties.length < MIN_LOCATION_PROPERTIES"
      - file: frontend/app/provincias/[provincia]/page.tsx
        symbol: "province.properties.length < MIN_LOCATION_PROPERTIES"
    frontend:
      routes:
        - "/[combo]"
        - "/propiedades/[ciudad]"
        - "/provincias/[provincia]"
    tests: {}
    cases:
      - name: Landing con cuatro anuncios
        given: {count: 4}
        expected: noindex y fuera del sitemap
      - name: Landing con cinco anuncios
        given: {count: 5}
        expected: indexable y presente en el sitemap

  - id: SEO-002
    name: La fecha del dataset refleja el inventario que lo compone
    status: implemented
    summary: >-
      El endpoint de estadísticas entrega como updated_at la fecha más reciente
      de las propiedades comparables y las páginas la usan como dateModified.
      Si no existe una fecha real, el campo estructurado se omite.
    rationale: >-
      Publicar la hora de cada render como fecha de modificación aparenta una
      actualización que no ocurrió y vuelve inútil la señal de frescura.
    evidence:
      - file: backend/real_estate/views.py
        symbol: "updated_at=Max('updated_at')"
      - file: frontend/app/estadisticas-inmobiliarias/page.tsx
        symbol: "datasetUpdatedAt.toISOString()"
      - file: frontend/app/estadisticas-inmobiliarias/[ciudad]/page.tsx
        symbol: "datasetUpdatedAt.toISOString()"
    backend:
      endpoint: GET /api/market-stats/
    tests: {}
    cases:
      - name: Dataset con inventario actualizado
        expected: dateModified igual a la última modificación del inventario comparable

  - id: SEO-003
    name: Solo se declaran como perfiles oficiales las cuentas que existen
    status: implemented
    summary: >-
      El `sameAs` del Organization y los iconos sociales del footer se leen de
      la misma lista, `SOCIAL_PROFILES`. Solo contiene perfiles reales de la
      marca (Facebook y TikTok); una red sin cuenta no aparece en ninguno de los
      dos sitios.
    rationale: >-
      El footer enlazaba a `facebook.com` e `instagram.com` a secas, que son
      portadas genéricas, no perfiles: sacaban al visitante del sitio y no
      consolidaban nada. Un `sameAs` apuntando a una cuenta inexistente es peor
      que su ausencia, porque contradice la identidad que declara el resto del
      grafo. Compartir la lista evita que footer y datos estructurados vuelvan a
      divergir.
    evidence:
      - file: frontend/lib/constants.ts
        symbol: "export const SOCIAL_PROFILES"
      - file: frontend/lib/constants.ts
        symbol: "export const SOCIAL_PROFILE_URLS"
      - file: frontend/app/layout.tsx
        symbol: "sameAs: SOCIAL_PROFILE_URLS,"
      - file: frontend/components/Footer.tsx
        symbol: "const SOCIAL_ICONS"
    frontend:
      routes:
        - "*"
    tests: {}
    cases:
      - name: Red sin cuenta de la marca
        given: {network: instagram}
        expected: ausente del footer y del sameAs
      - name: Red con perfil publicando
        given: {network: tiktok}
        expected: presente en el footer y en el sameAs

  - id: SEO-004
    name: La verificación en buscadores se configura por entorno
    status: implemented
    summary: >-
      Las etiquetas de verificación de Google y Bing salen de
      `NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION` y
      `NEXT_PUBLIC_BING_SITE_VERIFICATION`. Si la variable está vacía no se
      emite etiqueta.
    rationale: >-
      Google está verificado como propiedad de dominio por DNS y no necesita
      etiqueta, pero un registro TXT se pierde en cualquier migración. Dejar el
      valor en el entorno convierte una reverificación en un despliegue en vez
      de un cambio de código. Emitir la etiqueta con `content` vacío la
      invalidaría en ambos buscadores, así que la ausencia de valor significa
      ausencia de etiqueta.
    evidence:
      - file: frontend/app/layout.tsx
        symbol: "const bingSiteVerification"
      - file: frontend/app/layout.tsx
        symbol: "'msvalidate.01': bingSiteVerification"
    frontend:
      routes:
        - "*"
    tests: {}
    cases:
      - name: Variable sin definir
        given: {NEXT_PUBLIC_BING_SITE_VERIFICATION: ""}
        expected: no se emite la meta msvalidate.01
      - name: Variable con código
        given: {NEXT_PUBLIC_BING_SITE_VERIFICATION: "ABC123"}
        expected: se emite la meta msvalidate.01 con ese valor

  - id: SEO-005
    name: El host de la API no se indexa
    status: implemented
    summary: >-
      `api.geopropiedadesecuador.com` sirve un `robots.txt` que prohíbe todo el
      rastreo, y cada respuesta del backend lleva `X-Robots-Tag: noindex,
      nofollow`. La vista que ya definía su propia cabecera conserva la suya.
    rationale: >-
      El host respondía 404 a `/robots.txt`, que para un rastreador significa
      «recorre lo que quieras». Y DRF, ante el `Accept: text/html` que envía
      cualquier bot, devuelve su API navegable: una página HTML por endpoint con
      los anuncios del portal dentro. Es el mismo contenido del portal servido
      por segunda vez bajo un segundo dominio, compitiendo con las páginas
      construidas para posicionar y gastando rastreo que se le quita a las
      landings de ciudad.

      Son dos capas porque fallan distinto. `robots.txt` evita la descarga, pero
      una URL enlazada desde fuera puede acabar indexada sin llegar a rastrearse
      nunca; la cabecera es lo que la saca del índice. Ninguna de las dos es una
      medida de seguridad: la API es pública y sigue siéndolo.
    evidence:
      - file: backend/estate_map/crawlers.py
        symbol: "ROBOTS_TXT ="
      - file: backend/estate_map/crawlers.py
        symbol: "class NoIndexMiddleware"
      - file: backend/estate_map/settings.py
        symbol: "'estate_map.crawlers.NoIndexMiddleware',"
      - file: backend/estate_map/urls.py
        symbol: "path('robots.txt', robots, name='robots')"
    tests: {api: true}
    cases:
      - name: robots.txt del host de la API
        expected: allowed
        expected_http_status: 200
        note: "Devuelve `Disallow: /` en texto plano."
      - name: Respuesta pública cualquiera
        expected: allowed
        note: "Lleva `X-Robots-Tag: noindex, nofollow`."
      - name: Redirector de publicidad
        expected: allowed
        note: Conserva la cabecera que ya ponía la vista.

  - id: SEO-006
    name: El `lastmod` del sitemap sale de fechas reales o no se declara
    status: implemented
    summary: >-
      Cada URL del sitemap declara como `lastmod` la fecha real del contenido
      que representa: la modificación de la propiedad en su ficha, la más
      reciente de la zona en una landing local, la del artículo en el blog.
      Cuando no existe ninguna fecha real, el campo se omite en lugar de
      declarar la hora de renderizado.
    rationale: >-
      Es la misma razón de SEO-002 aplicada al sitemap. El listado público no
      entregaba `updated_at`, así que las 16.000 URL declaraban el instante del
      render: un sitemap que dice que todo cambió hace un segundo no prioriza
      nada, y buscadores y motores de IA descartan el campo. Omitirlo cuando no
      se sabe es preferible a rellenarlo, porque una fecha inventada además
      contradice al `dateModified` que sí es real en la propia página.
    evidence:
      - file: backend/real_estate/serializers.py
        symbol: "'updated_at',"
        note: El payload liviano del listado incluye la fecha justo para esto.
      - file: frontend/app/sitemap.ts
        symbol: "function latestDate"
        note: Devuelve null cuando no hay ninguna fecha real, en vez de la hora actual.
      - file: frontend/app/sitemap.ts
        symbol: "lastModified: property.updated_at || property.created_at || undefined"
        note: Cada ficha declara su propia fecha; sin ella, ninguna.
      - file: backend/real_estate/tests/test_sitemap_freshness.py
        symbol: test_property_listing_carries_the_modification_date
        note: Fija el contrato del que depende el sitemap.
    backend:
      endpoint: GET /api/properties/
    tests:
      api: true
    cases:
      - name: Ficha de una propiedad modificada ayer
        expected: lastmod igual a esa modificación
      - name: Visita a una ficha
        expected: la fecha de modificación no se mueve
      - name: Listado sin fechas
        expected: el sitemap omite lastmod en vez de declarar la hora actual

  - id: SEC-001
    name: La zona de un anuncio se deriva de su dirección y se guarda
    status: implemented
    summary: >-
      El primer segmento de `address` antes de la coma es la zona: un barrio
      («Cumbayá»), una urbanización («Urb. Mocolí Golf Club») o a veces una
      avenida. Se guarda en dos columnas al grabar el anuncio: una clave sin
      mayúsculas ni acentos y la grafía tal como venía. La clave queda vacía
      cuando el segmento repite el nombre de la ciudad. El nombre que se publica
      es la grafía más frecuente del grupo, salvo que exista una acentuada que
      llegue a la mitad de esa frecuencia.
    rationale: >-
      Hasta ahora la zona se recalculaba en Python en cada petición de
      estadísticas. Eso basta para una tabla de promedios y no para una página
      que lista, pagina y filtra una zona: sin columna no hay índice, y sin
      índice cada visita recorre el texto libre de todo el catálogo.

      Guardarla además obliga a decidir qué es la misma zona. Con `casefold` a
      secas —lo que hacía la tabla— «Cumbayá» y «Cumbaya» eran dos zonas con 42
      y 47 anuncios y dos promedios distintos; con la clave sin acentos son una
      de 90. Y para el nombre visible la frecuencia sola falla, porque la grafía
      sin tilde gana por comodidad de teclado, no porque sea el nombre.
    evidence:
      - file: backend/real_estate/models.py
        symbol: def sector_key
      - file: backend/real_estate/models.py
        symbol: "sector_key = models.CharField"
      - file: backend/real_estate/services/sectors.py
        symbol: def sector_display
      - file: backend/real_estate/migrations/0035_property_sector.py
        symbol: def fill_sectors
        note: Backfill por lotes con update, para no mover `updated_at` de 16.000 anuncios.
      - file: backend/real_estate/tests/test_sectors.py
        symbol: def test_accents_and_case_do_not_split_a_zone
    tests:
      api: true
    cases:
      - name: Dirección "Cumbayá, Quito"
        expected: clave "cumbaya", grafía "Cumbayá"
      - name: Dirección "CUMBAYA, Quito"
        expected: la misma clave que la anterior
      - name: Dirección "Macas, Morona Santiago" en la ciudad de Macas
        expected: sin zona
      - name: Diez anuncios escriben "Cumbaya" y uno "Cumbayá"
        expected: se publica "Cumbaya"; la variante acentuada no llega a la mitad

  - id: SEC-002
    name: Una zona necesita inventario para tener página
    status: implemented
    summary: >-
      Una zona se lista, entra al sitemap y se indexa desde cinco anuncios, el
      mismo umbral que una landing local. Por debajo, la página responde 200 con
      `noindex, follow`. El precio por m² de la zona solo se publica con tres
      anuncios o más que tengan precio y área válidos.
    rationale: >-
      Es SEO-001 aplicado un nivel más abajo. El segundo umbral es aparte porque
      responde a otra pregunta: cinco anuncios bastan para que la página sirva
      de listado, y un promedio calculado sobre dos no es una lectura de
      mercado, es una anécdota con dos decimales.
    evidence:
      - file: backend/real_estate/services/sectors.py
        symbol: MIN_SECTOR_LISTINGS
      - file: backend/real_estate/services/sectors.py
        symbol: "if sample >= 3"
      - file: frontend/app/propiedades/[ciudad]/[sector]/page.tsx
        symbol: "if (sector.count < MIN_SECTOR_LISTINGS)"
      - file: frontend/app/sitemap.ts
        symbol: "const sectorRoutes: MetadataRoute.Sitemap"
      - file: backend/real_estate/tests/test_sectors.py
        symbol: def test_a_zone_needs_inventory_to_be_listed
    backend:
      endpoint: GET /api/properties/sectors/
    frontend:
      routes: ["/propiedades/[ciudad]/[sector]"]
    tests:
      api: true
    cases:
      - name: Zona con cuatro anuncios
        expected: no se lista ni entra al sitemap
      - name: Zona con cinco anuncios
        expected: se lista, se indexa y entra al sitemap
      - name: Zona con cinco anuncios pero solo dos con precio y área
        expected: se publica el listado sin precio por m²

  - id: SEC-003
    name: La página de una zona filtra en SQL
    status: implemented
    summary: >-
      El listado público acepta `sector` y resuelve contra la columna indexada,
      no contra el texto de la dirección. La página de la zona y su cuadrícula
      destacada usan ese mismo filtro.
    rationale: >-
      Sin filtro en el servidor, una página de zona tendría que descargar el
      catálogo de la ciudad y recortarlo en el cliente: en Quito son miles de
      filas para mostrar noventa. Y la cuadrícula destacada tiene que usar el
      mismo filtro, o la página promete Cumbayá y enseña anuncios de otra parte
      de Quito.
    evidence:
      - file: backend/real_estate/views.py
        symbol: "queryset = queryset.filter(sector_key=sector_key_for(sector))"
      - file: frontend/lib/sectors.ts
        symbol: export async function getSectorProperties
      - file: frontend/lib/properties.ts
        symbol: "if (sector) params.set('sector', sector);"
        note: La cuadrícula destacada se queda dentro de la zona.
      - file: backend/real_estate/tests/test_sectors.py
        symbol: def test_the_listing_endpoint_filters_by_zone
    tests:
      api: true
    cases:
      - name: Listado con sector=CUMBAYA
        expected: solo los anuncios de esa zona, sin importar cómo se escribió

  - id: SEC-004
    name: El titular de un anuncio no es una zona
    status: implemented
    summary: >-
      `sector_key` devuelve vacío cuando el primer tramo de la dirección
      describe lo que se vende en lugar de dónde está: hace falta una palabra de
      tipo de inmueble y una de operación, ambas como palabras completas. La
      operación cuenta en tercera y en primera persona, porque medio catálogo lo
      escribe quien vende. Sin clave no hay zona, ni página, ni entrada en el
      sitemap, ni promedio.
    rationale: >-
      La dirección es texto libre y los importadores ponen ahí lo que tienen.
      «Casa en Venta» llegó a ser un barrio de Guayaquil con 19 anuncios y un
      precio por metro cuadrado publicado: una lectura de mercado para un lugar
      que no existe. La prueba exige las dos palabras a propósito, porque
      Ecuador tiene lugares llamados Villa Club, Villa Regina, La Venta y
      Ventanas, y ninguno lleva palabra de operación.
    evidence:
      - file: backend/real_estate/models.py
        symbol: def _looks_like_listing_title
      - file: backend/real_estate/models.py
        symbol: "return \"\" if _looks_like_listing_title(folded) else folded"
      - file: backend/real_estate/migrations/0037_reject_headline_sectors.py
        symbol: def clear_headline_sectors
        note: La regla corre al guardar; el catálogo es importado y necesitaba relleno.
      - file: backend/real_estate/migrations/0038_reject_first_person_headlines.py
        symbol: def clear_first_person_headlines
        note: >
          El primer pase solo reconocía la tercera persona y dejó pasar 92
          zonas como «Vendo casa independiente Lomas de Monteserrín».
      - file: backend/real_estate/tests/test_sectors.py
        symbol: def test_a_listing_headline_is_not_a_zone
    tests:
      api: true
    cases:
      - name: Dirección «Casa en Venta, Guayaquil»
        expected: sin zona
      - name: Dirección «Villa Club, Daule»
        expected: zona «villa club»
      - name: Dirección «La Venta, Quito»
        expected: zona «la venta»
      - name: Dirección «Vendo casa independiente Lomas de Monteserrín, Quito»
        expected: sin zona
      - name: Dirección «Renta Alta, Quito»
        expected: zona «renta alta»

  - id: SEC-005
    name: Una zona absorbe sus rincones
    status: implemented
    summary: >-
      Cuando la clave de una zona empieza por la de otra seguida de un espacio y
      la mayor tiene al menos el triple de anuncios, la menor desaparece del
      listado y sus anuncios cuentan en la mayor. La clave absorbida sigue
      resolviendo a la zona que la absorbió.
    rationale: >-
      «Cumbayá Sector La Viña» con siete anuncios no es una rival de Cumbayá con
      doscientos catorce: es una esquina suya publicando su propia página fina y
      su propio promedio, y partiendo la autoridad del nombre real. El factor de
      tres existe para no tragarse vecinos legítimos: «Av. República» con cinco
      anuncios no absorbe a «Av. República de El Salvador», que es otra avenida.
      La clave vieja sigue resolviendo porque su URL ya está indexada.
    evidence:
      - file: backend/real_estate/services/sectors.py
        symbol: PARENT_DOMINANCE
      - file: backend/real_estate/services/sectors.py
        symbol: def absorptions
      - file: backend/real_estate/services/sectors.py
        symbol: "if sector[\"sector_key\"] == key or key in sector[\"aliases\"]:"
      - file: backend/real_estate/views.py
        symbol: _absorbed = sector_absorptions(
        note: Las estadísticas agrupan igual que las páginas.
      - file: frontend/app/propiedades/[ciudad]/[sector]/page.tsx
        symbol: "permanentRedirect(`/propiedades/${ciudad}/${sectorSlug(sector)}`)"
        note: La URL absorbida redirige en vez de servir la misma página dos veces.
      - file: backend/real_estate/tests/test_sectors.py
        symbol: def test_a_corner_of_a_zone_counts_towards_the_zone
      - file: backend/real_estate/tests/test_sectors.py
        symbol: def test_a_neighbour_of_similar_size_is_not_absorbed
    tests:
      api: true
    cases:
      - name: Cumbayá con 15 anuncios y su rincón con 3
        expected: una sola zona con 18
      - name: Dos avenidas de nombre parecido y tamaño parecido
        expected: siguen siendo dos zonas
      - name: URL de una clave absorbida
        expected: resuelve a la zona que la absorbió

  - id: SEC-006
    name: El nombre gritado se publica en mayúscula inicial
    status: implemented
    summary: >-
      Un nombre de zona escrito entero en mayúsculas se publica en formato
      título, con las preposiciones en minúscula. Un nombre que ya mezcla
      mayúsculas y minúsculas no se toca.
    rationale: >-
      Los importadores pasan tal cual la escritura de quien publica, así que
      «PUERTO AZUL» aparecía gritando junto a «Kennedy Norte» en la misma tabla.
      Solo se corrigen los nombres enteramente en mayúsculas porque un nombre
      con mayúsculas y minúsculas se escribió a propósito.
    evidence:
      - file: backend/real_estate/services/sectors.py
        symbol: def titlecase_place
      - file: backend/real_estate/tests/test_sectors.py
        symbol: def test_a_shouted_name_is_published_in_title_case
    tests:
      api: true
    cases:
      - name: Zona «PUERTO AZUL»
        expected: se publica «Puerto Azul»
      - name: Zona «Kennedy Norte»
        expected: se publica igual
