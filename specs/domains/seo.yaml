  - id: SEC-006
    name: El nombre gritado se publica en mayúscula inicial
    status: implemented
    summary: >-
      Un nombre de zona escrito entero en mayúsculas se publica en formato
      título, con las preposiciones en minúscula. Un nombre que ya mezcla
      mayúsculas y minúsculas no se toca.
    rationale: >-
      Los importadores pasan tal cual la escritura de quien publica, así que
      «PUERTO AZUL» aparecía gritando junto a «Kennedy Norte» en la misma tabla.
      Solo se corrigen los nombres enteramente en mayúsculas porque un nombre
      con mayúsculas y minúsculas se escribió a propósito.
    evidence:
      - file: backend/real_estate/services/sectors.py
        symbol: def titlecase_place
      - file: backend/real_estate/tests/test_sectors.py
        symbol: def test_a_shouted_name_is_published_in_title_case
    tests:
      api: true
    cases:
      - name: Zona «PUERTO AZUL»
        expected: se publica «Puerto Azul»
      - name: Zona «Kennedy Norte»
        expected: se publica igual

  - id: SEC-007
    name: Una zona solo existe dentro de su ciudad
    status: implemented
    summary: >-
      Buscar una zona sin decir la ciudad devuelve nada, en vez de buscar esa
      clave en todo el país.
    rationale: >-
      `list_sectors` lee una ciudad vacía como «todas a la vez», que es lo
      correcto para el sitemap y lo contrario de lo que quiere quien pregunta
      por una zona concreta. Sin este límite, un anuncio sin ciudad —los hay
      importados— resolvía su «Punta Blanca» contra la Punta Blanca de otra
      provincia, y el panel afirmaba que el anuncio pertenece a una zona a
      seiscientos kilómetros. Un nombre de barrio no es único en Ecuador: solo
      significa algo junto a su cantón.
    evidence:
      - file: backend/real_estate/services/sectors.py
        symbol: def find_sector
      - file: backend/real_estate/tests/test_sectors.py
        symbol: def test_a_zone_without_a_city_resolves_to_nothing
    tests:
      api: true
    cases:
      - name: Clave de zona con ciudad vacía
        expected: no resuelve
      - name: La misma clave con su ciudad
        expected: resuelve a su zona
