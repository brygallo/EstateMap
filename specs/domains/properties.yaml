      entero y mantiene primero los resultados geográficamente relevantes.
    evidence:
      - file: backend/real_estate/views.py
        lines: "467-493"
        symbol: distance_score
        note: El listado ordena el catálogo filtrado por distancia aproximada y deja coordenadas ausentes al final.
      - file: frontend/hooks/usePropertyFilters.ts
        lines: "427-473"
        symbol: fetchCardsPage
        note: Las tarjetas omiten bbox, envían el centro del mapa y anexan cada página sin duplicados.
