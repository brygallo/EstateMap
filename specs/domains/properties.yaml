      importada y sus imágenes se eliminan y solo queda un registro de auditoría
      ListingRetirada.
    rationale: >-
      No se marca inactive: el inventario importado es un espejo del portal
      original, y conservar filas muertas solo gasta espacio en MinIO. Una
