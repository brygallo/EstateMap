  - id: PROP-024
    name: Las visitas solo las cuentan las personas
    status: implemented
    summary: >-
      views_count se incrementa al consultar el detalle únicamente cuando el
      request no viene de un bot, y el incremento se hace en SQL.
    rationale: >-
      El contador alimenta la señal de demanda que se muestra al dueño, así que
      tiene que ser humano. Los crawlers reciben el detalle completo, simplemente
      no mueven el contador. El UPDATE con F() evita perder incrementos
      simultáneos.
    evidence:
      - file: backend/real_estate/views.py
        lines: "604-609"
        symbol: is_bot_request
        note: Property.objects.filter(pk=...).update(views_count=F('views_count') + 1) solo si no es bot.
      - file: backend/real_estate/models.py
        lines: "243-245"
        symbol: views_count
        note: PositiveIntegerField con default 0.
      - file: backend/real_estate/serializers.py
        lines: "228-231"
        symbol: 'views_count'
        note: Está en read_only_fields, así que un cliente no puede inflarlo desde el payload.
    backend:
      endpoint: GET /api/properties/{property_id}/
      note: >-
        No se marca tests.api porque el generador solo sabe afirmar allowed/denied
        y aquí lo que importa es el valor del contador.
    cases:
      - name: Visita de una persona
        given:
          user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
          views_count: 10
        expected: 11
      - name: Visita de un crawler
        given:
          user_agent: "Googlebot/2.1 (+http://www.google.com/bot.html)"
          views_count: 10
        expected: 10
      - name: El cliente intenta fijar el contador
        role: authenticated
        given:
          views_count: 999999
        expected: 0

  - id: PROP-025
    name: Las fotos se publican en tres estados y la subida nunca cuesta el anuncio
    status: implemented
    summary: >-
      Una PropertyImage nace en pending con el original en disco local, pasa a
      ready cuando el worker publica el WebP y su miniatura, y a failed si la
      optimización no es posible.
    rationale: >-
      El request de subida no optimiza nada: escribe el original y responde. Si el
      staging falla, stage_property_image devuelve None en lugar de lanzar, porque
      corre dentro de la transacción que acaba de crear la propiedad y una
      excepción haría perder todo lo que el usuario escribió. Mientras está
      pending, la API sirve la foto desde el staging local para que no se vea rota.
    evidence:
      - file: backend/real_estate/models.py
        lines: "359-361"
        symbol: FAILED = "failed"
        note: TextChoices con pending, ready y failed; el default del campo es ready.
      - file: backend/real_estate/serializers.py
        lines: "61-95"
        symbol: stage_property_image
        note: Crea la fila en pending con pending_path y encola la optimización; ante OSError devuelve None sin lanzar.
      - file: backend/real_estate/tasks.py
        lines: "44-109"
        symbol: optimize_property_image
        note: Publica imagen y miniatura, pasa a ready y limpia el temporal; ante ValueError deja failed con optimization_error.
      - file: backend/real_estate/serializers.py
        lines: "173-191"
        symbol: _pending_url
        note: Una fila pending devuelve una URL servida desde el staging local.
    cases:
      - name: Recién subida
        given:
          subida_aceptada: true
        expected: pending
      - name: Worker terminado
        given:
          optimizacion: ok
        expected: ready
      - name: Archivo ilegible
        given:
          optimizacion: ValueError
        expected: failed
      - name: Disco lleno al guardar el original
        given:
          stash_upload: OSError
        expected: null
        note: La propiedad se guarda igual, sin esa foto.

  - id: PROP-026
    name: Límites de las imágenes de una propiedad
    status: implemented
    summary: >-
      Como máximo 10 imágenes por propiedad, cada una de hasta 10 MB y entre
      200x200 y 8000x8000 píxeles, en JPEG, PNG o WebP, y con un tope combinado de
      50 MB por subida.
    rationale: >-
      El tope de 10 cuenta las imágenes existentes y resta las que el mismo request
      va a borrar, para que reemplazar fotos en una propiedad llena no sea
      imposible.
    evidence:
      - file: backend/estate_map/settings.py
        lines: "401-403"
        symbol: MAX_PROPERTY_UPLOAD_MB
        note: MAX_IMAGES_PER_PROPERTY = 10, MAX_IMAGE_SIZE_MB = 10, MAX_PROPERTY_UPLOAD_MB = 50.
      - file: backend/estate_map/settings.py
        lines: "384-386"
        symbol: ALLOWED_IMAGE_TYPES
        note: image/jpeg, image/jpg, image/png y image/webp.
      - file: backend/real_estate/serializers.py
        lines: "253-308"
        symbol: validate_uploaded_images
        note: Aplica en orden el tope por propiedad, el tope combinado y los tres validadores por imagen.
      - file: backend/real_estate/validators.py
        lines: "8-44"
        symbol: validate_image_dimensions
        note: Tamaño máximo, dimensiones mínimas y máximas, y extensión permitida.
      - file: backend/real_estate/exception_handlers.py
        lines: "59-64"
        symbol: def api_exception_handler
        note: >-
          Cuando el cuerpo supera los topes del parser de Django, el rechazo
