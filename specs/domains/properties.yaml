        expected: rechazado

  - id: PROP-027
    name: Ubicación efectiva de una propiedad
    status: implemented
    summary: >-
      La posición de una propiedad es su par latitude/longitude cuando existe y
      cae dentro de Ecuador; si no, es el centroide de su polígono. Ninguna
      lectura debe depender solo de las columnas.
    rationale: >-
      Un anuncio dibujado en el mapa guarda su forma y no aporta punto: si nadie
      calcula el centro, latitude/longitude quedan en NULL y la propiedad
      desaparece de cualquier cálculo geográfico aunque el mapa la dibuje sin
      problema. Así estaban las 11 propiedades publicadas a mano en producción,
      porque el único sitio que rellenaba el centro era el serializer del API.
      Ahora lo garantiza Property.save(), de modo que el admin, un shell o una
      importación tampoco pueden dejar una forma sin posición, y la migración
      0027 cerró las que ya existían.
    evidence:
      - file: backend/real_estate/geo.py
        lines: "230-267"
        symbol: polygon_center_lat_lng
        note: Centroide del anillo, aceptando GeoJSON o [[lat, lng], ...] y descartando el punto de cierre repetido.
      - file: backend/real_estate/models.py
        lines: "266-289"
        symbol: save
        note: Rellena el centro al guardar cualquier propiedad con polígono y sin coordenadas, y añade los dos campos a update_fields para que se persistan.
      - file: backend/real_estate/migrations/0027_backfill_polygon_centers.py
        lines: "6-29"
        symbol: backfill_centers
        note: Backfill de las filas anteriores a la garantía; corre solo en el deploy.
      - file: frontend/lib/geo.ts
        lines: "29-61"
        symbol: getPropertyPoint
        note: Mismo criterio en el cliente, que además valida el punto contra los límites de Ecuador antes de aceptarlo.
      - file: backend/real_estate/views.py
        lines: "492-498"
        symbol: bbox
        note: El filtro por bbox aún deja pasar incondicionalmente las propiedades con lat/lng nulas y polígono; tras la migración esa rama no empareja ninguna fila y queda como red de seguridad.
    cases:
      - name: Anuncio con punto marcado
        given:
          latitude: -2.3086
          longitude: -78.1181
        expected: se usa el punto guardado
      - name: Anuncio dibujado como polígono
        given:
          latitude: null
          longitude: null
          polygon: anillo de 4 puntos en Macas
        expected: se usa el centroide del anillo
      - name: Anuncio sin punto ni polígono
        given:
          latitude: null
          longitude: null
          polygon: null
        expected: sin ubicación, queda fuera de los cálculos geográficos

  - id: PROP-028
    name: Propiedades cercanas de una ficha
    status: implemented
    summary: >-
      La sección "Publicaciones cercanas" de una ficha lista las propiedades
      ordenadas por distancia real en línea recta desde la ubicación efectiva
      (PROP-027) de la propiedad mostrada, excluyéndola a ella misma.
    rationale: >-
      Es el enlazado interno de la ficha y lo que un comprador espera ver: el
      terreno de al lado primero. Cuando la distancia se calculaba desde las
      columnas latitude/longitude, todos los anuncios dibujados daban NaN, el
      orden por distancia se volvía inofensivo y la ficha terminaba mostrando las
      cuatro publicaciones más recientes de la ventana. En la ficha 13 eso
      escondía la propiedad 12, a 23 metros, y mostraba en su lugar cuatro entre
      2,6 y 4,9 km.
    evidence:
      - file: frontend/lib/properties.ts
        lines: "267-301"
        symbol: getNearbyProperties
        note: Punto de referencia vía getPropertyPoint, candidatos sin ubicación descartados, orden ascendente por distanceKm y recorte a limit.
      - file: frontend/app/property/[id]/page.tsx
        lines: "280-282"
        symbol: getNearbyProperties
        note: La ficha pide 4 y solo pinta la sección si hay al menos una.
    cases:
      - name: Vecino inmediato dibujado como polígono
        given:
          ficha: propiedad 13
          candidato: propiedad 12 a 23 m, sin lat/lng, con polígono
        expected: aparece primero
      - name: Propiedad sin ubicación efectiva
        given:
          ficha: sin lat/lng y sin polígono
        expected: sección vacía

  - id: PROP-029
    name: La ventana de búsqueda de cercanas prioriza al vecino real
    status: implemented
    summary: >-
      La ficha envía su centro como origen y el backend ordena por proximidad
      antes de aplicar page_size. Así el vecino inmediato no queda fuera de la
      ventana por ser más antiguo que otros anuncios de la zona.
    rationale: >-
      Ordenar en el cliente solo puede reorganizar lo que la API entregó. El
      orden geográfico debe aplicarse antes de paginar para que una zona con más
      de 60 anuncios no descarte arbitrariamente el terreno de al lado.
    evidence:
      - file: backend/real_estate/views.py
        lines: "467-493"
        symbol: distance_score
        note: La expresión de distancia se aplica al queryset antes de que DRF lo pagine.
      - file: frontend/lib/properties.ts
        lines: "286-294"
        symbol: origin_lat
        note: La ficha envía el centro efectivo de la propiedad junto con su ventana bbox.
    tests:
      unit: true
    cases:
      - name: Ciudad con más de 60 anuncios en la ventana
        given:
          anuncios_en_ventana: 200
          vecino_a: 30 m
          antiguedad_vecino: fuera de los 60 más recientes
        expected: el vecino aparece primero

  - id: PROP-031
    name: Las tarjetas continúan por cercanía más allá del mapa visible
    status: implemented
    summary: >-
      El listado lateral es un feed paginado del catálogo filtrado completo,
      ordenado desde el centro del mapa hacia afuera. Al llegar al final de las
      propiedades visibles sigue cargando las siguientes más cercanas, aunque
      estén fuera del viewport; el mapa conserva su consulta espacial propia.
    rationale: >-
      En ciudades con poca oferta, como Macas, limitar las tarjetas al bbox
      detenía el scroll aunque existieran anuncios en otras zonas. Separar el
