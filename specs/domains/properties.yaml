  - id: PROP-033
    name: Un anuncio cerrado dice por qué salió del catálogo
    status: implemented
    summary: >-
      `closed_reason` (sold / rented / withdrawn) y `closed_at` registran por
      qué y cuándo dejó de ofrecerse un anuncio. Marcar el motivo lo pone
      `inactive` solo; reactivarlo borra el motivo.
    rationale: >-
      Hasta ahora «vendido», «alquilado» y «retirado» compartían el estado
      `inactive`, así que el sistema no podía responder cuántas propiedades se
      vendieron — que es justo el dato con el que se demuestra que el portal
      funciona — ni ofrecer la lámina de felicitación de SOC-102.

      Se resuelve con una columna aparte y NO añadiendo `sold` y `rented` a
      STATUS_CHOICES. `status` dice qué operación ofrece el anuncio, y toda
      lectura pública del proyecto está construida sobre
      `exclude(status='inactive')`: el mapa, las landings SEO, las estadísticas
      de mercado, el sitemap y la ingesta. Un cuarto estado dejaría un anuncio
      vendido en el mapa hasta encontrar y cambiar cada uno de esos filtros, y
      la migración 0005_alter_property_status ya retiró esos dos valores una vez
      a propósito. Un cierre es además otro hecho: dice por qué se fue, no qué
      ofrecía.

      La normalización vive en `save()` porque todos los caminos de escritura
      pasan por ahí. Reabrir significa borrar `closed_reason`, no cambiar
      `status`: mientras el motivo siga puesto, el siguiente guardado devolvería
      la fila a `inactive`.
    evidence:
      - file: backend/real_estate/models.py
        lines: "104-125"
        symbol: CLOSED_REASON_CHOICES
        note: Por qué no son dos valores más de STATUS_CHOICES.
      - file: backend/real_estate/models.py
        lines: "173-181"
        symbol: closed_reason = models
      - file: backend/real_estate/models.py
        lines: "294-307"
        symbol: "if self.closed_reason:"
        note: Cerrar pone inactive y sella la fecha; abrir la borra.
      - file: backend/real_estate/serializers.py
        lines: "38-50"
        symbol: def reopen_on_reactivation
        note: >-
          Volver a poner el anuncio en venta lo reabre; si no, el cambio parece
          aceptado y se deshace solo.
      - file: backend/real_estate/views.py
        lines: "2663-2665"
        symbol: "changes['closed_reason'] = ''"
        note: >-
          El cambio de estado en lote escribe con .update(), que nunca llega a
          save(), así que reabre a mano.
    backend:
      enforce: true
      endpoint: PATCH /api/properties/{property_id}/
    tests:
      api: true
    cases:
      - name: Marcar un anuncio como vendido
        given: {closed_reason: sold}
        expected: "status pasa a inactive y closed_at queda sellado"
      - name: Un anuncio inactivo no es lo mismo que uno vendido
        given: {status: inactive}
        expected: "closed_reason vacío; retirar no es una venta"
      - name: Un anuncio vendido sale del catálogo público
        given: {closed_reason: sold}
        expected: oculta
      - name: Reactivar un anuncio borra el motivo de cierre
        given: {status: for_sale}
        expected: "closed_reason vacío y closed_at nulo"
      - name: Los estados siguen siendo tres
        expected: [for_sale, for_rent, inactive]
        note: WFP-012 sigue vigente; el cierre no añade estados.

  - id: PROP-034
    name: Un anuncio cerrado conserva su ficha y su código corto
    status: implemented
    summary: >-
      Un anuncio con `closed_reason` sigue resolviéndose por su id y por su
      código corto, aunque ya no aparezca en el listado ni en el mapa. Uno
      simplemente `inactive` responde 404 como siempre.
    rationale: >-
      La lámina de «vendido» existe para que se reenvíe, y lleva impresos el
      código corto y el QR de ese anuncio. Si la ficha respondiera 404, el
      portal estaría repartiendo imágenes que apuntan a un anuncio que él mismo
      niega — justo lo contrario de la promesa comprobable de SOC-002.

      Lo que abre la ficha es que haya cierre, no de qué tipo sea. Un anuncio
      retirado no tiene lámina que reenviar, así que el argumento de SOC-002 no
      le aplica; se le conserva la ficha por la otra mitad del mismo motivo, que
      quien abre un enlace viejo se lleva «ya no está disponible» en vez de un
      404 seco, y el crawler que lo lee también. Perseguir esa distinción
      obligaría a preguntar por el tipo de cierre en cada consulta para ahorrar
      exactamente nada.

      Un anuncio simplemente `inactive`, sin cierre registrado, sí desaparece
      igual que antes: es un anuncio apagado, no uno que terminó. La diferencia
      no es de estado sino de intención, y por eso la decide `closed_reason` y
      no `status`.

      El dueño, además, alcanza siempre su propio anuncio esté como esté.
      Hasta ahora no podía: `get_queryset` excluía `inactive` para todo el que
      no fuera staff, así que quien desactivaba un anuncio se quedaba sin poder
      abrirlo, editarlo ni reactivarlo por la API.

      Ese privilegio es de la ficha por id y solo de ella. La ruta por código
      corto no mira quién pregunta a propósito: su respuesta se cachea con
      `s-maxage` para que la sirva el borde cuando llega desde un QR impreso, y
      una respuesta que dependiera de la sesión ensuciaría esa caché compartida.
      Por eso el dueño de un anuncio simplemente inactivo recibe 404 por el
      código y 200 por la ficha, y por eso cada caso de abajo dice contra qué
      ruta se comprueba.
    evidence:
      - file: backend/real_estate/views.py
        lines: "406-425"
        symbol: "visible |= Q(is_duplicate=False) & ~Q(closed_reason='')"
        note: >-
          Las acciones de detalle resuelven la fila por id, no por el catálogo
          público; el dueño entra siempre.
      - file: backend/real_estate/views.py
        lines: "812-821"
        symbol: "exclude(status='inactive', closed_reason='')"
        note: El código corto de un anuncio vendido sigue resolviendo.
    backend:
      enforce: true
      endpoint: GET /api/properties/code/{code}/
    tests:
      api: true
    cases:
      - name: La ficha de un anuncio vendido responde a un anónimo
        role: anonymous
        endpoint: GET /api/properties/{property_id}/
        given: {closed_reason: sold}
        expected: allowed
        expected_http_status: 200
      - name: El código corto de un anuncio vendido resuelve
        role: anonymous
        given: {closed_reason: sold}
        expected: allowed
        expected_http_status: 200
      - name: El código corto de un anuncio retirado también resuelve
        role: anonymous
        given: {closed_reason: withdrawn}
        expected: allowed
        expected_http_status: 200
        note: >-
          Lo que abre la ficha es que haya cierre, no de qué tipo sea. Un
          retirado no tiene lámina que reenviar, así que no le aplica el
          argumento de SOC-002; resuelve por la otra mitad del mismo motivo,
          que quien abre un enlace viejo se lleva «ya no está disponible» en
          vez de un 404 seco, y el crawler que lo lee también.
      - name: Un anuncio solo inactivo no resuelve
        role: anonymous
        given: {status: inactive}
        expected: denied
        http_status: 404
        note: >-
          Sin cierre registrado no hay nada que contar: es un anuncio apagado,
          no uno que terminó.
      - name: El dueño alcanza su anuncio inactivo
        role: owner
        endpoint: GET /api/properties/{property_id}/
        given: {status: inactive}
        expected: allowed
        expected_http_status: 200
      - name: El dueño tampoco alcanza su anuncio inactivo por el código corto
        role: owner
        given: {status: inactive}
        expected: denied
        http_status: 404
        note: >-
          La ruta por código es pública y cacheada; no distingue quién pregunta.
          El dueño llega a su anuncio por la ficha, que es la que sí lo hace.

  - id: PROP-035
    name: La ficha publica el precio anterior y cuándo cambió
    status: implemented
    summary: >-
      El detalle de una propiedad incluye `previous_price` y `price_changed_at`,
      leídos del historial que ya escribe una señal al cambiar el precio.
    rationale: >-
      La lámina de «bajó el precio» de SOC-102 necesita los dos importes, y el
      historial ya existía (`PropertyPriceHistory`, escrito por la señal
      post_save cuando el precio se mueve de verdad). Lo único que faltaba era
      publicar el último salto.

      No es una fuga nueva: ambos importes fueron precios públicos mientras
      estuvieron vigentes, y el endpoint `intelligence`, que es AllowAny, ya
      sirve el historial completo. VIS-001 va de contadores de visitas, no de
      precios.

      Cuando la fila más reciente del historial no coincide con el precio actual
      —alguien escribió la columna sin pasar por save()— no se devuelve nada:
      hornear un «antes» dudoso en una imagen que sobrevive a la corrección es
      peor que no ofrecer la lámina.
    evidence:
      - file: backend/real_estate/serializers.py
        lines: "244-273"
        symbol: def _price_change
      - file: backend/real_estate/signals.py
        lines: "48-54"
        symbol: PropertyPriceHistory.objects.create
        note: Solo escribe cuando el precio cambia; filas consecutivas = precios consecutivos.
    backend:
      endpoint: GET /api/properties/{property_id}/
    tests:
      api: true
    cases:
      - name: Bajar el precio publica el anterior
        given: {price_anterior: 90000, price: 79000}
        expected: presente
      - name: Un anuncio cuyo precio nunca se movió no tiene precio anterior
        expected: ausente
      - name: El precio anterior viaja como texto, igual que el precio
        expected: "\"90000.00\""

  - id: PROP-036
    name: Un precio o una superficie negativos no se guardan
    status: implemented
    summary: >-
      `price`, `rent_price`, `area` y `built_area` rechazan valores negativos, y
      las dos superficies rechazan además cualquier cifra por encima de
      100 000 000 m² (10 000 ha). Un anuncio sigue pudiendo no tener precio ni
      área: la ausencia se escribe `NULL`, no con un número imposible.
    rationale: >-
      Hasta el 2026-08-11 el serializer aceptaba `price = -150000` y lo guardaba
      tal cual. La ficha pública no lo mostraba —`formatPrice` devuelve «Precio a
      consultar» para todo valor menor o igual a cero—, así que quien se
      equivocaba al teclear veía un texto que no había escrito, sin ninguna
      explicación, y publicaba igual. El valor sobrevivía donde nadie lo mira:
      en el precio medio por m² de la ciudad y en las páginas de estadísticas.

      El techo de las superficies existe por lo mismo. El área se escribe a mano
      —el polígono dibujado la calcula, pero es corregible—, así que una tecla
      de más produce 100 000 km². El límite está muy por encima de cualquier
      predio real y muy por debajo de lo que produce un resbalón.

      Los validadores no reescriben nada: las filas ya guardadas fuera de rango
      se quedan como están, y la regla empieza a aplicar en la siguiente
      escritura, que es de donde salen los errores de tecleo. La ingesta llama a
      `Property.objects.create` directamente y no los ejecuta.
    evidence:
      - file: backend/real_estate/models.py
        symbol: MAX_LISTING_AREA_M2
        note: 100_000_000.0 metros cuadrados, el techo de las dos superficies.
      - file: backend/real_estate/models.py
        symbol: "validators=[MinValueValidator(0)]"
        note: price y rent_price no admiten negativos.
      - file: backend/real_estate/migrations/0032_property_numeric_bounds.py
        symbol: "class Migration"
        note: Solo AlterField; no toca datos.
      - file: frontend/app/add-property/page.tsx
        symbol: "'El precio debe ser mayor que cero'"
        note: El formulario lo dice antes de enviar, en el paso donde se escribe.
    backend:
      endpoint: POST /api/properties/
      denied_http_status: 400
    tests:
      api: true
    cases:
      - name: Publicar con precio negativo
        role: authenticated
        body:
          title: Precio imposible
          price: "-150000"
        expected: denied
        http_status: 400
      - name: Publicar con área negativa
        role: authenticated
        body:
          title: Área imposible
          price: "1000"
          area: -999
        expected: denied
        http_status: 400
      - name: Publicar sin precio
        given: {price: null}
        expected: "permitido: la ausencia de precio se escribe NULL"
      - name: Un anuncio importado ya guardado fuera de rango
        given: {origen: ingesta}
        expected: "se conserva: los validadores solo corren en la siguiente escritura validada"

  - id: PROP-037
    name: La descripción tiene un tope de caracteres
    status: implemented
    summary: >-
      La descripción de un anuncio no puede pasar de MAX_DESCRIPTION_LENGTH
      (8.000 caracteres). El formulario lo impide al escribir y el serializador
      lo rechaza con un 400 que dice cuántos caracteres tiene.
    rationale: >-
      La columna es un TextField y nada por encima ponía techo, así que el único
      límite era el guardia de cuerpo de Django: 60 MB de datos que se rechazan
      mientras se parsea la petición, es decir mucho después de que la persona
      terminara de escribir y sin poder señalar el campo.

      El número sale de los datos, no de una intuición: la descripción más larga
      del catálogo tiene unos 6.400 caracteres y es de un anuncio importado, y
      la más larga escrita por una persona no llega a 900. Un tope por debajo de
      lo que ya existe convertiría un guardia contra el abuso en una trampa,
      porque haría ineditables los anuncios largos que ya están publicados.

      La ingesta escribe con `Property.objects.create` y no pasa por el
      serializador, así que importar un anuncio largo sigue siendo posible.
    evidence:
      - file: backend/estate_map/settings.py
        symbol: MAX_DESCRIPTION_LENGTH
        note: 8000 caracteres, por encima de la descripción más larga que existe.
      - file: backend/real_estate/serializers.py
        symbol: def validate_description
        note: Rechaza con 400 e incluye la longitud real en el mensaje.
      - file: frontend/app/add-property/page.tsx
        symbol: MAX_DESCRIPTION_LENGTH
        note: >-
          El mismo número en el esquema de validación y como `maxLength` del
          textarea, más un contador que aparece al acercarse al tope para que
          dejar de poder escribir no se lea como un campo roto.
    backend:
      endpoint: POST /api/properties/
      denied_http_status: 400
    tests:
      api: true
    cases:
      - name: Publicar con una descripción dentro del tope
        given: {caracteres: 900}
        expected: "permitido"
      - name: Publicar con una descripción por encima del tope
        role: authenticated
        body:
          title: Descripción interminable
          price: "1000"
          description: "{description_over_limit}"
        expected: denied
        http_status: 400
      - name: Editar un anuncio importado con descripción larga ya guardada
        given: {caracteres: 6401}
        expected: "permitido: el tope se eligió por encima de lo que ya existe"

  - id: PROP-038
    name: La ficha completa prioriza contenido y acciones móviles
    status: implemented
    summary: >-
      En celular, la ficha completa presenta galería, identidad, precio,
