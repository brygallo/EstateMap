version: 1
domain: properties
title: Propiedades
status: implemented
summary: >-
  Reglas de negocio del inventario: qué es una propiedad publicable, cómo se
  interpretan sus precios, qué valida el polígono del terreno, qué distingue un
  anuncio propio de uno importado de otro portal, y qué se registra cada vez que
  cambia. Verificado contra el código el 2026-08-04.
see_also:
  - docs/business-rules/properties.md

rules:
  # ---------------------------------------------------------------------------
  # Precios y operación
  # ---------------------------------------------------------------------------
  - id: PROP-001
    name: Semántica de price y rent_price
    status: implemented
    summary: >-
      price es siempre el precio principal de la operación del anuncio, y
      rent_price solo se usa cuando un mismo anuncio es venta y alquiler a la vez.
    rationale: >-
      El modelo tiene un único status, así que no existe un estado "venta y
      alquiler". Un anuncio mixto se representa con status='for_sale' (la
      operación prioritaria) más rent_price poblado; un anuncio solo de alquiler
      guarda su precio en price y deja rent_price en NULL.
    evidence:
      - file: backend/real_estate/models.py
        lines: "158-162"
        symbol: rent_price
        note: La semántica está escrita como comentario junto a la definición de ambos campos.
      - file: backend/ingesta/pipeline/upsert.py
        lines: "48-50"
        symbol: prop.rent_price
        note: La ingesta escribe ambos campos por separado desde el dict canónico del scraper.
      - file: frontend/app/property/[id]/page.tsx
        lines: "439-441"
        symbol: hasRentPrice
        note: La ficha pública muestra el precio principal y, solo si hay rent_price > 0, la línea "Alquiler .../mes".
    cases:
      - name: Anuncio solo de venta
        given:
          status: for_sale
          price: 120000
          rent_price: null
        expected: price es el precio de venta
      - name: Anuncio solo de alquiler
        given:
          status: for_rent
          price: 400
          rent_price: null
        expected: price es el precio de alquiler mensual
      - name: Anuncio de venta y alquiler a la vez
        given:
          status: for_sale
          price: 120000
          rent_price: 800
        expected: price es la venta y rent_price el alquiler mensual
        note: status refleja la operación prioritaria, que es la venta.

  - id: PROP-002
    name: status inactive saca la propiedad del catálogo público
    status: implemented
    summary: >-
      Una propiedad con status='inactive' desaparece del listado, del mapa y de
      todos los agregados públicos, sin borrarse de la base de datos.
    rationale: >-
      Es el único mecanismo de baja lógica del modelo: no hay campo deleted_at ni
      is_active. Toda lectura pública parte del mismo queryset, que además excluye
      los duplicados marcados.
    evidence:
      - file: backend/real_estate/views.py
        lines: "414-416"
        symbol: exclude(status='inactive')
        note: Base de get_queryset en PropertyViewSet; de aquí derivan list, map_points y summary.
      - file: backend/real_estate/models.py
        lines: "85-87"
        symbol: STATUS_CHOICES
        note: Los tres estados posibles son for_sale, for_rent e inactive.
    backend:
      enforce: true
      endpoint: GET /api/properties/
    cases:
      - name: Una propiedad activa aparece en el listado público
        given:
          status: for_sale
        expected: visible
      - name: Una propiedad inactiva no aparece en el listado público
        given:
          status: inactive
        expected: oculta
      - name: Un duplicado marcado tampoco aparece
        given:
          status: for_sale
          is_duplicate: true
        expected: oculta

  - id: PROP-003
    name: Solo el dueño autenticado ve sus propiedades inactivas
    status: implemented
    summary: >-
      /api/properties/my_properties/ exige autenticación y devuelve las
      propiedades del usuario, incluidas las inactivas. Un usuario con is_staff
      recibe en su lugar el catálogo completo.
    rationale: >-
      Es la única lectura que no aplica el filtro de status, porque el dueño
      necesita gestionar lo que el público no ve, y quien administra necesita
      ver también lo que no es suyo.
    evidence:
      - file: backend/real_estate/views.py
        lines: "1033-1035"
        symbol: my_properties
        note: >-
          La acción declara permission_classes=[IsAuthenticated] y elige entre
          Property.objects.all() y filter(owner=request.user) sin tocar status.
    backend:
      enforce: true
      endpoint: GET /api/properties/my_properties/
    tests:
      api: true
    cases:
      - name: Un visitante anónimo no puede consultar la bandeja
        role: anonymous
        expected: denied
        http_status: 401
      - name: Un usuario autenticado consulta sus propias propiedades
        role: authenticated
        expected: allowed
        expected_http_status: 200

  - id: PROP-030
    name: El inventario llega paginado y con contadores del total
    status: implemented
    summary: >-
      my_properties responde con el sobre paginado de DRF (count, next,
      previous, results) de 24 en 24, más dos claves propias: `stats` con los
      contadores calculados sobre el inventario filtrado entero y `scope`, que
      vale "catalog" para staff y "own" para el resto. Acepta `search`,
      `status`, `origin`, `ordering`, `page` y `page_size` (máximo 100).
    rationale: >-
      El panel dejó de ser una lista de decenas de filas el día que un
      administrador pasó a ver el catálogo entero desde ahí. Con la lista
      paginada, filtrar y contar en el cliente responde a otra pregunta: los
      totales describirían la página cargada y la búsqueda solo encontraría lo
      que ya se había descargado. Por eso ambos se resuelven en el servidor.
    evidence:
      - file: backend/real_estate/views.py
        lines: "257-266"
        symbol: class InventoryPagination
        note: page_size 24, page_size_query_param 'page_size', máximo 100.
      - file: backend/real_estate/views.py
        lines: "1033-1035"
        symbol: def my_properties
        note: stats se calcula con queryset.aggregate antes de paginar.
      - file: frontend/app/my-properties/page.tsx
        lines: "194-219"
        symbol: const fetchInventory
        note: El cliente manda search, status y ordering y acumula páginas.
    backend:
      enforce: true
      endpoint: GET /api/properties/my_properties/
    cases:
      - name: Los contadores no describen la página sino el total
        given:
          properties: 50
          page_size: 24
        expected: "stats.total = 50 aunque results traiga 24"
      - name: Un administrador reconoce su alcance
        given:
          is_staff: true
        expected: "scope = 'catalog'"
      - name: Un propietario normal recibe su propio alcance
        given:
          is_staff: false
        expected: "scope = 'own'"

  - id: PROP-004
    name: Precio y área son opcionales
    status: implemented
    summary: >-
      Una propiedad puede publicarse sin price y sin area, porque los anuncios
      importados llegan a menudo como "precio a consultar" o sin metraje.
    rationale: >-
      La política del agregador es no descartar anuncios por falta de precio o
      área. El coste es que todo cálculo de precio por m² debe filtrar por
      price > 0 y area > 0 antes de dividir.
    evidence:
      - file: backend/real_estate/models.py
        lines: "164-166"
        symbol: price = models.DecimalField
        note: null=True con help_text que justifica el "a consultar" de los importados.
      - file: backend/real_estate/models.py
        lines: "138-140"
        symbol: area = models.FloatField
        note: null=True, "opcional en anuncios importados".
      - file: backend/ingesta/pipeline/normalize.py
        lines: "50-88"
        symbol: parse_price
        note: Devuelve None en lugar de fallar cuando el texto no contiene un número usable.
    cases:
      - name: Anuncio importado sin precio
        given:
          price: null
        expected: se publica igual
      - name: Terreno sin metraje declarado
        given:
          area: null
        expected: se publica igual
      - name: Los comparables de precio por m² excluyen los incompletos
        given:
          price: null
          area: 500
        expected: excluida del cálculo de precio por m²

  - id: PROP-005
    name: El API público no exige ningún campo para publicar
    status: implemented
    summary: >-
      PropertySerializer no declara ningún campo obligatorio, así que un POST
      autenticado con cuerpo vacío crea una propiedad válida con los valores por
      defecto del modelo.
    rationale: >-
      Todos los campos del modelo son blank=True, null=True o tienen default, y el
      serializer usa fields='__all__' sin validaciones de obligatoriedad, de modo
      que DRF los marca todos required=False. Es un hecho del sistema, no una
      decisión documentada en el código.
    evidence:
      - file: backend/real_estate/serializers.py
        lines: "224-232"
        symbol: fields = '__all__'
        note: >-
          Verificado por introspección del serializer en el contenedor: la lista de
          campos con required=True está vacía.
      - file: backend/real_estate/models.py
        lines: "111-117"
        symbol: property_type = models.CharField
        note: Defaults que rellenan el hueco - property_type='land', status='for_sale', city='Macas', province='Morona Santiago'.
    backend:
      endpoint: POST /api/properties/
      note: >-
        No se marca tests.api porque el POST está limitado por el throttle
        property_write (30/hour) y un test recurrente acabaría midiendo el
        throttle en lugar de la regla.
    cases:
      - name: POST autenticado con cuerpo vacío
        role: authenticated
        given: {}
        expected:
          created: true
          property_type: land
          status: for_sale
          city: Macas
          province: Morona Santiago
      - name: No existe validación cruzada de precios
        given:
          status: for_sale
          price: null
        expected: aceptado
        note: Nada exige price cuando la operación es venta.

  # ---------------------------------------------------------------------------
  # Polígono del terreno (backend/real_estate/geo.py)
  # ---------------------------------------------------------------------------
  - id: PROP-006
    name: El polígono GeoJSON debe ser de tipo Polygon
    status: implemented
    summary: >-
      Un polígono enviado como objeto GeoJSON se rechaza si su type no es
      exactamente "Polygon".
    evidence:
      - file: backend/real_estate/geo.py
        lines: "126-137"
        symbol: _extract_ring_latlng
        note: Comprueba type == "Polygon" y que coordinates sea una lista no vacía con un anillo exterior válido.
    cases:
      - name: GeoJSON Polygon
        given:
          type: Polygon
        expected: aceptado
      - name: GeoJSON MultiPolygon
        given:
          type: MultiPolygon
        expected: PolygonValidationError
      - name: GeoJSON sin coordinates
        given:
          type: Polygon
          coordinates: []
        expected: PolygonValidationError

  - id: PROP-007
    name: Cada coordenada del polígono es un par de números
    status: implemented
    summary: >-
      Cada vértice debe ser una lista de exactamente dos elementos numéricos; los
      strings y los booleanos se rechazan.
    rationale: >-
      _is_number excluye bool explícitamente, porque en Python True es un int y
      colarse como latitud produciría un punto en el ecuador sin que nadie se
      entere.
    evidence:
      - file: backend/real_estate/geo.py
        lines: "148-171"
        symbol: _is_number
        note: Se aplica tanto al formato GeoJSON [lng, lat] como al anillo simple [lat, lng].
    cases:
      - name: Par de floats
        given:
          point: [-0.2, -78.5]
        expected: aceptado
      - name: Coordenada de tres elementos
        given:
          point: [-0.2, -78.5, 100]
        expected: PolygonValidationError
      - name: Coordenada con un número en texto
        given:
          point: [-0.2, "-78.5"]
        expected: PolygonValidationError
      - name: Coordenada booleana
        given:
          point: [true, -78.5]
        expected: PolygonValidationError

  - id: PROP-008
    name: El polígono necesita al menos tres vértices distintos
    status: implemented
    summary: >-
      Se exigen tres coordenadas genuinamente distintas, no tres entradas en el
      array: el punto de cierre y los duplicados consecutivos se descartan antes
      de contar.
    evidence:
      - file: backend/real_estate/geo.py
        lines: "176-186"
        symbol: validate_and_normalize_polygon
        note: Quita el punto de cierre, colapsa duplicados consecutivos y compara el tamaño del conjunto contra 3.
    cases:
      - name: Triángulo
        given:
          ring: [[-0.20, -78.50], [-0.20, -78.49], [-0.21, -78.49]]
        expected: aceptado
      - name: Solo dos vértices
        given:
          ring: [[-0.20, -78.50], [-0.20, -78.49]]
        expected: PolygonValidationError
      - name: Tres entradas pero una repetida
        given:
          ring: [[-0.20, -78.50], [-0.20, -78.50], [-0.20, -78.49]]
        expected: PolygonValidationError

  - id: PROP-009
    name: Todo vértice debe caer dentro de Ecuador
    status: implemented
    summary: >-
      Cada coordenada debe estar dentro del bounding box del Ecuador continental
      (lat -5.45 a 1.9, lng -81.35 a -74.75) o del de Galápagos (lat -1.75 a 1.85,
      lng -92.2 a -88.45).
    rationale: >-
      Los dos rangos se comprueban por separado a propósito: un único bounding box
      que los englobara convertiría el océano entre el continente y las islas en
      "Ecuador válido" y ensuciaría los agrupadores del mapa.
    evidence:
      - file: backend/real_estate/geo.py
        lines: "15-23"
        symbol: GALAPAGOS_LNG_MAX
        note: Las ocho constantes de los dos bounding box.
      - file: backend/real_estate/geo.py
        lines: "199-204"
        symbol: coord_in_ecuador
        note: Se aplica a cada vértice distinto del anillo antes de validar el área.
    cases:
      - name: Quito, continente
        given:
          lat: -0.20
          lng: -78.50
        expected: true
      - name: Santa Cruz, Galápagos
        given:
          lat: -0.75
          lng: -90.30
        expected: true
      - name: Océano Pacífico entre el continente y Galápagos
        given:
          lat: -0.50
          lng: -85.00
        expected: false
      - name: Lima, Perú
        given:
          lat: -12.05
          lng: -77.04
        expected: false

  - id: PROP-010
    name: Los lados del polígono no pueden cruzarse
    status: implemented
    summary: >-
      Un anillo cuyos lados no adyacentes se intersecan se rechaza con el mensaje
      "Los lados del polígono no pueden cruzarse entre sí".
    evidence:
      - file: backend/real_estate/geo.py
        lines: "110-123"
        symbol: polygon_self_intersects
        note: Compara cada par de lados no adyacentes, saltando el par formado por el primero y el último.
      - file: backend/real_estate/geo.py
        lines: "206-209"
        symbol: polygon_self_intersects
        note: Se invoca sobre los vértices distintos, antes del cálculo de área.
    cases:
      - name: Cuadrilátero en forma de lazo
        given:
          ring: [[-0.20, -78.50], [-0.21, -78.49], [-0.20, -78.49], [-0.21, -78.50]]
        expected: PolygonValidationError
      - name: Triángulo simple
        given:
          ring: [[-0.20, -78.50], [-0.20, -78.49], [-0.21, -78.49]]
        expected: aceptado

  - id: PROP-011
    name: El área del polígono debe estar entre 10 m² y 500 ha
    status: implemented
    summary: >-
      Un polígono de menos de 10 m² o de más de 5.000.000 m² se rechaza por
      considerarse un error de dibujo o algo que no es un solo inmueble.
    rationale: >-
      El área se aproxima con la fórmula del área de Gauss sobre una proyección
      equirectangular centrada en la latitud media del anillo: suficiente a escala
      de una propiedad y sin necesidad de PostGIS.
    evidence:
      - file: backend/real_estate/geo.py
        lines: "28-29"
        symbol: MIN_POLYGON_AREA_M2
        note: MIN_POLYGON_AREA_M2 = 10.0 y MAX_POLYGON_AREA_M2 = 5_000_000.0.
      - file: backend/real_estate/geo.py
        lines: "56-80"
        symbol: polygon_area_m2
        note: Proyección local en metros más fórmula del área de Gauss.
      - file: backend/real_estate/geo.py
        lines: "211-222"
        symbol: MAX_POLYGON_AREA_M2
        note: Las dos comprobaciones con sus mensajes en español.
    cases:
      - name: Lote de 500 m²
        given:
          area_m2: 500.0
        expected: aceptado
      - name: Polígono por debajo del mínimo
        given:
          area_m2: 9.9
          min_area_m2: 10.0
        expected: PolygonValidationError
      - name: Polígono por encima del máximo
        given:
          area_m2: 5000001.0
          max_area_m2: 5000000.0
        expected: PolygonValidationError

  - id: PROP-012
    name: El polígono se almacena como GeoJSON canónico y cerrado
    status: implemented
    summary: >-
      Sea cual sea el formato de entrada, el polígono se guarda como un GeoJSON
      Polygon con orden [lng, lat] y con el primer punto repetido al final.
    rationale: >-
      El formulario manda a veces un anillo [[lat, lng], ...] y a veces un objeto
      GeoJSON, y con FormData ambos llegan como texto JSON. Normalizar en el punto
      de entrada evita que el resto del sistema tenga que adivinar el formato.
    evidence:
      - file: backend/real_estate/geo.py
        lines: "224-227"
        symbol: geojson_coords
        note: Cierra el anillo y voltea cada par a [lng, lat].
      - file: backend/real_estate/serializers.py
        lines: "336-356"
        symbol: validate_polygon
        note: Acepta objeto GeoJSON, anillo simple o cualquiera de los dos codificado como texto JSON.
      - file: backend/real_estate/serializers.py
        lines: "274-281"
        symbol: to_representation
        note: A la salida se reconvierte a [[lat, lng], ...] para el frontend.
    cases:
      - name: Anillo abierto en formato [lat, lng]
        given:
          ring: [[-0.20, -78.50], [-0.20, -78.49], [-0.21, -78.49]]
        expected:
          type: Polygon
          first_coordinate: [-78.50, -0.20]
          closed: true
      - name: Texto JSON procedente de FormData
        given:
          polygon: "[[-0.20,-78.50],[-0.20,-78.49],[-0.21,-78.49]]"
        expected:
          type: Polygon
      - name: Texto que no es JSON
        given:
          polygon: "no-es-json"
        expected: Formato de polígono inválido

  - id: PROP-013
    name: El centro del polígono rellena las coordenadas que falten
    status: implemented
    summary: >-
      Si un anuncio trae polígono pero no trae latitude/longitude, se guardan las
      del centro aritmético del anillo, y al cambiar el polígono se recalculan.
    rationale: >-
      El filtro por bbox del mapa consulta latitude/longitude, así que un terreno
      sin punto no aparecería en el viewport. Al editar se anulan primero las
      coordenadas viejas para que el pin no se quede sobre el terreno anterior.
    evidence:
      - file: backend/real_estate/serializers.py
        lines: "22-57"
        symbol: polygon_center_lat_lng
        note: Acepta tanto el GeoJSON normalizado como el anillo [lat, lng] y descarta el punto de cierre.
      - file: backend/real_estate/serializers.py
        lines: "27-33"
        symbol: ensure_polygon_center
        note: Solo rellena los huecos, nunca pisa unas coordenadas enviadas explícitamente.
      - file: backend/real_estate/serializers.py
        lines: "364-366"
        symbol: ensure_polygon_center
        note: En update, un polígono nuevo sin coordenadas nuevas anula las anteriores y las recalcula.
    cases:
      - name: Alta con polígono y sin punto
        given:
          polygon: [[-0.20, -78.50], [-0.20, -78.48], [-0.18, -78.48], [-0.18, -78.50]]
          latitude: null
          longitude: null
        expected:
          latitude: -0.19
          longitude: -78.49
      - name: Alta con polígono y punto explícito
        given:
          polygon: [[-0.20, -78.50], [-0.20, -78.49], [-0.21, -78.49]]
          latitude: -0.205
          longitude: -78.495
        expected: se respetan las coordenadas enviadas

  # ---------------------------------------------------------------------------
  # Propiedad propia vs. importada
  # ---------------------------------------------------------------------------
  - id: PROP-014
    name: El dueño se asigna en el servidor y las importadas no tienen dueño
    status: implemented
    summary: >-
      owner se toma siempre de request.user al crear desde el API, y las
      propiedades que crea la ingesta quedan con owner NULL.
    rationale: >-
      owner es de solo lectura en el serializer, así que un cliente no puede
      publicar en nombre de otro. La ingesta no lo escribe en absoluto, que es lo
      que hace que una importada no tenga dueño al que atribuirla.
    evidence:
      - file: backend/real_estate/views.py
        lines: "558-560"
        symbol: perform_create
        note: serializer.save(owner=self.request.user), ignorando cualquier owner del payload.
      - file: backend/real_estate/serializers.py
        lines: "195-197"
        symbol: owner = serializers.PrimaryKeyRelatedField(read_only=True)
      - file: backend/real_estate/models.py
        lines: "183-185"
        symbol: owner = models.ForeignKey
        note: on_delete=SET_NULL, null=True - borrar la cuenta no borra el anuncio.
      - file: backend/ingesta/pipeline/upsert.py
        lines: "23-53"
        symbol: _apply_fields
        note: Escribe todos los campos del anuncio importado y no toca owner en ningún momento.
    cases:
      - name: Alta desde el API
        role: authenticated
        given:
          owner: 99999
        expected: la propiedad queda a nombre del usuario autenticado
      - name: Alta desde la ingesta
        role: internal
        given:
          is_imported: true
        expected: null
        note: owner queda NULL, que es lo que activa la cascada de contacto de PROP-016.

  - id: PROP-015
    name: Solo el dueño puede modificar o borrar su propiedad
    status: implemented
    summary: >-
      La escritura sobre una propiedad existente exige ser su owner; cualquier
      otro usuario autenticado recibe 403 y el anónimo 401.
    rationale: >-
      Como las importadas tienen owner NULL, la consecuencia práctica es que
      nadie puede editarlas desde el API público: solo el panel de administración,
      restringido a is_staff.
    evidence:
      - file: backend/real_estate/permissions.py
        lines: "4-15"
        symbol: IsOwnerOrReadOnly
        note: Permite cualquier método seguro y compara obj.owner == request.user para el resto.
      - file: backend/real_estate/views.py
        lines: "314-316"
        symbol: IsOwnerOrReadOnly
        note: permission_classes = [IsAuthenticatedOrReadOnly, IsOwnerOrReadOnly] en PropertyViewSet.
      - file: backend/real_estate/views.py
        lines: "2474-2476"
        symbol: PATCH_ALLOWED_FIELDS
        note: El panel admin puede tocar propiedades ajenas, pero solo status, title, price, city y description.
    backend:
      enforce: true
      endpoint: DELETE /api/properties/{property_id}/
    tests:
      api: true
    cases:
      - name: El dueño borra su propiedad
        role: owner
        expected: allowed
        expected_http_status: 204
      - name: Otro usuario autenticado no puede borrarla
        role: not_owner
        expected: denied
        http_status: 403
      - name: Un visitante anónimo no puede borrarla
        role: anonymous
        expected: denied
        http_status: 401

  - id: PROP-016
    name: Cascada de contacto de los anuncios importados
    status: partial
    summary: >-
      Sin dueño al que escribir, el contacto de un anuncio importado cae en
      cascada: teléfono (WhatsApp o llamada), y si no lo hay, enlace al anuncio
      original; si tampoco hay enlace, se declara que no hay contacto disponible.
    rationale: >-
      contact_email no es un escalón de la cascada. Y ni siquiera se muestra en
      todas partes: la ficha pública no lo menciona una sola vez, y solo el modal
      del mapa lo pinta, como dato informativo sin botón de acción. Ver IMP-006,
      que describe la misma cascada desde el lado de la ingesta.
    evidence:
      - file: backend/real_estate/models.py
        lines: "185-197"
        symbol: source_url
        note: El comentario del bloque de origen declara la cascada, y source_url la cierra como contacto de último recurso.
      - file: frontend/app/property/[id]/page.tsx
        lines: "657-688"
        symbol: sourceUrl
        note: Ficha pública - WhatsApp si hay teléfono, "Contactar en {agencia}" si hay enlace, aviso si no hay ninguno.
      - file: frontend/components/PropertyModal.tsx
        lines: "907-978"
        symbol: sourceUrl
        note: Modal del mapa - misma cascada, con "Llamar" y "WhatsApp" cuando hay teléfono.
    frontend:
      routes:
