  # ---------------------------------------------------------------------------
  # Deduplicación entre portales
  # ---------------------------------------------------------------------------
  - id: PROP-018
    name: Un anuncio importado es único por fuente y external_id
    status: implemented
    summary: >-
      La pareja (source, external_id) es única, pero solo para las filas con
      is_imported=True, de modo que reimportar actualiza en lugar de duplicar.
    rationale: >-
      La constraint es parcial a propósito: las propiedades de usuario tienen
      source NULL y external_id vacío, así que una constraint total las haría
      chocar entre sí. En una carrera, el IntegrityError se captura y la creación
      se degrada a actualización.
    evidence:
      - file: backend/real_estate/models.py
        lines: "264-266"
        symbol: uniq_source_external_when_imported
        note: UniqueConstraint con condition=Q(is_imported=True).
      - file: backend/ingesta/pipeline/upsert.py
        lines: "151-168"
        symbol: IntegrityError
        note: Savepoint alrededor del save para que el choque de una carrera no envenene la transacción exterior.
    cases:
      - name: Reimportar el mismo anuncio
        given:
          source: plusvalia
          external_id: "pv-1"
          ya_existe: true
        expected: updated
      - name: Dos propiedades de usuario sin fuente
        given:
          is_imported: false
          source: null
          external_id: ""
        expected: ambas conviven

  - id: PROP-019
    name: Entre portales gana el anuncio que trae teléfono
    status: implemented
    summary: >-
      Cuando la misma propiedad física aparece en dos portales, se conserva la que
      tiene teléfono de contacto; en caso de empate gana la que ya estaba.
    rationale: >-
      El teléfono es lo que convierte una visita en un contacto, así que decide la
      preferencia. El reemplazo nunca se borra antes de tiempo: la copia anterior
      se elimina solo después de que el anuncio nuevo quedó completo.
    evidence:
      - file: backend/ingesta/pipeline/dedup.py
        lines: "55-106"
        symbol: find_duplicate
        note: >-
          Señales, de más a menos confiable - misma huella de imagen; menos de 30 m
          con área compatible (±10%); menos de 500 m con área y precio dentro de
          ±3%. El teléfono no se usa como señal de identidad.
      - file: backend/ingesta/pipeline/upsert.py
        lines: "114-123"
        symbol: demote
        note: Si el nuevo trae teléfono y el existente no, el existente se marca para eliminarse; si no, se devuelve skipped_duplicate.
      - file: backend/ingesta/pipeline/upsert.py
        lines: "195-198"
        symbol: delete_property_images
        note: La copia anterior se borra al final, cuando el reemplazo ya tiene sus imágenes.
    cases:
      - name: El anuncio nuevo trae teléfono y el existente no
        given:
          nuevo_contact_phone: "0999999999"
          existente_contact_phone: ""
        expected: se crea el nuevo y se elimina el anterior
      - name: El existente ya tiene teléfono
        given:
          nuevo_contact_phone: "0999999999"
          existente_contact_phone: "0988888888"
        expected: skipped_duplicate
      - name: Ninguno tiene teléfono
        given:
          nuevo_contact_phone: ""
          existente_contact_phone: ""
        expected: skipped_duplicate
      - name: Mismo anunciante con dos propiedades distintas
        given:
          mismo_telefono: true
          distancia_m: 4000
        expected: no se consideran duplicadas
        note: El teléfono queda fuera de las señales justamente para esto.

  - id: PROP-020
    name: El modelo no conserva enlaces a duplicados descartados
    status: implemented
    summary: >-
      Property no tiene un campo duplicate_of: el pipeline conserva una sola fila
      y no mantiene una relación hacia anuncios descartados.
    rationale: >-
      Hoy el pipeline resuelve el duplicado de forma destructiva - o descarta el
      anuncio nuevo (skipped_duplicate) o elimina el anterior tras crear el
      reemplazo - así que nunca quedan las dos filas vivas que el FK enlazaría. El
      campo se retiró porque nunca podía representar el comportamiento real.
    evidence:
      - file: backend/real_estate/models.py
        lines: "200-230"
        symbol: "is_duplicate = models.BooleanField"
        note: Los campos de ingesta saltan de is_duplicate a imported_at, sin duplicate_of.
      - file: backend/real_estate/migrations/0033_remove_obsolete_dedup_fields.py
        lines: "1-12"
        symbol: 'name="duplicate_of"'
    cases:
      - name: Se detecta un duplicado entre dos portales
        given:
          duplicado_detectado: true
        expected: null
        note: La propiedad superviviente no guarda ninguna referencia a la descartada.

  - id: PROP-021
    name: is_duplicate solo se lee, nunca se escribe
    status: not_implemented
    summary: >-
      El flag is_duplicate se consulta en el mapa, el panel de ingesta y las
      métricas, pero ningún código lo pone a True.
    rationale: >-
      Al resolverse los duplicados por descarte o por borrado (PROP-019), no queda
      ninguna fila que marcar. Las filas con is_duplicate=True que existan vienen de
      datos anteriores o de una réplica de producción, y siguen ocultas del catálogo
      porque el queryset público las excluye igualmente.
    cases:
      - name: Se detecta un duplicado entre dos portales
        given:
          duplicado_detectado: true
        expected: false
        note: El anuncio perdedor se descarta o se borra; nunca se queda marcado.
      - name: Fila heredada con el flag activo
        given:
          is_duplicate: true
        expected: oculta del catálogo público
        note: Comportamiento de lectura, cubierto por PROP-002.

  - id: PROP-022
    name: La deduplicación no persiste una rejilla geográfica sin lector
    status: implemented
    summary: >-
      Property no guarda dedup_key; la deduplicación geográfica usa directamente
      un bounding box indexado y confirma la distancia con haversine.
    rationale: >-
      La deduplicación real se resuelve con un bounding box sobre latitude y
      longitude más haversine en Python, y con la huella perceptual de la imagen
      principal; persistir una segunda aproximación geográfica sin consumidores
      añadía escritura e índice sin mejorar la búsqueda.
    evidence:
      - file: backend/ingesta/pipeline/dedup.py
        lines: "70-105"
        symbol: "latitude__range"
      - file: backend/real_estate/migrations/0033_remove_obsolete_dedup_fields.py
        lines: "1-12"
        symbol: 'name="dedup_key"'
    cases:
      - name: Alta de un anuncio importado con coordenadas
        given:
          latitude: -0.18
          longitude: -78.48
        expected: "no se persiste una clave adicional"
        note: La latitud y longitud alimentan directamente la búsqueda por rango.

