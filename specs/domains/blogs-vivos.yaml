version: 1
domain: blogs-vivos
title: Páginas del blog que se recalculan con el inventario
status: implemented
summary: >-
  Rankings publicados dentro del blog —«los terrenos en venta más baratos de
  Quito»— que nacen de recetas, se recalculan con el inventario y solo existen
  donde hay datos suficientes para sostenerlos.
see_also:
  - specs/domains/seo.yaml
  - specs/domains/blog.yaml
  - specs/proposals/blogs-vivos-siguientes.yaml

rules:
  - id: LIVE-001
    name: Un mismo blog sirve artículos escritos y páginas vivas
    status: implemented
    summary: >-
      `/blog/<slug>` resuelve en dos pasos: primero busca un artículo en la base
      y lo sirve tal cual; solo si no existe intenta interpretar el slug como
      una receta de ranking. Un artículo publicado con el slug de una receta
      gana siempre.
    rationale: >-
      Es lo que permite las dos cosas sin duplicar rutas ni partir el blog en
      dos secciones. Y da gratis la salida de emergencia: si una página generada
      queda mal para una ciudad concreta, se publica un artículo con ese slug y
      queda sustituida sin tocar código.
    evidence:
      - file: frontend/app/blog/[slug]/page.tsx
        symbol: "const live = await resolveLivePage(slug);"
        note: Solo se consulta la receta cuando no hay artículo con ese slug.
      - file: frontend/lib/live-resolve.ts
        symbol: export async function resolveLivePage
        note: Devuelve null cuando el slug no es una receta o su mercado no la sostiene.
    frontend:
      routes: ["/blog/[slug]"]
    tests: {}
    cases:
      - name: Slug de un artículo existente
        expected: se sirve el artículo, sin consultar recetas
      - name: Slug de una receta con datos suficientes
        expected: se sirve la página viva
      - name: Slug que no es ni artículo ni receta
        expected: 404

  - id: LIVE-002
    name: Las páginas vivas nacen de recetas, no de una lista escrita a mano
    status: implemented
    summary: >-
      Una receta combina criterio, tipo de propiedad, operación y ámbito
      geográfico. El slug se genera y se vuelve a interpretar de forma
      determinista, con concordancia de género en español: `casas-en-venta-mas-baratas-en-cuenca`,
      `terrenos-mas-grandes-del-pais`,
      `departamentos-con-mejor-precio-por-metro-en-la-provincia-de-pichincha`.
    rationale: >-
      Con seis criterios, cuatro tipos, tres variantes de operación y todas las
      ciudades y provincias con inventario, declarar un criterio nuevo publica
      cientos de páginas sin escribir ninguna. Y como el slug es reversible, no
      hay tabla que mantener sincronizada.

      La concordancia no es cosmética: sin ella «casas más baratos» y «casas más
      baratas» serían dos direcciones para la misma página. El parser rechaza la
      que no concuerda, así que cada página tiene una sola URL.
    evidence:
      - file: frontend/lib/live-pages.ts
        symbol: export function buildLiveSlug
      - file: frontend/lib/live-pages.ts
        symbol: export function parseLiveSlug
        note: Resuelve el lugar contra el inventario real; una ciudad inventada no es página.
      - file: frontend/lib/live-pages.ts
        symbol: "const TYPE_GENDER"
      - file: frontend/lib/live-pages.test.ts
        symbol: describe('parseLiveSlug'
    tests:
      unit: true
    cases:
      - name: "terrenos-mas-baratos-en-quito"
        expected: criterio precio ascendente, tipo terreno, ciudad Quito
      - name: "casas-mas-baratos-en-cuenca"
        expected: no es una receta; el género no concuerda
      - name: Slug de una ciudad sin inventario
        expected: no es una receta

  - id: LIVE-003
    name: El orden se calcula en el servidor y descarta lo imposible
    status: implemented
    summary: >-
      Un endpoint público devuelve el ranking resuelto: los anuncios, el tamaño
      de la muestra, el promedio contra el que se comparan y la fecha más
      reciente del inventario incluido. Se descartan los anuncios con datos
      imposibles —precio de venta bajo mil dólares, área fuera del rango de
      10 m² a 1.000 hectáreas, precio por m² fuera de 1 a 10.000 USD— y los que
      quedan por debajo del 5 % del precio por m² promedio de su propio ámbito.
      Las publicaciones repetidas ocupan una sola posición. El empate se rompe
      por id, así que dos renders devuelven el mismo orden.
    rationale: >-
      Las estadísticas del m² recortan la cola intercuartílica, y aquí eso sería
      un error: en «los terrenos más grandes del país» ese recorte borra
      justamente lo que la página promete. Un ranking no debe excluir lo
      extremo, sino lo imposible.

      El umbral relativo cubre lo que las cotas absolutas no ven. Un terreno de
      1.700 dólares es un precio plausible para algo, pero no para 540 m² en
      Quito: es un alquiler escrito como venta, y encabezaba «los más baratos»
      de forma permanente. Cinco por ciento del promedio del ámbito deja pasar
      la ganga real y descarta lo que está a dos órdenes de magnitud.

      Calcularlo en el servidor además permite cachearlo por versión de
      inventario y evita abrir un parámetro de orden genérico en el listado
      público, que es lo que un scraper querría.
    evidence:
      - file: backend/real_estate/services/rankings.py
        symbol: def build_ranking
      - file: backend/real_estate/services/rankings.py
        symbol: def _apply_relative_floor
      - file: backend/real_estate/services/rankings.py
        symbol: def _collapse_repeats
      - file: backend/real_estate/views.py
        symbol: def rankings
      - file: backend/real_estate/tests/test_rankings.py
        symbol: def test_a_price_far_below_its_own_market_is_a_typo_too
    backend:
      endpoint: GET /api/properties/rankings/
    tests:
      api: true
    cases:
      - name: Venta de 250 dólares entre terrenos de 50.000
        expected: excluida por la cota absoluta
      - name: Terreno a 3 USD/m² donde el ámbito promedia 100
        expected: excluido por el umbral relativo
      - name: Área de 100.000.000 m² en un anuncio que dice 10 hectáreas
        expected: excluida; no encabeza «los más grandes»
      - name: La misma propiedad publicada por dos agencias
        expected: ocupa una sola posición
      - name: Dos precios iguales
        expected: el mismo orden en cada render

  - id: LIVE-004
    name: Una página viva solo existe cuando el dato la sostiene
    status: implemented
    summary: >-
      Una receta se convierte en página solo si su ámbito tiene al menos diez
      anuncios que cumplan ese criterio; por debajo, la URL responde 404. Qué
      ámbitos califican se resuelve con una sola agregación, no con una consulta
      por página candidata. Que además merezca estar en el índice lo decide
      LIVE-017.
    rationale: >-
      Es la misma decisión de SEO-001 y del umbral de promoción del m²:
      publicar un «top 10» con tres resultados es contenido fino firmado con el
      nombre del portal.

      Responde 404 y no 200 con noindex —que es lo que hacen las landings
      locales— porque aquella URL existe como concepto aunque esté vacía,
      mientras que un ranking de una ciudad sin inventario nunca existió. Cuando
      la ciudad acumula anuncios, la página aparece sola en la siguiente
      revalidación.
    evidence:
      - file: backend/real_estate/services/rankings.py
        symbol: MIN_RANKING_LISTINGS
      - file: backend/real_estate/services/rankings.py
        symbol: def available_scopes
        note: Una agregación responde por todas las páginas candidatas a la vez.
      - file: frontend/lib/live-pages.ts
        symbol: export function existingRecipes
      - file: frontend/app/sitemap.ts
        symbol: "const liveRoutes: MetadataRoute.Sitemap"
        note: El sitemap publica exactamente las que existen.
      - file: backend/real_estate/tests/test_rankings.py
        symbol: def test_a_scope_without_enough_inventory_does_not_rank
    tests:
      api: true
      unit: true
    cases:
      - name: Ciudad con 40 terrenos
        expected: página publicada y en el sitemap
      - name: Ciudad con 9 terrenos
        expected: 404 y fuera del sitemap
      - name: Ámbito sin áreas declaradas
        expected: no publica rankings por área ni por precio por m²

  - id: LIVE-005
    name: Un ranking nunca promete más de lo que tiene
    status: implemented
    summary: >-
      El título, el H1 y la descripción declaran la cantidad real de anuncios
      mostrados. Con siete resultados la página dice siete.
    rationale: >-
      Es la diferencia entre una página citable y una que quema la fuente. Un
      motor que resume «los 10 terrenos más baratos de Ambato» y encuentra siete
      no vuelve a citar el dominio.
    evidence:
      - file: frontend/lib/live-pages.ts
        symbol: export function liveTitle
      - file: frontend/components/blog/LiveRankingPage.tsx
        symbol: "const title = liveTitle(recipe, count);"
        note: El conteo sale de los ítems recibidos, no del límite pedido.
      - file: frontend/lib/live-pages.test.ts
        symbol: describe('liveTitle'
    tests:
      unit: true
    cases:
      - name: Siete candidatos con tope de diez
        expected: el título dice siete

  - id: LIVE-006
    name: Cada anuncio dice por qué está ahí y se puede ver en el mapa
    status: implemented
    summary: >-
      Cada posición muestra su cifra y la distancia respecto al promedio del
      ámbito, medida sobre el precio por m² —o sobre el área en los rankings de
      tamaño—, y enlaza a su ficha y a su ubicación en el mapa. La página enlaza
      además al catálogo completo y a la estadística del m² de ese lugar.
    rationale: >-
      Es lo que separa esta página del catálogo reordenado que ya existe. Y el
      eje de comparación importa: contrastar precios totales llamaría «la mejor
      oferta» al lote más pequeño. El precio por metro es el eje donde alguien
      distingue una ganga de un terreno chico.
    evidence:
      - file: backend/real_estate/services/rankings.py
        symbol: def _benchmark
      - file: backend/real_estate/services/rankings.py
        symbol: "comparison: str = 'price_per_m2'"
      - file: frontend/components/blog/LiveRankingPage.tsx
        symbol: function reason
      - file: backend/real_estate/tests/test_rankings.py
        symbol: def test_each_position_is_compared_on_price_per_square_metre
    tests:
      api: true
    cases:
      - name: Anuncio un 81 % por debajo del precio por m² de su ciudad
        expected: la página lo declara junto al precio
      - name: Cualquier posición
        expected: enlaza a su ficha y a su ubicación en el mapa

  - id: LIVE-007
    name: La fecha de una página viva es la de su inventario
    status: implemented
    summary: >-
      La fecha visible, el `dateModified` del Dataset y el `lastmod` del sitemap
      salen de la modificación más reciente de los anuncios que componen el
      ranking o de su zona. Nunca de la hora de renderizado.
    rationale: >-
      Extiende SEO-002 y SEO-006 a estas páginas. Una página que dice
      actualizarse sola y declara la hora del render como fecha de cambio miente
      sobre el contenido y sobre la señal.
    evidence:
      - file: backend/real_estate/services/rankings.py
        symbol: "updated_at=Max('updated_at')"
      - file: frontend/components/blog/LiveRankingPage.tsx
        symbol: "dateModified: ranking.context.updated_at"
      - file: frontend/app/sitemap.ts
        symbol: "locationLatest.get(page.recipe.scope.slug)"
    tests: {}
    cases:
      - name: Ranking cuyo anuncio más reciente cambió ayer
        expected: dateModified de ayer

  - id: LIVE-008
    name: Las páginas vivas viven en el blog, distinguidas por una categoría
    status: implemented
    summary: >-
      No hay sección aparte: aparecen en el blog como una categoría más,
      «Rankings en vivo», con su propio índice agrupado por lugar. El índice
      lista una entrada por lugar y tipo de propiedad; las demás recetas de ese
      lugar se alcanzan desde la propia página.
    rationale: >-
      Un lugar puede tener veinticuatro rankings, y listarlos todos convertía el
      índice en mil enlaces y casi un megabyte de HTML. Con una entrada por
      lugar y tipo, y los enlaces entre hermanas dentro de cada página, ninguna
      queda a más de un salto y el índice se puede leer.
    evidence:
      - file: frontend/lib/blog.ts
        symbol: export const LIVE_CATEGORY
        note: No hay fila en la base que la respalde, igual que no la hay para las páginas.
      - file: frontend/app/blog/categoria/[slug]/page.tsx
        symbol: function LiveCategoryPage
      - file: frontend/app/blog/page.tsx
        symbol: "const allCategories = livePages.length"
      - file: frontend/lib/live-resolve.ts
        symbol: function siblingsOf
    frontend:
      routes: ["/blog", "/blog/categoria/rankings-en-vivo"]
    tests: {}
    cases:
      - name: Visita al blog
        expected: la categoría aparece junto a las escritas a mano
      - name: Visita al índice de la categoría
        expected: una entrada por lugar y tipo, agrupadas por lugar

  - id: LIVE-009
    name: Ningún ranking público se ordena por visitas
    status: implemented
    summary: >-
      Ninguna receta ordena por `views_count` ni por ninguna medida de interés
      por anuncio, y el payload del ranking no incluye esos campos. Un slug que
      pida ese orden no es una página.
    rationale: >-
      VIS-001 no oculta el contador por comodidad técnica: enseñar qué anuncio
      se mueve delata al vendedor frente a la competencia. Una página «los más
      vistos» publica ese dato ordenado y con nombre.

      Si el negocio decide que la popularidad por anuncio debe ser pública, deja
      de ser un defecto y pasa a ser una decisión: entonces se reescribe
      VIS-001, no se rodea desde una página nueva.
    evidence:
      - file: backend/real_estate/services/rankings.py
        symbol: "CRITERIA: dict[str, Criterion]"
        note: Los seis criterios ordenan por precio, área, precio por m² o fecha.
      - file: backend/real_estate/tests/test_rankings.py
        symbol: def test_no_criterion_ranks_by_a_private_signal
      - file: frontend/lib/live-pages.test.ts
        symbol: "terrenos-mas-vistos-en-quito"
    tests:
      api: true
      unit: true
    cases:
      - name: Slug que pide orden por visitas
        expected: no es una receta; 404
      - name: Cualquier ranking
        expected: el payload no contiene contadores de visitas

  - id: LIVE-016
    name: Una página viva se lee sin JavaScript
    status: implemented
    summary: >-
      El ranking, sus cifras, el método y los enlaces viajan en el HTML servido.
    rationale: >-
      Es la misma razón por la que BLOG-009 pone la cifra del m² en el HTML: los
      rastreadores de las IA no ejecutan JavaScript, y estas páginas se escriben
      para que las citen.
    evidence:
      - file: frontend/components/blog/LiveRankingPage.tsx
        symbol: export default function LiveRankingPage
        note: Componente de servidor; no hay 'use client' en toda la ruta.
      - file: tests/e2e/blog-vivo.spec.ts
        symbol: "a ranking renders complete on the server"
    tests: {}
    cases:
      - name: HTML servido de un ranking
        expected: contiene todas las posiciones con su cifra y sus enlaces

  - id: LIVE-017
    name: Existir y merecer el índice son dos preguntas distintas
    status: implemented
    summary: >-
      Tres umbrales, todos múltiplos de lo que la página muestra. Con menos de
      diez anuncios no hay página. Desde veinte —el doble de lo que enseña— la
      página entra al índice, al sitemap y a los listados. Los criterios de
      nicho —más caros, más pequeños, mejor precio por metro, más recientes—
      esperan a cincuenta; los dos que se buscan solos, más baratos y más
      grandes, no esperan. Entre diez y el umbral que le toque, la página
      responde con `noindex, follow`.
    rationale: >-
      Un ranking de diez sobre una muestra de diez no es un ranking: es el
      catálogo en otro orden, y la landing de esa ciudad ya existe. Desde el
      doble, la página selecciona de verdad: enseña la mitad superior de lo que
      leyó.

      El tercer umbral es un juicio editorial, no una medición, y conviene
      decirlo: «los locales comerciales más pequeños de Cotopaxi» calculado
      sobre once anuncios es correcto y no lo busca nadie.

      Search Console lo deja aún más claro. En los tres meses hasta el 17 de
      agosto de 2026 el dominio no registró **ninguna impresión** para consultas
      que contengan «barat», que es justo el criterio que esta regla trata como
      amplio. No es prueba de que no haya demanda —sin una página que apunte a
      esa consulta, el sitio no aparece y por tanto no hay impresión que
      contar—, pero sí de que la clasificación en amplios y de nicho no está
      respaldada por datos propios todavía. Lo que sí muestran los datos es otra
      forma de la demanda: 216 impresiones para consultas con «edificio» y 234
      con «urbaniza», en posición media 9, es decir nombres propios de proyectos
      inmobiliarios. Estas páginas son una apuesta razonada, no una respuesta a
      demanda observada, y la forma de convertirlas en dato es publicar el
      subconjunto amplio y volver a leer Search Console dentro de seis semanas. Publicarlo en volumen
      es exactamente lo que Google llama abuso de contenido a escala. Sobre el
      inventario de agosto de 2026 la política deja 500 páginas publicables de
      972 posibles, y las otras 472 siguen respondiendo a quien llegue.

      No se borran porque el mercado sube y baja: una ciudad que hoy tiene
      dieciocho anuncios mañana tiene veinticinco. Devolver 404 a una URL ya
      indexada por una fluctuación de inventario es peor que declararla
      `noindex` hasta que vuelva a merecerlo, que es la forma en que SEO-001
      trata a una landing local que todavía se está llenando.
    evidence:
      - file: backend/real_estate/services/rankings.py
        symbol: MIN_INDEXABLE_SAMPLE
      - file: backend/real_estate/services/rankings.py
        symbol: def is_indexable
      - file: backend/real_estate/services/rankings.py
        symbol: "'broad_criteria': sorted(slug for slug, item in CRITERIA.items() if item.broad)"
        note: La política viaja con los conteos; la página y el sitemap no pueden discrepar.
      - file: frontend/lib/live-pages.ts
        symbol: export function isIndexable
      - file: frontend/lib/live-pages.ts
        symbol: export function renderableRecipes
        note: Lo que se puede renderizar es más amplio que lo que se publica.
      - file: frontend/app/blog/[slug]/page.tsx
        symbol: "live.indexable ? {} : { robots: { index: false, follow: true } }"
      - file: frontend/lib/live-pages.test.ts
        symbol: "publishes only the broad criteria in a shallow one"
    tests:
      unit: true
    cases:
      - name: Ámbito con 60 anuncios
        expected: los seis criterios entran al índice
      - name: Ámbito con 25 anuncios
        expected: solo más baratos y más grandes entran al índice
      - name: Ámbito con 12 anuncios
        expected: la página responde con noindex, follow y no entra al sitemap
      - name: Ámbito con 9 anuncios
        expected: 404
