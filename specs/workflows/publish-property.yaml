  - id: WFP-019
    name: Sin nada marcado, el mapa se sitúa sobre la ciudad elegida
    status: implemented
    summary: >-
      Al abrir el paso de ubicación de un anuncio nuevo, y cada vez que cambia la
      ciudad, el mapa viaja al centro de esa ciudad. La precedencia de WFP-018 se
      mantiene intacta: un punto o una forma ya puestos, y la ubicación del
      navegador cuando se concedió, siguen mandando sobre la cámara.
    rationale: >-
      El paso abría sobre el país entero —Quito y Guayaquil en pantalla, escala
      de 100 km— y lo único que movía la cámara era la geolocalización. Quien la
      rechazaba, o publicaba desde una computadora, tenía que encontrar su
      predio arrastrando el mapa desde escala país mientras el selector de
      ciudad, justo debajo, decía «Macas» desde el principio. El dato para
      ayudarle ya estaba en el formulario.

      Se resuelve con el mismo Nominatim que el formulario ya usa para la
      operación inversa (deducir ciudad y provincia de un punto), en vez de con
      una tabla de centroides escrita a mano: son datos que nadie tendría que
      mantener y que se inventan con facilidad. La respuesta se cachea por
      sesión para respetar el límite de una petición por segundo, y si el
      servicio no responde el mapa simplemente no se mueve.
    evidence:
      - file: frontend/app/add-property/page.tsx
        symbol: "const centerMapOnCity"
        note: Geocodifica ciudad y provincia y hace flyTo a escala 13; cachea por sesión.
      - file: frontend/app/add-property/page.tsx
        symbol: "if (polygonCoords.length >= 3) return;"
        note: No se mueve si ya hay punto, forma o ubicación del navegador.
    tests: {}
    cases:
      - name: Publicar desde cero sin conceder la ubicación
        expected: "el mapa abre sobre la ciudad seleccionada, no sobre todo Ecuador"
      - name: Cambiar la ciudad en el selector
        expected: "el mapa viaja a la ciudad nueva"
      - name: Cambiar la ciudad con un punto ya marcado
        expected: "el mapa no se mueve"
      - name: Nominatim no responde
        expected: "el mapa se queda donde está; la ubicación se marca a mano"

  - id: WFP-020
    name: La forma dibujada calcula el área, y el área sigue siendo corregible
    status: implemented
    summary: >-
      Cerrar el contorno del predio rellena «Área Total» con la superficie
      medida sobre esa forma, redondeada a metros cuadrados enteros, e indica de
      dónde salió el número. Borrar la forma vacía el campo. Escribirlo a mano
      después es válido y desactiva el aviso.
    rationale: >-
      El mapa ya medía cada lado del predio, pero la superficie no volvía al
      formulario: quien acababa de trazar su terreno vértice a vértice tenía que
      estimar a ojo cuántos metros cuadrados había encerrado, y nada comparaba lo
      escrito con lo dibujado. Ese número no es decorativo — alimenta el precio
      por m², los filtros de área y las páginas de estadísticas por ciudad—, así
      que una estimación a ojo contamina agregados que nadie vuelve a revisar.

      Se conserva editable porque el polígono suele ser aproximado y la
      escritura puede venir de una escritura de propiedad, que es más fiable que
      el trazo. Lo que se elimina es la obligación de adivinar.
    evidence:
      - file: frontend/components/maps/DrawLocationMap.tsx
        symbol: "onAreaChangeRef.current?.(turf.area("
        note: Mide el anillo cerrado con turf, que ya estaba importado para validar la forma.
      - file: frontend/components/maps/DrawLocationMap.tsx
        symbol: "onAreaChangeRef.current?.(0)"
        note: Borrar la forma vacía el área que esa forma había medido.
      - file: frontend/app/add-property/page.tsx
        symbol: "const handleDrawnAreaChange"
        note: Escribe el campo y marca que el número viene del dibujo.
    tests: {}
    cases:
      - name: Cerrar un contorno de tres vértices
        expected: "el área se rellena con la superficie medida y el campo dice que se calculó del dibujo"
      - name: Borrar la forma dibujada
        expected: "el área vuelve a quedar vacía"
      - name: Escribir el área a mano después de dibujar
        expected: "se respeta lo escrito"

  - id: WFP-021
    name: Subir fotos lentas no cancela la publicación
    status: implemented
    summary: >-
      La petición que crea o actualiza un anuncio no tiene fecha límite: se
      corta solo tras 120 s sin que se mueva un solo byte. Mientras el cuerpo
      viaja, el botón muestra el porcentaje subido.
    rationale: >-
      Todas las peticiones del portal pasaban por un aborto único de 30 s. Para
      una lectura es correcto; para la subida de un anuncio era una condena: el
      tope documentado del lote son 50 MB y, en la subida móvil desde la que
      publica la mayoría, ese traslado se mide en minutos. Cada una de esas
      publicaciones se cortaba a mitad del cuerpo, decía «tardó demasiado» y
      fallaba igual al reintentar — la clave de idempotencia no puede reproducir
      una petición que el servidor nunca terminó de leer.

      El reloj mide inactividad y no duración total porque una subida lenta que
      sigue avanzando está funcionando. Y el porcentaje existe porque una espera
      muda de varios minutos es indistinguible de un cuelgue: sin él, la persona
      recarga la página y pierde el anuncio por su propia mano.
    evidence:
      - file: frontend/lib/upload-with-progress.ts
        symbol: "const DEFAULT_IDLE_TIMEOUT_MS"
        note: 120 s sin actividad, rearmado en cada evento de progreso.
      - file: frontend/lib/api.ts
        symbol: "onUploadProgress && fetchOptions.body instanceof FormData"
        note: Pedir progreso conmuta la petición a XHR, con la misma gestión de token.
      - file: frontend/app/add-property/page.tsx
        symbol: "`Subiendo fotos ${uploadProgress}%`"
        note: El botón informa el avance real de la subida.
    tests: {}
    cases:
      - name: Publicar seis fotos con subida lenta
        expected: "la petición continúa más allá de 30 s y el botón muestra el avance"
      - name: La conexión se corta a mitad de la subida
        expected: "se informa el fallo de red; el borrador local sigue guardado"
      - name: Reintentar tras un fallo con la misma Idempotency-Key
        expected: "si el primer intento llegó a crear el anuncio, se devuelve ese mismo (WFP-006)"

  - id: WFP-022
    name: El preflight CORS autoriza la cabecera Idempotency-Key
    status: implemented
    summary: >-
      `CORS_ALLOW_HEADERS` incluye `idempotency-key` además de la lista por
      defecto de django-cors-headers. Sin ella, la respuesta al `OPTIONS`
      previo no cubre la cabecera que el formulario envía al crear y el
      navegador descarta el `POST /api/properties/` antes de enviarlo.
    rationale: >-
      El portal y la API son orígenes distintos
      (`geopropiedadesecuador.com` contra `api.geopropiedadesecuador.com`), así
      que toda cabecera fuera de la allowlist convierte la petición en un
      preflight fallido. Ese fallo es el peor de los posibles: no deja rastro
      en el servidor —la petición nunca llega— y el navegador solo entrega un
      `TypeError` sin motivo, de modo que el formulario únicamente puede decir
      «no se pudo comunicar con el servidor» y la persona culpa a su conexión.

      Ocurrió: entre el 3 de agosto de 2026, cuando WFP-006 añadió la
      cabecera, y el 16 del mismo mes, ninguna publicación hecha desde el
      formulario llegó a crearse. Quedaron 39 `publication_create_failed` con
      `status_code: "network"` y una sola propiedad creada en todo ese periodo,
      por el canje de un enlace de continuación (WFP-019), que es el único
      camino que no manda la cabecera. Por eso la regla es explícita y tiene
      test propio: la allowlist por defecto no la contiene, y añadir una
      cabecera al cliente sin añadirla aquí vuelve a romper el alta entera sin
      un solo error en los registros.
    evidence:
      - file: backend/estate_map/settings.py
        symbol: "CORS_ALLOW_HEADERS = (*default_headers, 'idempotency-key')"
        note: La lista por defecto no incluye idempotency-key; hay que añadirla.
      - file: frontend/app/add-property/page.tsx
        symbol: "'Idempotency-Key': publicationRequestId"
        note: La cabecera que obliga al preflight, solo en la creación.
    tests:
      api: true
    cases:
      - name: Preflight del alta declarando Idempotency-Key
        given:
          origin: "https://geopropiedadesecuador.com"
          access_control_request_headers: "idempotency-key"
        expected:
          http_status: 200
          header: "Access-Control-Allow-Headers incluye idempotency-key"
      - name: Alta con la cabecera desde el origen del portal
        given:
          origin: "https://geopropiedadesecuador.com"
          idempotency_key: "abc123"
        expected: "el navegador no bloquea la petición y el alta sigue su curso normal"

  - id: WFP-023
    name: Un rechazo del almacenamiento queda escrito en la fila, no solo en los registros
    status: implemented
    summary: >-
      Si `optimize_property_image` recibe un error de boto al publicar en
      MinIO, la fila sigue `pending` con su archivo temporal —para que la
      barrida horaria la reintente— pero guarda el motivo en
      `optimization_error`. El panel de estado marca `error` en cuanto existe
      una fila pending con motivo, sin esperar el umbral de dos horas de
      antigüedad.
    rationale: >-
      Ocurrió el 20 de agosto de 2026: la credencial de MinIO del backend dejó
      de coincidir con la del servidor y cada `HeadObject` respondió 403. La
      excepción subía sin tocar la fila, así que las fotos quedaban `pending`
      —indistinguibles de una subida de hace un segundo— y el portal las
      mostraba desde el almacenamiento temporal. Nada en la interfaz decía que
      el almacén llevaba horas rechazando escrituras.

      Marcar la fila `failed` sería peor: la barrida solo reencola las
      `pending`, y una credencial se arregla desde fuera. Lo que faltaba no era
      cambiar de estado, era dejar por escrito por qué sigue pendiente.
    evidence:
      - file: backend/real_estate/tasks.py
        symbol: "except (BotoCoreError, ClientError) as exc:"
        note: Escribe optimization_error y vuelve a lanzar; no cambia el estado.
      - file: backend/real_estate/views.py
        symbol: '.exclude(optimization_error="")'
        note: El panel de estado cuenta las pending con motivo como error.
    tests:
      api: false
    cases:
      - name: El almacén responde 403 al publicar
        given:
          storage: rechaza
        expected: "la fila sigue pending con su archivo; optimization_error explica el rechazo"
      - name: Hay una fila pending con motivo
        given:
          pending_con_error: 1
        expected: "el componente de imágenes del panel de estado responde error"

  - id: WFP-024
    name: Una foto en staging no pasa por el optimizador de imágenes del portal
    status: implemented
    summary: >-
      `PropertyImage` marca `unoptimized` cuando el `src` apunta a
      `/pending-image/`, de modo que el navegador la pide directamente a la
      API en lugar de a `/_next/image`.
    rationale: >-
      El host de la API no está en `images.remotePatterns` y no debe estarlo:
      la URL de staging muere en cuanto el worker publica el WebP, así que no
      hay nada que optimizar ni que cachear un día. Pero mandarla igualmente
      al optimizador devuelve `400 "url" parameter is not allowed`, y entonces
      la ventana de staging —que existe precisamente para no pintar una imagen
      rota (PERM-023)— pinta una imagen rota.

      Se notó el 20 de agosto de 2026, cuando un fallo de credenciales alargó
      esa ventana de segundos a horas: la ficha salía sin fotos mientras la
      galería a pantalla completa, que usa `<img>` plano, las mostraba todas.
    evidence:
      - file: frontend/components/ui/PropertyImage.tsx
        symbol: function isStagedUpload
        note: Detecta la URL de staging por su ruta, no por el host.
      - file: frontend/components/ui/PropertyImage.tsx
        symbol: "unoptimized={unoptimized ?? isStagedUpload(props.src)}"
        note: El valor explícito de quien llama sigue teniendo prioridad.
      - file: frontend/next.config.js
        symbol: "hostname: 'minio.geopropiedadesecuador.com'"
        note: Solo el almacén público está permitido; la API no.
    tests:
      api: false
    cases:
      - name: Foto recién subida, aún en staging
        given:
          src: "/api/pending-image/1/"
        expected: "se pide directa a la API, sin pasar por /_next/image"
      - name: Foto ya publicada en el almacén
        given:
          src: "https://minio.geopropiedadesecuador.com/estatemap/properties/p1_0.webp"
        expected: "se pide optimizada por /_next/image"
