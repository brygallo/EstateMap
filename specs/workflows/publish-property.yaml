        expected: "se abre ese paso y el toast nombra el dato faltante"
      - name: La API rechaza un campo del anuncio
        expected: "se abre el paso del campo y el toast muestra el detalle de la API"

  - id: WFP-015
    name: El formulario avanza en orden y muestra el error dentro del paso
    status: implemented
    summary: >-
      Al publicar, solo se puede abrir el paso siguiente después de validar el
      actual: los indicadores permiten volver atrás pero no saltar pasos
      intermedios, y la tecla Enter avanza al paso siguiente en vez de enviar el
      formulario. Si falta un dato, el mismo mensaje aparece como toast y como
      alerta visible dentro del formulario. Al editar un anuncio que ya existe
      no rige ninguna secuencia: se puede abrir cualquier paso y guardar desde
      cualquiera.
    rationale: >-
      Permitir saltar desde Datos hasta Fotos pospone varios errores y hace que
      parezcan un fallo final de publicación. La secuencia convierte cada paso en
      una lista corta y resoluble antes de presentar el siguiente.

      Enter entra aquí porque durante meses fue el agujero de esa secuencia. Un
      paso con un único campo de texto y sin botón de envío es exactamente la
      forma sobre la que HTML dispara el envío implícito, así que pulsar Enter
      tras escribir el título publicaba desde el paso 1: la persona aterrizaba
      en «Precio» —sin haber pasado por Ubicación— y leía que faltaba un dato
      que nadie le había pedido todavía. La regla decía una cosa y el formulario
      hacía otra.

      La excepción de la edición es del 2026-08-11 y va en dirección contraria a
      propósito. Editar es corregir un campo de algo que ya existe y ya pasó por
      la validación entera; obligar a recorrer cinco pantallas para cambiar un
      precio es peaje, y en un anuncio cuyos datos guardados no satisfacen algún
      paso —un polígono con `area` nula, que la ingesta permite— ese peaje
      encerraba al dueño antes del botón de guardar.
    evidence:
      - file: frontend/app/add-property/page.tsx
        symbol: "validateStep"
        note: Cada sección valida sus requisitos y conserva el mensaje visible.
      - file: frontend/app/add-property/page.tsx
        symbol: "const handleFormKeyDown"
        note: Enter avanza de paso salvo en textarea, en botón o en el último paso.
      - file: frontend/app/add-property/page.tsx
        symbol: "if (isEditMode || index <= currentStep)"
        note: Publicando solo se abre el paso anterior o el siguiente validado; editando, cualquiera.
      - file: frontend/app/add-property/page.tsx
        symbol: "role=\"alert\""
        note: El error del paso permanece visible además del toast.
    tests: {}
    cases:
      - name: Desde el primer paso se intenta abrir Fotos
        expected: "permanece en Datos"
      - name: Se intenta continuar sin título
        expected: "permanece en Datos y muestra Ingresa un título para la propiedad"
      - name: Se completa el paso actual
        expected: "permite abrir únicamente el paso siguiente"
      - name: Se pulsa Enter en el título del primer paso
        expected: "avanza a Ubicación; no se envía el formulario ni se salta ningún paso"
      - name: Se pulsa Enter dentro de la descripción
        expected: "inserta un salto de línea; el formulario no avanza ni se envía"
      - name: Editando un anuncio se pulsa el indicador de Precio
        given:
          modo: edicion
        expected: "abre Precio directamente y ofrece guardar desde ahí"

  - id: WFP-016
    name: Todo intento de publicación fallido queda registrado con su motivo
    status: implemented
    summary: >-
      Cuando una publicación no sale adelante se guarda un ActivityEvent que
      lleva el motivo, no solo el código de estado: el mensaje que vio la
      persona, los campos que la API rechazó con su detalle, el código de error
      y el paso del formulario afectado. Cubre las cuatro maneras de fallar: la
      API rechaza el anuncio (`publication_create_failed` /
      `publication_update_failed`), la petición no llega
      (`status_code: network`, con el nombre de la excepción), la validación del
      formulario lo detiene (`publication_validation_failed`) y las
      comprobaciones de ubicación y área lo detienen antes de enviarlo
      (`publication_blocked`, con `reason`).
    rationale: >-
      El registro anterior solo guardaba el estado HTTP, el tipo de propiedad y
      si había polígono. Con eso, un 400 por precio inválido, una sesión
      caducada y una caída del servidor eran la misma fila en el panel, y las
      tres formas de fallar sin llegar a la API no dejaban ninguna. Sin el
      motivo, quien administra no puede responder por qué esa persona no pudo
      publicar.
    evidence:
      - file: frontend/lib/publication-form-errors.ts
        lines: "92-125"
        symbol: "publicationErrorReport"
        note: Aplana el cuerpo de error de la API en escalares que el payload puede llevar, truncados.
      - file: frontend/app/add-property/page.tsx
        lines: "1047-1057"
        symbol: "blockPublication"
        note: Las comprobaciones previas al envío emiten publication_blocked con su reason.
      - file: frontend/app/add-property/page.tsx
        lines: "1271-1277"
        symbol: "publicationErrorReport(errorBody, message)"
        note: El fallo de la API viaja con mensaje, campos, detalle y código.
      - file: frontend/app/add-property/page.tsx
        lines: "1296-1302"
        symbol: "publication_validation_failed"
        note: La validación del cliente también deja rastro con sus campos.
    tests: {}
    cases:
      - name: La API rechaza el precio del anuncio
        expected: "el evento guarda error_fields=price y el mensaje de la API"
      - name: La petición no llega al servidor
        expected: "el evento guarda status_code=network y el nombre de la excepción"
      - name: Falta marcar la ubicación en el mapa
        expected: "se registra publication_blocked con reason=missing_location"

