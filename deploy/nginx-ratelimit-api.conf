# Rate limiting for api.geopropiedadesecuador.com — server context
# ============================================================
# Installed at /etc/nginx/snippets/estatemap-ratelimit-api.conf and pulled into
# the API server block with a single `include`. Everything the limit needs
# lives here so the certbot-managed vhost keeps exactly one added line.
#
# The general limit is declared at server level and therefore inherited by
# every location. `limit_req` is inherited only when the inner level declares
# none of its own, which is what lets the map_points block below replace it
# rather than stack on top of it.

limit_req zone=estatemap_api burst=30 nodelay;
limit_req_status 429;

# The map is the endpoint worth scraping: one call returns thousands of points
# for a whole viewport. Django caps it at 120/min; this cuts a loop four times
# earlier than that, before it costs a worker.
location = /api/properties/map_points/ {
    limit_req zone=estatemap_map burst=20 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/estatemap-api-proxy.conf;
}

# nginx answers a rejected request itself, so without this the client would get
# an HTML error page where the API contract promises JSON. `docs/errors/api-errors.md`
# documents `{"detail": ...}` plus `Retry-After` for a 429, and the frontend's
# form-errors.ts maps that status to a fixed message — both keep working only
# if the shape survives the wall.
error_page 429 = @estatemap_rate_limited;
location @estatemap_rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    return 429 '{"detail":"Se realizaron demasiados intentos. Espera un momento y vuelve a intentar."}';
}
