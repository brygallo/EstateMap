# How the API vhost reaches Django. Installed at
# /etc/nginx/snippets/estatemap-api-proxy.conf.
#
# It exists so the stricter map_points location does not have to repeat the
# proxy settings of `location /`. Two copies drift; one that is included twice
# cannot.
proxy_pass http://127.0.0.1:8000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
