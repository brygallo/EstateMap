# Rate limit zones for the portal — http context
# ============================================================
# Installed at /etc/nginx/conf.d/estatemap-ratelimit.conf by
# deploy/install-edge-config.sh. Declaring a zone costs 10 MB of shared memory
# and does nothing on its own: only a `limit_req` inside a server block spends
# it, and the only server blocks that carry one are the portal's. aents.net and
# miyomehabla.com share this nginx and are unaffected.
#
# WHY A SECOND LIMIT WHEN DJANGO ALREADY HAS ONE
#
# Django's ceilings are the precise ones — 120/min for the map, 60/min for the
# listing (see DEFAULT_THROTTLE_RATES). They are also the expensive ones: every
# request that reaches them has already paid for a worker, a Redis round trip
# and the JWT decode. These zones sit five times looser on purpose. They never
# fire for a person or a polite crawler; they exist so a scraping loop is cut
# at the edge of the machine instead of occupying gunicorn.
#
# WHAT IS DELIBERATELY NOT LIMITED
#
# The frontend vhost. It serves 16.949 URLs whose whole point is to be
# crawled, and Googlebot's crawl rate is not something to gamble on for a
# business that lives off organic search. Bulk extraction happens through the
# API — one map_points call returns thousands of points — so that is where the
# wall belongs.

# Who is exempt. Evaluated against $remote_addr, which real_ip has already
# rewritten to the visitor's address for CDN traffic, so this tests the person
# and not the edge. Server-rendered pages arrive straight from the Next.js
# container over the docker bridge and never carry CF-Connecting-IP, so they
# keep their private address and stay exempt — the same reasoning as
# `_is_internal_client` in throttling.py.
geo $estatemap_exempt {
    default        0;
    127.0.0.1      1;
    ::1            1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;    # docker bridges (SSR, celery, the backend itself)
    192.168.0.0/16 1;
}

# An empty key makes nginx skip the zone entirely. That is the documented way
# to exempt a client without a second zone.
map $estatemap_exempt $estatemap_key {
    1 "";
    0 $binary_remote_addr;
}

limit_req_zone $estatemap_key zone=estatemap_api:10m rate=10r/s;
limit_req_zone $estatemap_key zone=estatemap_map:10m rate=5r/s;
