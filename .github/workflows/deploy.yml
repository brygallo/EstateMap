name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  verify:
    name: Tests and production checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estatedb
          POSTGRES_USER: estateuser
          POSTGRES_PASSWORD: estatepass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estateuser -d estatedb"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate specs and generated output
        run: ./scripts/specs.sh check
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Backend tests and migration check
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_NAME: estatedb
          DB_USER: estateuser
          DB_PASSWORD: estatepass
          REDIS_CACHE_URL: redis://localhost:6379/1
        run: |
          pytest -q
          python manage.py makemigrations --check --dry-run
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run typecheck
          npm test
          npm run build

  deploy:
    name: Deploy Backend & Frontend
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "📂 Navigating to project directory..."
            cd /var/www/estatemap

            echo "📝 Creating .env.prod file..."

            # Django/Backend Configuration
            echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" > .env.prod
            echo "DEBUG=False" >> .env.prod
            echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env.prod
            echo "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}" >> .env.prod
            echo "CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}" >> .env.prod
            echo "SECURE_SSL_REDIRECT=True" >> .env.prod
            echo "ENVIRONMENT=production" >> .env.prod
            echo "RELEASE_SHA=${{ github.sha }}" >> .env.prod

            # Database Configuration (pre-installed on server)
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env.prod
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env.prod
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.prod
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env.prod

            echo "SERVER_IP=${{ secrets.SERVER_IP }}" >> .env.prod

            # MinIO Configuration (pre-installed on server)
            echo "MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}" >> .env.prod
            echo "MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}" >> .env.prod
            echo "MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}" >> .env.prod
            echo "MINIO_USE_SSL=${{ secrets.MINIO_USE_SSL }}" >> .env.prod
            echo "MINIO_BUCKET_NAME=${{ secrets.MINIO_BUCKET_NAME }}" >> .env.prod
            echo "MINIO_PUBLIC_ENDPOINT=${{ secrets.MINIO_PUBLIC_ENDPOINT }}" >> .env.prod

            # Next.js Frontend Configuration
            # IMPORTANT: Variables must start with NEXT_PUBLIC_ to be available in browser
            echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env.prod
            echo "NEXT_PUBLIC_FRONTEND_URL=${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}" >> .env.prod
            echo "NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}" >> .env.prod
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" >> .env.prod

            # Google OAuth Configuration
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.prod
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.prod
            echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" >> .env.prod

            # Email Configuration
            echo "EMAIL_BACKEND=${{ secrets.EMAIL_BACKEND }}" >> .env.prod
            echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> .env.prod
            echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> .env.prod
            echo "EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}" >> .env.prod
            echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> .env.prod
            echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> .env.prod
            echo "DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}" >> .env.prod

            # Frontend URL for backend (email links, etc.)
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env.prod
            echo "REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}" >> .env.prod
            echo "NEXT_REVALIDATE_URL=http://frontend:3000/api/revalidate" >> .env.prod

            echo "🔄 Running deploy script..."
            ./scripts/deploy.sh

            echo "✅ Deployment completed!"
