name: Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Tests and production checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estatedb
          POSTGRES_USER: estateuser
          POSTGRES_PASSWORD: estatepass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estateuser -d estatedb"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate specs and generated output
        run: ./scripts/specs.sh check
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip check
      - name: Backend tests and migration check
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_NAME: estatedb
          DB_USER: estateuser
          DB_PASSWORD: estatepass
          REDIS_CACHE_URL: redis://localhost:6379/1
        run: |
          pytest -q --cov --cov-report=term-missing
          python manage.py makemigrations --check --dry-run
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run typecheck
          npm test
          npm run build

  deploy:
    name: Deploy Backend & Frontend
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The action's default is 10 minutes, and the deploy does not fit in
          # it: on a 8 GB shared host the two Docker builds alone take longer
          # than that when a dependency changed. Cutting the SSH session does
          # not stop the script — it kills it wherever it happened to be, and
          # the run of 2026-08-12 died between `up -d` creating the containers
          # and starting them, leaving the site answering 502 with the images
          # already built. The timeout has to sit above the worst deploy, not
          # above the average one.
          command_timeout: 30m
          # Forwarded to the remote session as environment variables so the
          # values never appear in the command line the server can list.
          envs: RELEASE_SHA,DJANGO_SECRET_KEY,ALLOWED_HOSTS,CORS_ALLOWED_ORIGINS,CSRF_TRUSTED_ORIGINS,DB_HOST,DB_USER,DB_PASSWORD,DB_NAME,SERVER_IP,MINIO_ENDPOINT,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,MINIO_USE_SSL,MINIO_BUCKET_NAME,MINIO_PUBLIC_ENDPOINT,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_FRONTEND_URL,NEXT_PUBLIC_GTM_ID,NEXT_PUBLIC_GA_MEASUREMENT_ID,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NEXT_PUBLIC_GOOGLE_CLIENT_ID,EMAIL_BACKEND,EMAIL_HOST,EMAIL_PORT,EMAIL_USE_TLS,EMAIL_HOST_USER,EMAIL_HOST_PASSWORD,DEFAULT_FROM_EMAIL,FRONTEND_URL,REVALIDATE_SECRET
          script: |
            set -e
            echo "📂 Navigating to project directory..."
            cd /var/www/estatemap

            echo "📝 Creating .env.prod file..."

            # Values arrive as environment variables, not interpolated into the
            # command. Interpolating them put every production secret on the
            # remote command line, where `ps` shows it to anything running on
            # the box for as long as the deploy lasts. Inside double quotes the
            # expansion is not re-expanded, so a value containing $ or @ — the
            # MinIO key does — is written verbatim.
            umask 077
            {
              echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
              echo "DEBUG=False"
              echo "ALLOWED_HOSTS=$ALLOWED_HOSTS"
              echo "CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS"
              echo "CSRF_TRUSTED_ORIGINS=$CSRF_TRUSTED_ORIGINS"
              echo "SECURE_SSL_REDIRECT=True"
              echo "ENVIRONMENT=production"
              echo "RELEASE_SHA=$RELEASE_SHA"
              echo "OBSERVABILITY_LOG_LEVEL=INFO"
              echo "SLOW_ENDPOINT_MS=1000"
              echo "THROTTLE_EXEMPT_IPS="
              echo "IMAGE_UPLOAD_TEMP_MAX_AGE_HOURS=48"
              echo "INDEXNOW_ENABLED=True"
              echo "BACKUP_VERIFICATION_FILE=/tmp/estate-backup-verified.json"

              # Database (native on the host)
              echo "DB_HOST=$DB_HOST"
              echo "DB_USER=$DB_USER"
              echo "DB_PASSWORD=$DB_PASSWORD"
              echo "DB_NAME=$DB_NAME"
              echo "SERVER_IP=$SERVER_IP"

              # MinIO (native on the host)
              echo "MINIO_ENDPOINT=$MINIO_ENDPOINT"
              echo "MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY"
              echo "MINIO_SECRET_KEY=$MINIO_SECRET_KEY"
              echo "MINIO_USE_SSL=$MINIO_USE_SSL"
              echo "MINIO_BUCKET_NAME=$MINIO_BUCKET_NAME"
              echo "MINIO_PUBLIC_ENDPOINT=$MINIO_PUBLIC_ENDPOINT"

              # Next.js: only NEXT_PUBLIC_* reaches the browser
              echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
              echo "NEXT_PUBLIC_FRONTEND_URL=$NEXT_PUBLIC_FRONTEND_URL"
              echo "NEXT_PUBLIC_GTM_ID=$NEXT_PUBLIC_GTM_ID"
              echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=$NEXT_PUBLIC_GA_MEASUREMENT_ID"

              # Google OAuth
              echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
              echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
              echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=$NEXT_PUBLIC_GOOGLE_CLIENT_ID"

              # Email
              echo "EMAIL_BACKEND=$EMAIL_BACKEND"
              echo "EMAIL_HOST=$EMAIL_HOST"
              echo "EMAIL_PORT=$EMAIL_PORT"
              echo "EMAIL_USE_TLS=$EMAIL_USE_TLS"
              echo "EMAIL_HOST_USER=$EMAIL_HOST_USER"
              echo "EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD"
              echo "DEFAULT_FROM_EMAIL=$DEFAULT_FROM_EMAIL"

              # Frontend URL for backend links and revalidation
              echo "FRONTEND_URL=$FRONTEND_URL"
              echo "REVALIDATE_SECRET=$REVALIDATE_SECRET"
              echo "NEXT_REVALIDATE_URL=http://frontend:3000/api/revalidate"
            } > .env.prod
            chmod 600 .env.prod

            echo "🔄 Running deploy script..."
            ./scripts/deploy.sh
        env:
          RELEASE_SHA: ${{ github.sha }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_USE_SSL: ${{ secrets.MINIO_USE_SSL }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PUBLIC_ENDPOINT: ${{ secrets.MINIO_PUBLIC_ENDPOINT }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

            echo "✅ Deployment completed!"
